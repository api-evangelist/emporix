openapi: 3.2.0
info:
  title: Emporix Mixins API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Mixins across 2 of this provider''s published API definitions: emporix-site-settings-service-openapi.yml, emporix-site-settings-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2: []
tags:
- name: Mixins
