openapi: 3.2.0
info:
  title: Emporix Service Access Token API
  version: ''
  contact: {}
  description: 'Operations tagged Service Access Token across 2 of this provider''s published API definitions: emporix-oauth-service-openapi.yml, emporix-oauth-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Service Access Token
paths:
  /oauth/token:
    post:
      tags:
      - Service Access Token
      summary: Requesting a service access token
      description: 'Sends an authentication request and returns a service access token.


        **Note**: We do not support refresh tokens for service access tokens. In case your service access token expires, you need to send a new authentication request.


        Grant type parameter is always ```client_credentials```.'
      operationId: POST-oauth-request-client-credentials
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          example: application/x-www-form-urlencoded
      requestBody:
        description: ''
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessTokenRequest'
            examples:
              payloadExample:
                value:
                  client_id: '{client_id}'
                  client_secret: '{client_secret}'
                  grant_type: client_credentials
                  scope: tenant={tenant} ...
      responses:
        '200':
          description: The request was successful. A service access token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              examples:
                Response example:
                  value:
                    refresh_token_expires_in: 0
                    refresh_token: ''
                    session_idle_time: 120
                    token_type: Bearer
                    access_token: vkFuQ6oTwj8_Ye4eiRSsqMeqLYNeQRJi
                    expires_in: 14399
                    scope: tenant={tenant} ...
      servers:
      - url: https://api.emporix.io
        description: Production
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int32
        session_idle_time:
          type: integer
          format: int32
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
          format: int32
        scope:
          type: string
    AccessTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
x-refined-from:
- emporix-oauth-service-openapi.yml
- emporix-oauth-service-openapi.yml
