tags:
- name: Access Controls
paths:
  /iam/{tenant}/access-controls:
    parameters:
    - $ref: '#/components/parameters/tenant'
    get:
      tags:
      - Access Controls
      summary: Retrieving all access controls
      description: Retrieves all access controls available for the tenant. The results can be filtered by using query parameters. You can expand the result by resolving the role and resource references.
      operationId: GET-iam-list-tenant-access-controls
      parameters:
