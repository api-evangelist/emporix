    put:
      tags:
      - Access Controls
      summary: Upserting an access control
      description: 'Creates an access control when it does not exist, or updates it when it already exists for the tenant.

        If `metadata.version` is provided, optimistic locking is applied for updates.'
      operationId: PUT-iam-upsert-access-control
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlUpsertRequest'
            examples:
              example:
                value:
                  name:
                    en: Example name
                    de: Beispielname
                  description:
                    en: Example access control description
                    de: Beispielbeschreibung
                  scopes:
                  - custom.scope
                  domains:
                  - example_domain
                  restrictedTo: CUSTOMER
                  metadata:
                    version: 1
      responses:
        '201':
          description: The request was successful. The access control has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlIdResponse'
              examples:
                example:
                  value:
                    id: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
        '204':
          description: The request was successful. The access control has been updated.
        '400':
          $ref: '#/components/responses/Bad_request_400_cl'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
      security:
      - OAuth2:
        - iam.access_manage
    delete:
      tags:
      - Access Controls
      summary: Deleting an access control
      description: 'Deletes a specified access control.


        **Note**: Only user-created access controls can be deleted. Predefined access controls cannot be removed.'
      operationId: DELETE-iam-delete-access-control
      responses:
        '204':
          description: The request was successful. The access control has been deleted.
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
      security:
      - OAuth2:
        - iam.access_manage
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    ErrorResponse:
      required:
      - code
      - message
      - status
      type: object
      properties:
        resourceId:
          type:
          - string
          - 'null'
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    RolesMetadata:
      required:
      - createdAt
      - version
      type: object
      properties:
        version:
          type: integer
          description: Role document version.
          format: int32
        createdAt:
          type: string
          description: Timestamp indicating when the role was created.
          format: date-time
