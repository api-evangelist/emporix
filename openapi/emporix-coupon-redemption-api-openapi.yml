                type: integer
              type:
                pattern: '[a-z]+[a-z_]*[a-z]+'
                description: Classification of the error type, lower case with underscore eg validation_failure.
                type: string
              message:
                description: Descriptive error message for debugging.
                type: string
            required:
            - status
            - type
          examples:
            Conflict:
              value:
                type: conflict_resource
                status: 409
                message: Duplicate Coupon 'MW2023_7' on tenant 'tenantname'
    trait_unauthorized_401:
      description: Example response
      content:
        application/json:
          schema:
            type: object
            properties:
              fault:
                type: object
                properties:
                  faultstring:
                    type: string
                  detail:
                    type: object
                    properties:
                      errorcode:
                        type: string
          examples:
            Unauthorized:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
  headers:
    Total-Count:
      required: false
      description: 'The total number of objects that fulfil the criteria.

        '
      schema:
        type: integer
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.emporix.io/oauth/token
          scopes:
            coupon.coupon_read: Needed to read coupons.
            coupon.coupon_manage: Needed to manage coupons.
            coupon.coupon_redeem: Needed to redeem coupons.
            coupon.coupon_redeem_on_behalf: Needed to redeem coupons on behalf of another customer.
