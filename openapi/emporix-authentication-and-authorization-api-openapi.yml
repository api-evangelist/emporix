openapi: 3.2.0
info:
  title: Emporix Authentication and authorization API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Authentication and authorization across 2 of this provider''s published API definitions: emporix-customer-management-openapi.yml, emporix-customer-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Authentication and authorization
  description: Create and manage customer access tokens.
paths:
  /customerlogin/auth/anonymous/login:
    get:
      tags:
      - Authentication and authorization
      summary: Requesting an anonymous token
      description: 'Sends an authentication request and returns an anonymous token. This operation causes creation of a new session-context document.


        Anonymous token is valid for one hour. After that time it should be refreshed in order to keep the same session ID associated.'
      operationId: GET-oauth-generate-anonymous-access-token
      parameters:
      - name: tenant
        in: query
        description: 'Name of the tenant.


          **Note**: Name of the tenant is always written in lowercase.

          '
        required: true
        schema:
          type: string
          example: '{tenant}'
      - name: client_id
        in: query
        description: Your Emporix API key - client ID.
        required: true
        schema:
          type: string
          example: '{client_id}'
      - name: currency
        in: query
        description: Three-letter currency code to set in the session context.
        required: false
        schema:
          type: string
          example: EUR
      - name: siteCode
        in: query
        description: Code of the site to set in the session context, as defined in the Site Settings Service.
        required: false
        schema:
          type: string
          example: main
      - name: language
        in: query
        description: Language to set in the session context.
        required: false
        schema:
          type: string
          example: EN
      - name: targetLocation
        in: query
        description: Country code to set in the session context, as defined in the Country Service.
        required: false
        schema:
          type: string
          example: DE
      responses:
        '200':
          description: The request was successful. An anonymous token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousAccessToken'
              examples:
                Response example:
                  value:
                    token_type: Bearer
                    access_token: tpYgJPZqddEQ2zwfzNtx79noBP65
                    expires_in: 3599
                    refresh_token: 7FnviYrxvQWYdzUVBVTvXeNAA4Jy1HPe
                    refresh_token_expires_in: 86399
                    sessionId: 6d4d4d5e-04b9-40c5-9074-4df1405c6081
                    scope: tenant={tenant}
      servers:
      - url: https://api.emporix.io
        description: Production
    servers:
    - url: https://api.emporix.io
  /customerlogin/auth/anonymous/refresh:
    get:
      tags:
      - Authentication and authorization
      summary: Refreshing an anonymous token
      description: 'Sends an authentication request and returns new anonymous token with same session ID attached.


        This operation causes update of a session-context document with given session ID.


        Anonymous token is valid for one hour. After that time, another refresh anonymous token request should be sent.'
      operationId: GET-oauth-refresh-anonymous-access-token
      parameters:
      - name: tenant
        in: query
        description: 'Name of the tenant.


          **Note**: Name of the tenant is always written in lowercase.

          '
        required: true
        schema:
          type: string
          example: '{tenant}'
      - name: anonymous_token
        in: query
        description: 'NOTE: It''s recommended to use `refresh_token` parameter instead. <br>Anonymous token that needs to be refreshed so that the same session ID will be kept. Provide the value of the `access_token` you get in response to requesting a token request.'
        required: true
        deprecated: true
        schema:
          type: string
          example: '{GOToGKaEKFyR8DokPBwHH0Y3AKCo}'
      - name: refresh_token
        in: query
        description: A refresh token generated when the anonymous token is created.
        required: true
        schema:
          type: string
          example: '{7FnviYrxvQWYdzUVBVTvXeNAA4Jy1HPe}'
      - name: client_id
        in: query
        description: Your Emporix API key - client ID.
        required: true
        schema:
          type: string
          example: '{client_id}'
      responses:
        '200':
          description: The request was successful. An anonymous token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousAccessToken'
              examples:
                Response example - Anonymous Token:
                  value:
                    token_type: Bearer
                    access_token: tpYgJPZqddEQ2zwfzNtx79noBP65
                    expires_in: 3599
                    refresh_token: 7FnviYrxvQWYdzUVBVTvXeNAA4Jy1HPe
                    refresh_token_expires_in: 86399
                    sessionId: 6d4d4d5e-04b9-40c5-9074-4df1405c6081
                    scope: tenant={tenant}
                Response example - Refresh Token (deprecated):
                  value:
                    token_type: Bearer
                    access_token: Zq91ySuLxLIzQ0vd0QxiC7imAIHi
                    expires_in: 3599
                    sessionId: 5b7ae416-5d88-4dd9-bbe9-6b262f45b4e8
                    scope: tenant={tenant}
      servers:
      - url: https://api.emporix.io
        description: Production
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/signup:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
              examples:
                Response example:
                  value:
                    id: '13730481'
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden'
        '409':
          $ref: '#/components/responses/409_conflict'
      description: 'Creates a new customer account.


        **Note**: The request needs to be authorized with an anonymous access token.'
      operationId: POST-customer-create-customer-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSignup'
            examples:
              Create account:
                value:
                  email: example@customer.com
                  password: password123
                  customerDetails:
                    title: MR
                    firstName: John
                    middleName: ''
                    lastName: Doe
                    contactEmail: example@customer.com
                    contactPhone: '123456789'
                    company: Emporix
                    preferredLanguage: en_US
                    preferredCurrency: EUR
                    preferredSite: main
                    b2b:
                      companyRegistrationId: 123-456-789
                  customerAddress:
                    contactName: John Doe
                    companyName: Emporix
                    street: Platz der Republik
                    streetNumber: '1'
                    streetAppendix: ''
                    extraLine1: ''
                    extraLine2: ''
                    zipCode: '11011'
                    city: Berlin
                    country: DE
                    state: Berlin
                    contactPhone: '123456789'
                    tags:
                    - BILLING
                    - SHIPPING
              Create account with separate sign-up credentials:
                value:
                  email: example@customer.com
                  password: password123
                  customerDetails:
                    title: MR
                    firstName: Jane
                    middleName: ''
                    lastName: Doe
                    contactEmail: example@customer.com
                    contactPhone: '123456789'
                    company: Emporix
                    preferredLanguage: en_US
                    preferredCurrency: EUR
                    preferredSite: main
                    b2b:
                      companyRegistrationId: 123-456-789
                  customerAddress:
                    contactName: Jane Doe
                    companyName: Emporix
                    street: Platz der Republik
                    streetNumber: '1'
                    streetAppendix: ''
                    extraLine1: ''
                    extraLine2: ''
                    zipCode: '11011'
                    city: Berlin
                    country: DE
                    state: Berlin
                    contactPhone: '123456789'
                    tags:
                    - BILLING
                    - SHIPPING
                  signup:
                    email: signup-example@customer.com
                    password: password1234
        required: false
        description: ''
      security:
      - AnonymousAccessToken: []
      summary: Creating a new customer
      tags:
      - Authentication and authorization
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/login:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      responses:
        '200':
          description: The request was successful. A customer token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerToken'
              examples:
                Response example:
                  value:
                    access_token: aYR3Lu3rpsQ9ODhBIR83b3txTr5K
                    saas_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMzg2OTAwMCIsImV4cCI6MTY0MDQ0NDAzMn0.lvxFOeCOk-DWi3kqwJwR8eKal3ON2rr53e9I6Pha5rI
                    expires_in: 2591999
                    refresh_token: 94tKQ2Tsvlf9dYbmyccA7X1Rqe54B6dH
                    refresh_token_expires_in: 86399
                    token_type: Bearer
                    session_id: 45c9726e-77c8-4bd0-b29d-61ab56f59726
                    initialPassword: false
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
      description: 'Logs in a customer and sends an authentication request.

        Returns two customer tokens:

        - Customer access token

        - Customer SaaS token


        **Note**: The request needs to be authorized with an anonymous access token.'
      operationId: POST-customer-authenticate-customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordAuthentication'
            examples:
              Request example:
                value:
                  email: customer@customer.com
                  password: password123
        required: true
      security:
      - AnonymousAccessToken: []
      summary: Logging in a customer
      tags:
      - Authentication and authorization
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/logout:
    parameters:
    - $ref: '#/components/parameters/tenant'
    get:
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
      description: 'Logs out a customer and invalidates their customer token.


        **Note**: The request needs to be authorized with a customer access token.'
      operationId: GET-customer-logout-customer
      security:
      - CustomerAccessToken: []
      parameters:
      - name: accessToken
        in: query
        required: true
        description: Customer access token to be invalidated.
        schema:
          type: string
      tags:
      - Authentication and authorization
      summary: Logging out a customer
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/refreshauthtoken:
    parameters:
    - $ref: '#/components/parameters/tenant'
    get:
      responses:
        '200':
          description: The request was successful. A refresh token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshCustomerToken'
              examples:
                Response example:
                  value:
                    access_token: 2yXy8H7sByl4JSWrr7GRqxiCRMUm
                    expires_in: 2591999
                    refresh_token: iwXAFjGwboaehJar1qNOkV05phDw1god
                    refresh_token_expires_in: 86390
                    token_type: Bearer
                    session_id: 45c9726e-77c8-4bd0-b29d-61ab56f59726
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
      description: 'Sends an authentication request and returns a refresh token.


        **Note**: The request needs to be authorized with an anonymous access token.'
      operationId: GET-customer-refresh-authtoken
      tags:
      - Authentication and authorization
      parameters:
      - name: tenant
        in: path
        description: 'Name of the tenant.


          **Note**: Name of the tenant is always written in lowercase.

          '
        required: true
        schema:
          type: string
        example: '{tenant}'
      - name: Authorization
        in: header
        description: Customer access token generated when the customer token is created.
        required: true
        schema:
          type: string
        example: Bearer {{CUSTOMER_ACCESS_TOKEN}}
      - name: refreshToken
        in: query
        description: Customer refresh token generated when a customer token is requested.
        required: true
        schema:
          type: string
          example: '{customer_refresh_token}'
      - name: legalEntityId
        in: query
        description: Identifier of the legal entity associated with the user session.
        schema:
          type: string
      summary: Refreshing a customer token
      security:
      - AnonymousAccessToken: []
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/validateauthtoken:
    get:
      tags:
      - Authentication and authorization
      summary: Validate a token
      description: Checks whether a token is valid. If the token is invalid, it returns a 401 status code. If the token is valid, it provides the token details.
      operationId: GET-customer-validate-token
      parameters:
      - name: tenant
        in: path
        description: 'Name of the tenant.


          **Note**: Name of the tenant is always written in lowercase.

          '
        required: true
        schema:
          type: string
        example: '{tenant}'
      - name: Authorization
        in: header
        description: Customer access token generated upon the customer token creation.
        required: true
        schema:
          type: string
        example: Bearer {{CUSTOMER_ACCESS_TOKEN}}
      responses:
        '200':
          description: The request was successful. A token details are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                Validation response:
                  value:
                    token_type: Bearer
                    expires_in: 2591974
                    scope: approval.approval_read_own customermanagement.legalentity_read_own customer.customer_read_own quote.quote_read_own returns.returns_read_own iam.scope_read_own iam.user_read_own customersegment.segment_read_own iam.group_read_own order.order_readascustomer coupon.coupon_redeem customer.customerprofile_edit quote.quote_manage_own returns.returns_manage_own customer.customer_manage_own approval.approval_manage_own order.order_updateascustomer iam.assignment_delete_own customer.consent_view customer.customerprofile_view order.history_view iam.assignment_create_own customer.consent_manage tenant=test
                    sessionId: 415c340b-5996-4112-bb3b-38139a409f93
                    email: customer@example.com
                    legalEntityId: 53ac81fd0cce8b26b36f3492
        '401':
          description: Unauthorized
      security:
      - CustomerAccessToken: []
      servers:
      - url: https://api.emporix.io
        description: Production
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/exchangeauthtoken:
    post:
      tags:
      - Authentication and authorization
      summary: Exchanging an external access token for an Emporix customer token
      description: 'Exchanges an external access token (for example, from an identity provider such as Keycloak) for an Emporix customer access token.


        **Note**: The request needs to be authorized with an anonymous token.'
      operationId: POST-customer-exchange-authtoken
      parameters:
      - $ref: '#/components/parameters/tenant'
      - name: subjectAccessToken
        in: query
        description: The subject access token (JWT) to exchange for a customer token.
        required: true
        schema:
          type: string
        example: '{subject_access_token}'
      - name: config
        in: query
        description: 'Configuration identifier (for example, `site_PL`). If not provided, the default configuration is used.

          If a non-existing configuration is provided, the request returns 400 Bad Request.

          '
        required: false
        schema:
          type: string
        example: site_PL
      - name: Authorization
        in: header
        description: Anonymous token used to authorize the exchange.
        required: true
        schema:
          type: string
        example: Bearer {anonymous_token}
      responses:
        '200':
          description: The request was successful. A customer token is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAuthTokenResponse'
              examples:
                Response example:
                  value:
                    subject_access_token: eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJqTEF2MmJINlhaVHNpZHBEZUNsNjFrNEJWTlREckRHRDV3Um1ETlQxNmpvIn0...
                    access_token: dEKATUWeewkraTlIzjVZBbGg7BQQ
                    saas_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJDMDAzMyIsImV4cCI6MTc3MTI3MzEwNiwiaWF0IjoxNzcxMjU4NzA2LCJqdGkiOiI0NTU0NzMzYS01NDY4LTRjYzctYjRiZS01OGZiMzA2Y2FhMGEifQ.5536UTfZ3KmNPbMDp5ZLRIeYwMV-P1jN5DUT2ZLu2qc
                    refresh_token: QtvQi9UAYS9GIbEGu73ERUmfdC569MBE
                    refresh_token_expires_in: 15551999
                    session_idle_time: 120
                    token_type: Bearer
                    expires_in: 14399
                    scope: customer.customerprofile_edit approval.approval_manage_own returns.returns_manage_own iam.scope_read_own customersegment.segment_read_own customer.consent_view quote.quote_read_own customermanagement.legalentity_read_own approval.approval_read_own ai.agentexecution_manage_own returns.returns_read_own order.order_readascustomer order.order_updateascustomer customer.consent_manage quote.quote_manage_own order.history_view coupon.coupon_redeem customer.customerprofile_view tenant=cockpitsdev
                    session_id: 14ccc133-5731-4d6c-8f38-ca82443e4e4e
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden'
      security: []
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/socialLogin:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      summary: Logging in a customer with social login
      operationId: POST-customer-login-customer-by-auth0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  social_access_token:
                    type: string
                  social_id_token:
                    type: string
                  refresh_token:
                    type: string
                  refresh_token_expires_in:
                    type: string
                  session_idle_time:
                    type: integer
                  token_type:
                    type: string
                  access_token:
                    type: string
                  saas_token:
                    type: string
                  expires_in:
                    type: string
                  scope:
                    type: string
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
      parameters:
      - schema:
          type: string
        in: header
        name: session-id
        description: Anonymous customer unique session identifier.
        required: false
      - schema:
          type: string
        in: query
        name: code
        description: The authorization code received from the identity provider.
        required: true
      - schema:
          type: string
        in: query
        name: redirect_uri
        description: The redirect URI that was used in the initial authorization request.
        required: true
      - schema:
          type: string
        in: query
        name: code_verifier
        description: Required only if using PKCE (Proof Key for Code Exchange) flow.
        required: false
      description: Logs in a customer using an authentication code from Auth0 and retrieves a standard customer token.
      tags:
      - Authentication and authorization
      security:
      - AnonymousAccessToken: []
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    ErrorMessage:
      title: ''
      description: Schema for API-specific errors.
      type: object
      properties:
        status:
          minimum: 100
          maximum: 599
          description: Original HTTP error code. It should be consistent with the HTTP response code.
          type: integer
        type:
          pattern: '[a-z]+[a-z_]*[a-z]+'
          description: 'Classification of the error type.

            **Note:** The error type should be written in lowercase and include underscores, for example `validation_failure`.'
          type: string
        message:
          description: Descriptive error message for debugging purposes.
          type: string
        moreInfo:
          type: string
          description: More information (such as a link to the documentation) for investigating further and getting support.
        details:
          description: List of problems causing the error.
          type: array
          items:
            title: errorDetail
            description: Specific error cause.
            type: object
            properties:
              field:
                description: 'Element in request data which is causing the error, for example `category.name`.

                  If the violation was not field-specific, this field will be empty.'
                type: string
              type:
                pattern: '[a-z]+[a-z_]*[a-z]+'
                description: 'Classification of the specific error cause. This value should always be interpreted within the context of the general error type.

                  **Note:** The error type should be written in lowercase and include underscores, for example `missing_value`.'
                type: string
              message:
                description: Descriptive error message for debugging purposes.
                type: string
              moreInfo:
                type: string
                description: More information (such as a link to the documentation) for investigating further and getting support.
    B2BCreate:
      type: object
      description: Additional properties for B2B customer. If the `companyRegistrationId` property is provided, an additional validation for customer details executes - `firstName`, `lastName` and `company` values have to be provided.
      properties:
        companyRegistrationId:
          type: string
          description: Registration number of the company.
    CustomerSignup:
      type: object
      properties:
        email:
          minLength: 1
          example: john.doe@emporix.com
          type: string
          description: Customer email address.
        password:
          minLength: 1
          type: string
          description: Customer account password.
        customerDetails:
          $ref: '#/components/schemas/CustomerUpdateDto'
          description: If customer details are provided, the `contactEmail` value has to be the same as in the `email` property of the contact.
        customerAddress:
          $ref: '#/components/schemas/Address'
        signup:
          $ref: '#/components/schemas/PasswordAuthentication'
          description: Customer email and password used for separate login credentials to the frontend. Use these if you want to log in with a different email than the main contact email.
      required:
      - email
      - password
    BasicMetadataDto:
      title: DefaultDtoMetadata
      type: object
      properties:
        mixins:
          type: object
          additionalProperties: true
      description: Links to mixin schemas.
    CustomerToken:
      description: ''
      type: object
      allOf:
      - $ref: '#/components/schemas/RefreshCustomerToken'
      properties:
        saasToken:
          type: string
          minLength: 1
          deprecated: true
        saas_token:
          type: string
          minLength: 1
        initialPassword:
          type: string
          description: Indicates if login was performed with password created by an employee
    ExchangeAuthTokenResponse:
      description: Response returned when exchanging an external subject access token for an Emporix customer token.
      type: object
      properties:
        subject_access_token:
          type: string
          description: The subject access token (JWT) that was exchanged.
        access_token:
          type: string
          minLength: 1
          description: Customer access token.
        saas_token:
          type: string
          minLength: 1
          description: SaaS token for the session.
        refresh_token:
          type: string
          minLength: 1
          description: Token used to refresh the customer access token.
        refresh_token_expires_in:
          type: integer
          format: int32
          description: Expiration time of the refresh token in seconds.
        session_idle_time:
          type: integer
          format: int32
          description: Session idle time in seconds.
        token_type:
          type: string
          description: Type of the token. Usually `Bearer`.
        expires_in:
          type: integer
          format: int32
          description: Expiration time of the access token in seconds.
        scope:
          type: string
          description: List of scopes assigned to the customer.
        session_id:
          type: string
          description: Session identifier.
    CustomerCommonDto:
      title: CustomerCommonDto
      type: object
      properties:
        title:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        contactPhone:
          type: string
        company:
          type: string
        preferredLanguage:
          type: string
          default: en_US
          description: Customer preferred language.
        preferredCurrency:
          type: string
          default: USD
          description: Customer's preferred currency, compliant with the ISO 4217 standard.
          minLength: 3
          maxLength: 3
        preferredSite:
          type: string
          default: main
          description: Customer preferred site.
        b2b:
          $ref: '#/components/schemas/B2BCreate'
        metadata:
          $ref: '#/components/schemas/DefaultDtoMetadata'
        mixins:
          type: object
          description: Customer account additional properties.
          additionalProperties: true
    CustomerUpdateDto:
      allOf:
      - $ref: '#/components/schemas/CustomerCommonDto'
      - type: object
        properties:
          contactEmail:
            type: string
    ValidateTokenResponse:
      type: object
      x-stoplight:
        id: rjgbt7z8oqzgq
      properties:
        token_type:
          type: string
