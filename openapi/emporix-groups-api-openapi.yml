                    userId: 0p9194ip48TiObqQW417
                    userType: EMPLOYEE
                  - id: 325776bc-d548-4ec8-8e06-c01491311177
                    groupId: 12gr5e52e-6e27-4ac5-9471-2467d3fb7502
                    userId: 00u0p9ip48TiObqQW411
