                    countryOfRegistration: DE
                    taxRegistrationNumber: '1234'
                    accountLimit:
                      currency: EUR
                      value: 1000.99
                  customerGroups:
                  - id: 123e06ecf0452c2d6c0b81390
                    name:
                      en: Customer group 1
                      fr: Groupe de clients 1
                  - id: 123e06ecf0452c2d6c0b12345
                    name:
                      en: Customer group 2
                      fr: Groupe de clients 2
                  entitiesAddresses:
                  - id: 627e06ecf0452c2d6c0b81391
                    name: Main HQ
                    type: HEADQUARTER
                    contactDetails:
