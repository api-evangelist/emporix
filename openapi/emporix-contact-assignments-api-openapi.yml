    BadRequest_400:
      description: Request was syntactically incorrect. Details will be provided in the response payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Ambiguous tenant:
              $ref: '#/components/examples/BadRequest400_AmbiguousTenant'
    NotFound_404:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Legal Entity not found:
              $ref: '#/components/examples/NotFound404_LegalEntityNotFound'
    InternalServiceError_500:
      description: Internal Service Error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Internal service error:
              $ref: '#/components/examples/InternalServiceError500_Example'
    Forbidden_403:
      description: Given authorization scopes are not sufficient and do not match scopes required by the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Access to resource is forbidden:
              $ref: '#/components/examples/Forbidden403_Example'
    BadRequest_400_Update:
      description: Request was syntactically incorrect. Details will be provided in the response payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Ambiguous tenant:
              $ref: '#/components/examples/BadRequest400_AmbiguousTenant'
            Document version not specified:
              $ref: '#/components/examples/BadRequest400_VersionNotSpecified'
    Unauthorized_401:
      description: Given request is unauthorized - the authorization token is invalid or has expired. Details will be provided in the response payload.
      content:
        application/json:
          schema:
            type: object
            properties:
              fault:
                type: object
                properties:
                  faultstring:
                    type: string
                  detail:
                    type: object
                    properties:
                      errorcode:
                        type: string
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
    Conflict_409:
      description: Given resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Access to resource is forbidden:
              $ref: '#/components/examples/Conflict409_Example'
  parameters:
    trait_fields:
      in: query
      name: fields
      required: false
      description: Comma-separated list of fields to return in the response. If not specified, all fields are returned.
      schema:
        type: string
        example: name,type
    trait_paged_pageNumber:
      name: pageNumber
      in: query
      description: 'The page number to be retrieved where the size of the pages must be specified by the pageSize parameter.

        The number of the first page is 1.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    trait_XTotalCount_header:
      in: header
      name: X-Total-Count
      required: false
      description: In order to get information how many entities meet a filter requirements, X-Total-Count header has been introduced. The header is optional and its default value is false. It the header is provided and it is true then total count is returned in the X-Total-Count response header. In both cases (X-Total-Count true, false or not provided), the response body has the same format (array of entities). In other words, the information about total count is returned on demand, depending of an existence of X-Total-Count header in a request. Therefore, the X-Total-Count header is not returned if an API consumer didn't ask for it.
      schema:
        default: false
        type: boolean
    trait_q_param:
      in: query
      name: q
      required: false
      description: "Query param for filtering entities by specified type. Examples of query params which are supported:\n\n| Q Param                                                                            | Description                                                                                                                          |\n|------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|\n| `name:\"Exact match\"`                                                               | find an entity with `name` field with `Exact match` value                                                                            |\n| `name:~John`                                                                       | find an entity with `name` field containing `John` value                                                                             |\n| `locDescription.fr:\"Description traduction française 02\"`                          | find an entity with localized `locDescription` field with `Description traduction française 02` value in french language             |      \n| `primary:true`                                                                     | find an entity with `primary` field with `true` value                                                                                |\n| `metadata.createdAt:(>\"2019-01-06T10:29:30.602Z\" AND <\"2020-01-07T10:29:30.602Z\")` | find an entity with `metadata.createdAt` field with value between `2019-01-06T10:29:30.602Z` and `2020-01-07T10:29:30.602Z`          |\n| `name:exists`                                                                      | find an entity with existing `name` field                                                                                            |\n| `name:null`                                                                        | find an entity with non-existing `name` field                                                                                        |\n| `name:missing`                                                                     | find an entity with non-existing `name` field                                                                                        |\n| `name:\"John\" surname:~Smith`                                                       | find an entity with `name` exactly equals to `John` and surname containing `Smith` value                                             |\n| `name:(\"John\",\"Jack\",\"James\")`                                                     | find an entity with `name` field with one of the following value: `John` or `Jack` or `James`                                        |\n"
      schema:
        type: string
        example: name:~john
    trait_contactAssignment_customer_query_param:
      name: customer.id
      in: query
      required: false
      schema:
        type: string
      description: 'The id of the customer. When specified, only customer assignments attached to the specified customer will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_paged_pageSize:
      name: pageSize
      in: query
      description: 'The number of documents being retrieved on the page.

        '
      schema:
        default: 16
        minimum: 1
        type: integer
    trait_contactAssignment_primary_query_param:
      name: primary
      in: query
      required: false
      schema:
        type: boolean
      description: 'The primary customer flag. When specified, only customers with the specified primary flag value will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_sort:
      in: query
      name: sort
      required: false
      description: Fields to sort the response data by following order of the parameters from left to right. Can contain multiple fields in format: field name:sort direction separated by a comma. The colon with sort direction parameter is redundant and descending order is taken only if it is equal to desc or DESC. Ascending order is considered in any other case.
      schema:
        type: string
        example: name,metadata.createdAt:desc
    trait_contactAssignment_type_query_param:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - PRIMARY
        - BILLING
        - LOGISTICS
        - CONTACT
      description: 'The type of the customer assignment. When specified, only customer assignments with the specified type will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_contactAssignment_legalEntity_query_param:
      name: legalEntity.id
      in: query
      required: false
      schema:
        type: string
      description: 'The id of the legal entity. When specified, only customer assignments attached to the specified legal entity will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
  schemas:
    metadataUpdate:
      type: object
      properties:
        version:
          minimum: 1
          type: integer
          description: Version of the document.
        mixins:
          type: object
          description: Links to the mixin schemas. A map where the keys represent mixins set attributes and the values represent url to a schema for a particular set.
          additionalProperties: true
    contactAssignmentCreate:
      title: Contact Assignment create payload
      type: object
      properties:
        id:
          type: string
          description: Custom assignment identifier. If not provided, it is automatically generated.
          minLength: 1
          maxLength: 66
          pattern: ^[a-zA-Z0-9_-]$
        legalEntity:
          type: object
          description: The legal entity unique identifier.
          required:
          - id
          properties:
            id:
              type: string
              description: The unique identifier of the legal entity.
        customer:
          type: object
          description: The customer unique identifier.
          required:
          - id
          properties:
            id:
              type: string
              description: The unique identifier of the customer.
        type:
          type: string
          enum:
          - PRIMARY
          - BILLING
          - LOGISTICS
          - CONTACT
          description: The type of the customer assignment. If not provided, it is set to `Contact` by default.
        primary:
          type: boolean
          default: false
          description: Indicates whether the customer is primary.
        metadata:
          $ref: '#/components/schemas/metadata_create'
        mixins:
          type: object
          description: Mixins request. A map where a key represent mixins set name and a value represent a map with key-value pairs.
          additionalProperties: true
      required:
      - legalEntity
      - customer
    contactAssignment:
      title: Contact Assignment
      type: object
      properties:
        id:
          type: string
          description: The customer assignment unique identifier.
        legalEntity:
          $ref: '#/components/schemas/legalEntity'
        customer:
          $ref: '#/components/schemas/customer'
        type:
          type: string
          enum:
          - PRIMARY
          - BILLING
          - LOGISTICS
          - CONTACT
          description: The type of the customer assignment.
        primary:
          type: boolean
          description: Indicates whether the customer is primary.
        metadata:
          $ref: '#/components/schemas/metadata'
        mixins:
          type: object
          description: Mixins request. A map where a key represent mixins set name and a value represent a map with key-value pairs.
          additionalProperties: true
    contactAssignmentUpdate:
      title: Contact Assignment update payload
      type: object
      properties:
        legalEntity:
          type: object
          description: The legal entity unique identifier.
          required:
          - id
          properties:
            id:
              type: string
              description: The unique identifier of the legal entity.
        customer:
          type: object
          description: The customer unique identifier.
          required:
          - id
          properties:
            id:
              type: string
              description: The unique identifier of the customer.
        type:
          type: string
          enum:
          - PRIMARY
          - BILLING
          - LOGISTICS
          - CONTACT
          description: The type of the customer assignment.
        primary:
          type: boolean
          default: false
          description: Indicates whether the customer is primary.
        metadata:
          $ref: '#/components/schemas/metadataUpdate'
        mixins:
          type: object
          description: Mixins request. A map where a key represent mixins set name and a value represent a map with key-value pairs.
          additionalProperties: true
      required:
      - legalEntity
