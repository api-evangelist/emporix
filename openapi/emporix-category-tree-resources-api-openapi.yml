openapi: 3.2.0
info:
  title: Emporix Category Tree Resources API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Category Tree Resources across 2 of this provider''s published API definitions: emporix-category-tree-openapi.yml, emporix-category-tree-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2:
  - category.category_manage
  - category.category_read_unpublished
  - category.category_publish
  - category.category_unpublish
tags:
- name: Category Tree Resources
  description: Read Category Trees
paths:
  /category/{tenant}/categories/categoryTree:
    parameters:
    - name: tenant
      in: path
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      required: true
      schema:
        maxLength: 16
        minLength: 3
        pattern: ^[a-z][a-z0-9]{2,15}$
        type: string
    get:
      tags:
      - Category Tree Resources
      summary: Retrieving a category tree
      description: 'Retrieves a category tree.


        **Note**: By default, only published categories are retrieved.'
      operationId: GET-category-tree-retrieve-category-tree-deprecated
      responses:
        '200':
          description: The request was successful. The category tree is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDeprecated'
              examples:
                example:
                  value:
                    id: '38118'
                    name: ProductRoot
                    code: productroot
                    description: '{"type":"ProductRoot"}'
                    position: 55555
                    published: true
                    subcategories:
                    - id: '38119'
                      parentId: '38118'
                      name: Fruits & Vegetables
                      code: fruits-&-vegetables
                      description: Fresh and tasty fruits and vegetables.
                      position: 0
                      published: true
                      subcategories:
                      - id: '38120'
                        parentId: '38119'
                        name: Fruit
                        code: fruit
                        position: 0
                        published: true
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example:
                  value:
                    status: 400
                    message: There are validation problems, see details section for more information
                    type: validation_violation
                    details:
                    - field: tenant
                      message: size must be between 1 and 16
                      type: invalid_header
        '401':
          description: 'Given request is unauthorized - the authorization token is invalid or has expired.


            Details will be provided in the response payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                expired:
                  value:
                    fault:
                      faultstring: Access Token expired
                      detail:
                        errorcode: keymanagement.service.access_token_expired
                invalid:
                  value:
                    fault:
                      faultstring: Invalid access token
                      detail:
                        errorcode: oauth.v2.InvalidAccessToken
        '403':
          description: Given authorization scopes are not sufficient and do not match scopes required by the endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                insufficient_permissions:
                  value:
                    type: insufficient_permissions
                    status: 403
                    message: User not authorized.
        '404':
          description: The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example:
                  value:
                    type: resource_not_found
                    status: 404
                    message: HTTP 404 Not Found
        '500':
          description: Some server-side error occurred. Details will be provided in the response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example:
                  value:
                    type: internal_service_error
                    status: 500
                    message: Something went wrong while processing the request. The error has been logged under code 20210819_095055_677_vwurkrl.
      deprecated: true
      security: []
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/category-trees:
    get:
      tags:
      - Category Tree Resources
      summary: Retrieving the category trees
      description: 'Retrieves the category trees.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: GET-category-tree-retrieve-category-tree
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: categoryIds
        in: query
        description: 'List of category IDs. If provided, the response returns only the category trees that include at least one of the specified categories.

          '
        schema:
          type: array
          items:
            type: string
          example:
          - d9e4fdd0-e671-4968-9ba1-a5533a7f3b02
          - 0f1056cc-b4b4-488b-9f95-245f6b542702
      responses:
        '200':
          description: The request was successful. The category tree is returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_read_unpublished'
      security:
      - OAuth2:
        - category.category_read_unpublished
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/category-trees/search:
    post:
      tags:
      - Category Tree Resources
      summary: Searching for category trees
      description: 'Searches for category trees.

        ***

        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: POST-category-tree-search-category-trees
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: Content-Language
        in: header
        description: 'The Content-Language request HTTP header defines language(s) that can be used in the payload. Request body may contain only translations that are matching the languages specified in the header. Possible values:

          * `*` - request body may contain translations for all languages specified in tenant configuration. This is also the default behaviour if the header is not set.

          * `en`, `en,de`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - request body may contain only translations for languages specified in the header (if they are available in tenant configuration).


          **Note**: For category requests, localized fields (such as `localizedName`, `localizedDescription`, `localizedSlug`) must always be provided as maps of language codes to values, regardless of the Content-Language header value.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryTreeSearchRequest'
        required: true
      responses:
        '200':
          description: The request was successful. The category tree is returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    message: There is a validation error. Please check the details.
                    code: 400
                    status: Bad Request
                    details:
                    - field: searchCategoryTree.searchRequest.categoryIds
                      message: 'searchRequest.categoryIds: must not be null'
      security:
      - OAuth2:
        - category.category_read_unpublished
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/category-trees/{categoryId}:
    get:
      tags:
      - Category Tree Resources
      summary: Retrieving a specific category tree
      description: 'Retrieves a category tree for a root category with a given id.


        **Note:** You can retrieve a category tree only for a root category. It is not possible to get a category tree for a category that lies lower in the hierarchy.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: GET-category-tree-retrieve-category-tree-by-id
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: categoryId
        in: path
        description: 'A unique identifier of a root category, generated when the category is created.

          '
        required: true
        deprecated: false
        allowEmptyValue: false
        allowReserved: false
        schema:
          type: string
          example: 12a24ba108-e6fd-4139-b831-5ac5fded6d34
        example: ''
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: Content-Language
        in: header
        description: 'The Content-Language request HTTP header defines language(s) that can be used in the payload. Request body may contain only translations that are matching the languages specified in the header. Possible values:

          * `*` - request body may contain translations for all languages specified in tenant configuration. This is also the default behaviour if the header is not set.

          * `en`, `en,de`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - request body may contain only translations for languages specified in the header (if they are available in tenant configuration).


          **Note**: For category requests, localized fields (such as `localizedName`, `localizedDescription`, `localizedSlug`) must always be provided as maps of language codes to values, regardless of the Content-Language header value.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      responses:
        '200':
          description: The request was successful. The category tree is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_read_unpublished'
        '404':
          description: Category tree with specified id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    resourceId: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
                    code: 404
                    status: Not Found
                    message: Error while getting category tree
                    details:
                    - Category tree for category with id '084bcaf6-66b8-4ddd-9489-65c5f6449e94' not found
      security:
      - OAuth2:
        - category.category_read_unpublished
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/category-trees/{rootCategoryId}/rebuild:
    post:
      tags:
      - Category Tree Resources
      summary: Rebuilding a category tree
      description: 'Rebuilds the category tree for a given root category and returns the result.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: POST-category-tree-rebuild-category-tree
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: rootCategoryId
        in: path
        description: 'A unique identifier of the root category whose tree should be rebuilt.

          '
        required: true
        schema:
          type: string
          example: 12a24ba108-e6fd-4139-b831-5ac5fded6d34
      - name: showUnpublished
        in: query
        description: 'If set to `true`, unpublished categories are included in the returned tree.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      responses:
        '200':
          description: The request was successful. The newly rebuilt category tree is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
        '403':
          description: Permission denied due to insufficient rights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_manage'
        '404':
          description: Root category with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    resourceId: 12a24ba108-e6fd-4139-b831-5ac5fded6d34
                    code: 404
                    status: Not Found
                    message: Error while getting category tree
                    details:
                    - Category tree for category with id '12a24ba108-e6fd-4139-b831-5ac5fded6d34' not found
      security:
      - OAuth2:
        - category.category_manage
        - category.category_read_unpublished
    servers:
    - url: https://api.emporix.io
