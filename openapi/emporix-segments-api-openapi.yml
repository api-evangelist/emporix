openapi: 3.2.0
info:
  title: Emporix Segments API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Segments across 2 of this provider''s published API definitions: emporix-customer-segments-openapi.yml, emporix-customer-segments-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2: []
tags:
- name: Segments
  description: Manage segments
paths:
  /customer-segment/{tenant}/segments:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      summary: Creating a customer segment
      tags:
      - Segments
      operationId: POST-customer-segment-create-segment
      description: Creates a new customer segment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentCreation'
            examples:
              Segment Creation:
                $ref: '#/components/examples/SegmentCreation'
      responses:
        '201':
          description: Customer segment was successfully created.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
              example:
                id: 628cd20c6e8b2432b6346ca6
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
        '409':
          $ref: '#/components/responses/Common_response_Conflict_409'
      parameters:
      - $ref: '#/components/parameters/contentLanguage'
      security:
      - OAuth2:
        - customersegment.segment_manage
    get:
      summary: Retrieving all customer segments
      tags:
      - Segments
      operationId: GET-customer-segment-retrieve-segments
      responses:
        '200':
          description: Customer segments were successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentResponse'
              examples:
                Segments Response:
                  $ref: '#/components/examples/SegmentsResponse'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      description: Retrieves all customer segments.
      parameters:
      - $ref: '#/components/parameters/qParam'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/xTotalCount'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/legalEntityId'
      - $ref: '#/components/parameters/customerId'
      security:
      - CustomerAccessToken: []
      - OAuth2:
        - customersegment.segment_read
        - customersegment.segment_read_own
    servers:
    - url: https://api.emporix.io
  /customer-segment/{tenant}/segments/search:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      summary: Searching with parameters for customer segments
      tags:
      - Segments
      operationId: POST-customer-segment-search-segments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentsSearch'
            examples:
              Search Segments:
                $ref: '#/components/examples/SegmentsSearch'
      responses:
        '200':
          description: Customer segments were successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentResponse'
              examples:
                Segments Response:
                  $ref: '#/components/examples/SegmentsResponse'
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      description: Returns all customer segments that match provided criteria.
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/xTotalCount'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/legalEntityId'
      - $ref: '#/components/parameters/customerId'
      security:
      - CustomerAccessToken: []
      - OAuth2:
        - customersegment.segment_read
        - customersegment.segment_read_own
    servers:
    - url: https://api.emporix.io
  /customer-segment/{tenant}/segments/me:
    parameters:
    - $ref: '#/components/parameters/tenant'
    get:
      summary: Retrieving own customer segments
      tags:
      - Segments
      operationId: GET-customer-segment-retrieve-own-segments
      description: 'Retrieves active customer segments assigned to the authenticated customer.


        The response includes segments assigned directly to the customer and segments assigned through the customer''s IAM groups.

        Groups that are not bound to a legal entity, and groups bound to the customer''s current legal entity, are taken into account.'
      parameters:
      - $ref: '#/components/parameters/qParam'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/xTotalCount'
      - $ref: '#/components/parameters/acceptLanguage'
      responses:
        '200':
          description: Own customer segments were successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentResponse'
              examples:
                Segments Response:
                  $ref: '#/components/examples/SegmentsResponse'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      security:
      - CustomerAccessToken: []
      - OAuth2:
        - customersegment.segment_read_own
    servers:
    - url: https://api.emporix.io
  /customer-segment/{tenant}/segments/{segmentId}:
    parameters:
    - $ref: '#/components/parameters/tenant'
    - $ref: '#/components/parameters/segmentId'
    get:
      summary: Retrieving a customer segment
      tags:
      - Segments
      responses:
        '200':
          description: Customer segment successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
              examples:
                Segment Response:
                  $ref: '#/components/examples/SegmentResponse'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
        '404':
          $ref: '#/components/responses/Common_response_NotFound_404'
      operationId: GET-customer-segment-retrieve-segment
      description: Retrieves segment with specified ID.
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/legalEntityId'
      security:
      - CustomerAccessToken: []
      - OAuth2:
        - customersegment.segment_read
        - customersegment.segment_read_own
    put:
      summary: Upserting a customer segment
      tags:
      - Segments
      operationId: PUT-customer-segment-update-segment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentUpdate'
            examples:
              Segment Update:
                $ref: '#/components/examples/SegmentUpdate'
      responses:
        '201':
          description: Customer segment wasn't found. A new customer segment was successfully created.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
              example:
                id: 628cd20c6e8b2432b6346ca6
        '204':
          description: Customer segment was successfully updated.
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
        '409':
          $ref: '#/components/responses/Common_response_Conflict_409'
      parameters:
      - $ref: '#/components/parameters/contentLanguage'
      description: Performs the `UPSERT` operation. If a segment with specified ID exists in the system, then it is updated. If it doesn't exist, a new customer segment is created.
      security:
      - OAuth2:
        - customersegment.segment_manage
    patch:
      summary: Patching a customer segment
      tags:
      - Segments
      operationId: PATCH-customer-segment-update-segment
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOperation'
            examples:
              Update a status:
                value:
                - op: replace
                  path: /status
                  value: INACTIVE
              Update a name:
                value:
                - op: replace
                  path: /name
                  value:
                    en: New name
              Remove a description:
                value:
                - op: remove
                  path: /description
              Update mixins:
                value:
                - op: replace
                  path: /mixins/productCustomAttributes/pricingMeasurePrice
                  value: 15
      responses:
        '204':
          description: Customer segment was successfully updated.
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
        '404':
          $ref: '#/components/responses/Common_response_NotFound_404'
      parameters:
      - $ref: '#/components/parameters/contentLanguage'
      description: 'Performs partial update of a segment.


        The patch request consists of set of operation, that should be defined according to RFC-6902 standard.'
      security:
      - OAuth2:
        - customersegment.segment_manage
    delete:
      summary: Deleting a customer segment
      tags:
      - Segments
      parameters:
      - $ref: '#/components/parameters/forceDelete'
      operationId: DELETE-customer-segment-remove-segment
      responses:
        '204':
          description: Customer segment was successfully deleted.
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      description: 'Removes segment with specified ID.


        **Important**: If you want to delete a segment that has items or customers assigned to it, you need to set the `forceDelete` query parameter to `true`. In this case, all items and customers assignments will be deleted as well.'
      security:
      - OAuth2:
        - customersegment.segment_manage
    servers:
    - url: https://api.emporix.io
  /customer-segment/{tenant}/segments/bulk:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      summary: Creating customer segments in bulk
      tags:
      - Segments
      operationId: POST-customer-segment-create-segments-bulk
      description: Creates multiple customer segments. The maximum batch size is 200.
      security:
      - OAuth2:
        - customersegment.segment_manage
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SegmentCreation'
            examples:
              Segment Creation:
                $ref: '#/components/examples/SegmentsCreation'
      responses:
        '207':
          description: Multi-status response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkResponse'
              examples:
                Segments Creations:
                  $ref: '#/components/examples/BulkCreationResponse'
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      parameters:
      - $ref: '#/components/parameters/contentLanguage'
    put:
      summary: Upserting customer segments in bulk
      tags:
      - Segments
      operationId: PUT-customer-segment-update-segments-bulk
      description: 'Performs the `UPSERT` operation for multiple customer segments. If a segment with specified ID exists in the system, then it is updated. If it doesn''t exist, a new customer segment is created.


        The maximum batch size is 200.'
      security:
      - OAuth2:
        - customersegment.segment_manage
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SegmentUpdateBulk'
            examples:
              Segment Creation:
                $ref: '#/components/examples/SegmentsUpdate'
      responses:
        '207':
          description: Multi-status response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkResponse'
              examples:
                Segments Update:
                  $ref: '#/components/examples/BulkUpdateResponse'
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
      parameters:
      - $ref: '#/components/parameters/contentLanguage'
    delete:
      summary: Deleting customer segments in bulk
      tags:
      - Segments
      operationId: DELETE-customer-segment-remove-segments-bulk
      parameters:
      - $ref: '#/components/parameters/forceDelete'
      description: 'Removes multiple customer segments. The maximum batch size is 200.


        ### The IDs of customer segments for deletion should be defined in the request body as an array of strings.

        #### Example: `["firstId", "secondId", "thirdId"]`


        **Important**: If you want to delete a segment that has items or customers assigned to it, you need to set the `forceDelete` query parameter to `true`. In this case, all items and customers assignments will be deleted as well.'
      security:
      - OAuth2:
        - customersegment.segment_manage
      responses:
        '207':
          description: Multi-status response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkResponse'
              examples:
                Segments Deletion:
                  $ref: '#/components/examples/BulkDeletionResponse'
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
    servers:
    - url: https://api.emporix.io
  /customer-segment/{tenant}/segments/match:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      summary: Checking which items belong to segment
      tags:
      - Segments
      operationId: POST-customer-segment-check-match
      description: Checks if the provided items match specified criteria - if ids of the products are assigned directly to one of the provided segments or indirectly through the category assignment. Only items assigned to the active segments will be returned.
      security:
      - OAuth2:
        - customersegment.segment_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Match'
            examples:
              Match:
                value:
                  siteCode: main
                  items:
                  - id: p1234
                  - id: p2345
                  segmentIds:
                  - S1234
                  - S2456
      responses:
        '200':
          description: Id of the products which match criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchItem'
              example:
              - id: p1234
        '400':
          $ref: '#/components/responses/Common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/Common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/Common_response_Forbidden_403'
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    qParam:
      in: query
      name: q
      description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
      schema:
        type: string
    forceDelete:
      schema:
        type: boolean
        default: false
      in: query
      name: forceDelete
      required: false
      description: '- If set to `true` and the segment has items or customers assigned to it, both the segment and the segment assignments will be deleted.

        - If set to `false` or not specified and the segment has items or customers assigned to it, the endpoint will respond with the 400 error.

        '
    legalEntityId:
      schema:
        type: string
      in: query
      name: legalEntityId
      required: false
      description: 'The parameter is utilized for searching in relation to the legalEntityId. Parameter is only taken into account when customer is assigned to more than one Legal Entity.

        '
    contentLanguage:
      schema:
        type: string
      in: header
      name: Content-Language
      description: The Content-Language request HTTP header defines language(s) of the payload.
      example: en
    sort:
      schema:
        type: string
      in: query
      name: sort
      description: List of properties used to sort the results, separated by colons.
    acceptLanguage:
      schema:
        type: string
      in: header
      name: Accept-Language
      description: The Accept-Language request HTTP header defines which languages the client is able to understand, and which locale variant is preferred. If empty, the default system language is assumed. It can be a priority list working as a fallback mechanism.
    tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.


        **Note**: Always write the tenant name in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    customerId:
      schema:
        type: string
      in: query
      name: customerId
      required: false
      description: 'The parameter is utilized for retrieving customer segments for a provided customer.


        **NOTE**: This parameter can only be used with `customersegment.segment_read` scope.

        '
    segmentId:
      name: segmentId
      in: path
      required: true
      description: Unique identifier of the customer segment.
      schema:
        type: string
    xTotalCount:
      schema:
        type: boolean
      in: header
      name: X-Total-Count
      description: Flag indicating whether the total number of retrieved results should be returned.
    pageNumber:
      schema:
        type: string
      in: query
      name: pageNumber
      description: The page number to be retrieved. The size of the pages should be specified by the pageSize parameter.
    pageSize:
      schema:
        type: string
      in: query
      name: pageSize
      description: The number of documents to be retrieved per page.
    fields:
      schema:
        type: string
      in: query
      name: fields
      description: Fields to be returned in the response.
  schemas:
    BulkAssignmentResponse:
      type: object
      properties:
        index:
          type: integer
          description: 'Index of the processed item, matching the item position in request body.

            '
        code:
          type: integer
          description: HTTP Status Code.
        status:
          type: string
          description: HTTP Status description.
        message:
          type: string
          description: Error message.
    SegmentUpdate:
      allOf:
      - $ref: '#/components/schemas/CommonSegment'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/MetadataUpdate'
    SegmentResponse:
      allOf:
      - $ref: '#/components/schemas/SegmentUpdateBulk'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/MetadataResponse'
    MetadataUpdate:
      allOf:
      - type: object
        properties:
          version:
            type: integer
            description: The document version number.
      - $ref: '#/components/schemas/MetadataCreate'
    BulkResponse:
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: Item's unique identifier.
      - $ref: '#/components/schemas/BulkAssignmentResponse'
    CommonSegment:
      type: object
      description: ''
      allOf:
      - type: object
        properties:
          name:
            type: object
            description: Localized name of the customer segment.
            additionalProperties:
              type: string
          description:
            type: object
            description: Localized description of the customer segment.
            additionalProperties:
              type: string
          validity:
            type: object
            description: Determines the time frame in which the customer segment is valid.
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
          status:
            type: string
            description: Determines whether the customer segment is active or not. If not provided the value is set to `INACTIVE`
            enum:
            - ACTIVE
            - INACTIVE
          siteCode:
            type: string
            description: Determines for which site the customer segment is available.
          mixins:
            type: object
            description: A key-value map of additional attributes.
            additionalProperties: true
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/MetadataCreate'
      required:
      - name
      - siteCode
    SegmentUpdateBulk:
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: Unique identifier of the customer segment.
      - $ref: '#/components/schemas/SegmentUpdate'
    PatchOperation:
      type: object
      properties:
        op:
          type: string
          enum:
          - add
          - remove
          - replace
          description: 'Indicates an operation which should be done on a return. Available operations: `add` `remove` and `replace`'
        path:
          type: string
          description: Indicates a path for which the value should be applied. For example:`/mixins/additionalAttributes/externalId`, `/name`, `/status`
        value:
          oneOf:
          - type: object
          - type: string
          - type: number
          description: Indicates a value that should be changed or added. The value can be of a primitive type, like string, number, boolean or it can be an object or an array.
      required:
      - op
      - path
    MetadataCreate:
      type: object
      properties:
        mixins:
          type: object
          description: A key-value map, where key is a mixin name and value is a link to the mixin schema.
          additionalProperties: true
    Error:
      type: object
      properties:
        code:
          type: integer
          description: HTTP Status Code.
        status:
          type: string
          description: HTTP Status.
        message:
          type: string
          description: Error message.
        resourceId:
          type: string
          description: An ID of the resource which caused the error.
        details:
          type: object
          description: Error details
          properties:
            field:
              type: string
            type:
              type: string
            message:
              type: string
            moreInfo:
              type: string
    SegmentsSearch:
      type: object
      properties:
        q:
          type: string
          description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
    MatchItem:
      type: object
      properties:
        id:
          type: string
          description: Id of the product.
    SegmentCreation:
      allOf:
      - type: object
        properties:
          id:
            type: string
            description: Unique identifier of the customer segment. It will be auto-generated if not provided.
      - $ref: '#/components/schemas/CommonSegment'
    Match:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchItem'
        segmentIds:
          type: array
          items:
            type: string
        site:
          type: string
      required:
      - items
      - segmentIds
      - site
    MetadataResponse:
      allOf:
      - type: object
        properties:
          createdAt:
            description: The creation date.
            type: string
            format: date-time
          modifiedAt:
            description: The modification date.
            type: string
            format: date-time
      - $ref: '#/components/schemas/MetadataUpdate'
  examples:
    Response_BadRequest_400:
      value:
        code: 400
        status: Bad Request
        message: Validation problem with request body.
    SegmentCreation:
      value:
        id: 628cd20c6e8b2432b6346ca6
        name:
          en: Golden Segment
        description:
          en: Golden Segment
        validity:
          from: 2024-04-17 08:00:00+00:00
          to: 2025-04-17 08:00:00+00:00
        status: ACTIVE
        siteCode: main
    Response_Forbidden_403:
      value:
        code: 403
        status: Forbidden
        message: The access to the requested resource has been forbidden by the server.
    BulkUpdateResponse:
      value:
      - index: 1
        id: 628cd20c6e8b2432b6346ca6
        code: 204
        status: OK
      - index: 2
        code: 400
        status: Bad Request
        message: Validation problem with request body.
    Response_Conflict_409_changed:
      value:
        code: 409
        status: Conflict
        message: The resource you are attempting to access has changed.
    SegmentsSearch:
      value:
        q: siteCode:main
    SegmentResponse:
      value:
        id: 628cd20c6e8b2432b6346ca6
        name:
          en: Golden Segment
        description:
          en: Golden Segment
        validity:
          from: 2024-04-17 08:00:00+00:00
          to: 2025-04-17 08:00:00+00:00
        status: ACTIVE
        siteCode: main
