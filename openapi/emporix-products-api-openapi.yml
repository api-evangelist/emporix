        '409':
          $ref: '#/components/responses/common_response_Conflict_409'
        '500':
          $ref: '#/components/responses/common_response_InternalServerError_500'
      description: 'Updates or creates a specified product by replacing all of its existing data with data from the request body.

        If the `metadata.version` is provided then optimistic locking is enabled and version must match the version in the database.


        A full replacement (`partial=false`) removes mixin names that are omitted from the request body. To remove a mixin, omit it from `mixins` and `metadata.mixins`. The request body must include the complete product document.

        ***


        **Additional scope information**


        * The `product.product_manage_by_vendor` scope is only required for vendor employees to manage products belonging to the vendor.

        * The `product.product_publish` scope is only required if you want to publish the product when updating it.

        * The `product.product_unpublish` scope is only required if you want to unpublish the product when updating it.


        ***'
      operationId: PUT-product-update-product
      requestBody:
        $ref: '#/components/requestBodies/productUpdateBody'
      security:
      - OAuth2:
        - product.product_manage
        - product.product_manage_by_vendor
        - product.product_publish
        - product.product_unpublish
      parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_productId'
      - $ref: '#/components/parameters/header_content_language'
      - $ref: '#/components/parameters/query_partial_product'
      - $ref: '#/components/parameters/query_skip_variants_generation'
      - $ref: '#/components/parameters/query_do_index'
      - $ref: '#/components/parameters/query_skip_related_items_validation'
      summary: Upserting a product
      tags:
      - Products
    patch:
      responses:
        '204':
          description: 'The resource has been successfully updated.

            '
        '400':
          $ref: '#/components/responses/common_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/common_response_Forbidden_403'
        '404':
          description: 'The requested resource does not exist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coreErrorMessage'
        '409':
          $ref: '#/components/responses/common_response_Conflict_409'
        '500':
          $ref: '#/components/responses/common_response_InternalServerError_500'
      description: 'Partially updates a specified product. Omitted fields remain unchanged.


        **Mixins**


        * Mixin names omitted from the request remain on the product.

        * Fields sent for a mixin are merged recursively. Fields omitted inside that mixin remain unchanged.

        * A `null` value does not remove a mixin. The mixin remains on the product with the value `null`.


        This endpoint does not accept JSON Patch operations (`op`, `path`, `value`).


        To remove a mixin, retrieve the product and send a full replacement using Upserting a product with `partial=false`. Omit the mixin from `mixins` and `metadata.mixins`.

        ***


        **Additional scope information**


        * The `product.product_manage_by_vendor` scope is only required for vendor employees to manage products belonging to the vendor.

        * The `product.product_publish` scope is only required if you want to publish the product when updating it.

        * The `product.product_unpublish` scope is only required if you want to unpublish the product when updating it.


        ***'
      operationId: PATCH-product-update-product
      requestBody:
        $ref: '#/components/requestBodies/productPartialUpdateBody'
      security:
      - OAuth2:
        - product.product_manage
        - product.product_manage_by_vendor
        - product.product_publish
        - product.product_unpublish
      parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_productId'
      - $ref: '#/components/parameters/header_content_language'
      - $ref: '#/components/parameters/query_skip_variants_generation'
      - $ref: '#/components/parameters/query_do_index'
      - $ref: '#/components/parameters/query_skip_related_items_validation'
      summary: Partially updating a product
      tags:
      - Products
    delete:
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: false
      responses:
        '204':
          description: 'The resource has been successfully deleted.

            '
        '401':
          $ref: '#/components/responses/common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/common_response_Forbidden_403'
        '500':
          $ref: '#/components/responses/common_response_InternalServerError_500'
      description: 'Deletes a specified product.

        ***


        **Additional scope information**


        * The `product.product_manage_by_vendor` scope is only required for vendor employees to delete products belonging to the vendor.


        ***'
      operationId: DELETE-product-remove-product
      security:
      - OAuth2:
        - product.product_manage
        - product.product_manage_by_vendor
      parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_productId'
      - $ref: '#/components/parameters/query_force_product'
      - $ref: '#/components/parameters/query_do_index'
      summary: Deleting a product
      tags:
      - Products
