      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productCore'
      - type: object
        properties:
          mixins:
            $ref: '#/components/schemas/productVariantMixins'
        required:
        - name
        - code
    bundleProductWithId:
      type: object
      description: Products of the BUNDLE type.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/bundleProductCreation'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
          yrn:
            $ref: '#/components/schemas/YRN'
          media:
            $ref: '#/components/schemas/productMedia'
          metadata:
            $ref: '#/components/schemas/productMetadataGet'
          customerSegmentIds:
            type: array
            description: Customer segment IDs assigned to the product.
            items:
              type: string
          categoryIds:
            type: array
            description: Category IDs assigned to the product.
            items:
              type: string
    dynamicVariantProduct:
      type: object
      description: Base schema for products of the DYNAMIC_VARIANT type.
      allOf:
      - $ref: '#/components/schemas/productCore'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/productMetadataCore'
          parentVariantId:
            type: string
            description: 'Identifier of the immediate parent product in the variant hierarchy. Omit or leave empty for root-level dynamic variant products.

              '
          dynamicVariantType:
            type: string
            description: 'Optional label identifying the variant level or kind within the hierarchy (for example, `"H1_L1"`). Used for display and filtering purposes.

              '
          sellable:
            type: boolean
            description: 'Indicates whether this variant can be sold directly, if it''s a leaf in the hierarchy that a customer can add to a cart. This value is **not inherited** from parent variants — it must be set explicitly on each product. Root products and intermediate-level variants are typically `false`. Leaf variants are typically `true`.

              '
          ownVariantAttributes:
            $ref: '#/components/schemas/ownVariantAttributes'
        required:
        - name
        - code
    productMetadataGet:
      type: object
      description: Metadata for GET requests.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productMetadataWithVersion'
      - type: object
        properties:
          classificationMixins:
            type: array
            description: List of mixin schemas used for classification.
            items:
              type: object
              description: Mixin schema.
              properties:
                name:
                  type: string
                  description: Name of the mixin
                  pattern: ^[a-zA-Z0-9_]\S*$
                mixinPath:
                  type: string
                  description: The mixins path that should be used when defining attributes on a product. It's built based on the following pattern - `class_<sourceCategory.code>_<name>`.
                schemaUrl:
                  type: string
                  description: URL of the mixin schema defined on the category level.
                  pattern: ^https?://[^\s/$.?#].\S*$
                usedSchemaUrl:
                  type: string
                  description: If given mixin has been already used in the product, then this field contains the URL of the used mixin schema.
                  pattern: ^https?://[^\s/$.?#].\S*$
                obsoleteSchemaUrlUsed:
                  type: boolean
                  description: Indicates whether the used mixin schema is obsolete - `usedSchemaUrl` differs from `schemaUrl`.
                required:
                  type: boolean
                  description: Indicates whether the mixin is required.
                sourceCategoryId:
                  type: string
                  description: Unique identifier of the category from which the mixin comes from. Can be this category ID or one of the parent categories IDs.
          createdAt:
            type: string
            description: Creation date in the ISO 8601 standard.
          modifiedAt:
            type: string
            description: Modification date in the ISO 8601 standard.
    variantProductMetadataGet:
      type: object
      description: Variant metadata response.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productMetadataGet'
      - $ref: '#/components/schemas/variantProductMetadataWithVersion'
    value:
      type: object
      properties:
        key:
          oneOf:
          - type: string
          - type: number
          - type: boolean
    basicProductWithId:
      type: object
      description: Products of the BASIC type.
      allOf:
      - $ref: '#/components/schemas/basicProductCreation'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
          yrn:
            $ref: '#/components/schemas/YRN'
          media:
            $ref: '#/components/schemas/productMedia'
          metadata:
            $ref: '#/components/schemas/productMetadataGet'
          customerSegmentIds:
            type: array
            description: Customer segment IDs assigned to the product.
            items:
              type: string
          categoryIds:
            type: array
            description: Category IDs assigned to the product.
            items:
              type: string
    productTypeUpdate:
      type: string
      description: 'Indicates the product type, which is immutable. This property is taken into account only for insert operations.

        '
      default: BASIC
      enum:
      - BASIC
      - BUNDLE
      - PARENT_VARIANT
      - VARIANT
      - DYNAMIC_VARIANT
    dynamicVariantAttributeValue:
      type: object
      description: 'The value part of a dynamic variant attribute. Holds the canonical qualifier used for matching, an optional localized display label, and an optional unit code for measurement attributes.

        '
      required:
      - type
      - qualifier
      properties:
        type:
          type: string
          description: 'Data type of the qualifier value.

            '
          enum:
          - STRING
          - NUMBER
          - DECIMAL
          - BOOLEAN
        qualifier:
          description: 'The canonical value used for variant matching. The JSON type must match `type`: a string for `STRING`, a number for `NUMBER` or `DECIMAL`, or a boolean for `BOOLEAN`.

            '
          oneOf:
          - type: string
          - type: number
          - type: boolean
        name:
          $ref: '#/components/schemas/localizedValue'
        unit:
          type: string
          description: 'Optional unit code for measurement attributes (for example, `"MMT"` for millimetres, `"PCE"` for pieces). Unit translations are resolved by the frontend from a separate dictionary.

            '
    productType:
      type: string
      description: 'Indicates the product type, which is immutable. Once the product type is set, it cannot be updated.

        '
      default: BASIC
      enum:
      - BASIC
      - BUNDLE
      - PARENT_VARIANT
      - VARIANT
      - DYNAMIC_VARIANT
    localizedValue:
      description: Localized value which can have different structure which depends on provided `Content-Language` header.
      oneOf:
      - type: string
      - type: object
        additionalProperties:
          type: string
        example:
          en: Product
          pl: Produkt
    variantProductMetadataCore:
      type: object
      description: Metadata request.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productMetadataCore'
      - type: object
        properties:
          overridden:
            type: array
            description: 'By default, all variant products inherit their attributes from the parent variant. You need to include the name of the attribute in the `metadata.overridden` field to be able to replace the attribute values. For the `mixins` and `metadata` fields, you can provide a nested path so that only a single mixin attribute is overridden, for example `mixins.productCustomAttributes.pricingMeasurePrice`. The same rule is valid for providing the mixins schema, as you can override just this particular field with the provided schema, for example metadata.mixins.yourCustomAttributes.


              **Note:**You cannot override the following attributes: `id`, `code`, `template`, `variantAttributes`.'
            items:
              type: string
              description: Name of overridden product field, for example `published`.
    variantProductWithId:
      type: object
      description: Products of the VARIANT type.
      allOf:
      - $ref: '#/components/schemas/variantProductCreation'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
          yrn:
            $ref: '#/components/schemas/YRN'
          media:
            $ref: '#/components/schemas/productMedia'
          metadata:
            $ref: '#/components/schemas/variantProductMetadataGet'
          customerSegmentIds:
            type: array
            description: Customer segment IDs assigned to the product.
            items:
              type: string
          categoryIds:
            type: array
            description: Category IDs assigned to the product.
            items:
              type: string
    bundleProductCreation:
      type: object
      description: Creating products of the BUNDLE type.
      allOf:
      - $ref: '#/components/schemas/bundleProduct'
      - type: object
        properties:
          id:
            type: string
            maxLength: 32
            description: Custom product identifier. If not provided, it is automatically generated.
          productType:
            $ref: '#/components/schemas/productType'
    relatedItem:
      title: relatedItem
      type: object
      properties:
        refId:
          type: string
          description: 'Identifier of a product which is in the relationship with the main product. The product identifier has to exist. '
        type:
          type: string
          description: A relation type. The type has to exist in the system. All relation types are defined in configuration service under `relation_types` key.
      required:
      - refId
      - type
    variantMapEntry:
      type: object
      description: 'A single entry in the root product''s `variants` map. In API responses the `variantAttributes` field contains **accumulated** attributes — the entry''s own delta attributes merged with all ancestor attributes up the chain, so storefront clients receive a ready-to-use combination without additional API calls. The `published` flag is included only when the caller has the `product.product_read_unpublished` scope.

        '
      properties:
        version:
          type: integer
          description: Version of the source variant product at the time of the last recalculation.
        code:
          type: string
          description: Code of the source variant product.
        name:
          $ref: '#/components/schemas/localizedValue'
        parentVariantId:
          type: string
          description: Identifier of the immediate parent product in the variant hierarchy.
        sellable:
          type: boolean
          description: Indicates whether this variant can be sold directly.
        published:
          type: boolean
          description: 'Publication state of this variant. Only included in responses when the caller has the `product.product_read_unpublished` scope; entries with `published: false` are otherwise omitted from the map.

            '
        dynamicVariantType:
          type: string
          description: Optional label identifying the variant level or kind (for example, `"H1_L1"`).
        variantAttributes:
          type: object
          description: 'Accumulated variant attributes for this entry. For leaf variants this includes all ancestor attributes merged with the entry''s own delta. Keys are attribute identifiers.

            '
          additionalProperties:
            $ref: '#/components/schemas/dynamicVariantAttribute'
    dynamicVariantRecalculationRequest:
      type: object
      description: 'Request body for triggering dynamic variant recalculation. Accepts up to 1000 product IDs at any level of the hierarchy — the system resolves the root for each ID automatically. Intended to be called after a batch of products has been fully ingested, not per individual product write.

        '
      required:
      - productIds
      properties:
        productIds:
          type: array
          description: 'List of product IDs (variants at any hierarchy level) for which recalculation should be triggered. The system groups IDs by their root product and creates one job per unique root.

            '
          minItems: 1
          maxItems: 1000
          items:
            type: string
    parentVariantProduct:
      type: object
      description: Products of the PARENT_VARIANT type.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productCore'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/productMetadataCore'
          template:
            $ref: '#/components/schemas/template'
          variantAttributes:
            $ref: '#/components/schemas/variantAttributes'
        required:
        - name
        - code
        - template
        - productType
        - variantAttributes
    productCore:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/localizedValue'
          description: Product name.
        code:
          type: string
          minLength: 1
          description: Unique product identifier, defined by the user.
        description:
          $ref: '#/components/schemas/localizedValue'
          description: Product description.
        vendor:
          $ref: '#/components/schemas/vendor'
        taxClasses:
          $ref: '#/components/schemas/taxClasses'
        published:
          $ref: '#/components/schemas/published'
        weightDependent:
          type: boolean
          description: Mark the product as weight-dependent if the line item price could change after packaging, as this is necessary to ensure that credit card payments can be authorized.
        mixins:
          $ref: '#/components/schemas/productMixins'
        relatedItems:
          description: 'List of items in a relationship with the main product. Assuming that in the system the following relation types are defined: `ACCESSORY` and `CONSUMABLE`, the two products: `Printer` and `Ink` exist, then the `Ink` product can be used as a related item with type `CONSUMABLE` for the Printer product.

            In order to find all printers for which the ink is defined as a `CONSUMABLE` then `q-param` can be used:

            `products?q=relatedItems.type:CONSUMABLE relatedItems.refId:Ink_Id`

            '
          type: array
          items:
            $ref: '#/components/schemas/relatedItem'
        brandId:
          type: string
          description: ID of brand.
        brand:
          $ref: '#/components/schemas/brand'
        labelIds:
          type: array
          items:
            type: string
          description: Collection of label IDs.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/label'
    productMedia:
      type: array
      uniqueItems: false
      description: Media files attached to the product.
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
          yrn:
            $ref: '#/components/schemas/YRN'
          contentType:
            type: string
          createdAt:
            type: string
          uploadLink:
            type: string
          url:
            type: string
          cloudinaryUrl:
            type: string
          uncommittedMedia:
            type: boolean
          tags:
            type: array
            items:
              type: string
          customAttributes:
            type: object
          mixins:
            type: object
            additionalProperties: true
            description: Custom media attributes.
    productMixins:
      type: object
      description: 'Custom product attributes, keyed by mixin name.


        On a partial update, omitted mixin names remain on the product. Sent fields are merged recursively. A `null` value does not remove a mixin. To remove a mixin, send a full product replacement and omit the mixin name.'
      additionalProperties: true
    productPartialUpdate:
      type: object
      description: Partially updating a product.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productCore'
      - type: object
        properties:
          template:
            $ref: '#/components/schemas/template'
          bundledProducts:
            $ref: '#/components/schemas/bundledProducts'
          variantAttributes:
            $ref: '#/components/schemas/variantAttributes'
          metadata:
            $ref: '#/components/schemas/productMetadataWithVersion'
    coreErrorMessage:
      type: object
      properties:
        code:
          type: integer
          description: HTTP Status Code.
        status:
          type: string
          description: HTTP Status.
        message:
          type: string
          description: Error message.
    bulkResponse:
      title: bulkResponse
      type: object
      properties:
        index:
          type: integer
          description: 'Index of the processed product, matching the price position in request body.

            '
        id:
          type: string
          description: Product unique identifier.
        code:
          type: integer
          description: HTTP Status Code.
        errorCode:
          type: string
          description: Error specific errorCode.
        status:
          type: string
          description: HTTP Status description.
        message:
          type: string
          description: Error message.
        details:
          type: array
          description: Error message details.
          items:
            type: string
    variantsMap:
      type: object
      description: 'Denormalized flat map of all descendant variants stored on the root product. Keys are variant product identifiers. In API responses each entry''s `variantAttributes` contains accumulated attributes.

        '
      additionalProperties:
        $ref: '#/components/schemas/variantMapEntry'
    template:
      type: object
      description: "Indicates the template that has been used during the product creation. After assigning a template to the product, the new attributes can be defined under the `productTemplateAttributes` key in the `mixins` field. In case of variant attributes, the attributes should be defined under `productVariantAttributes`. The attributes are then validated in accordance with their definition in the template. \n\n**Note:** The template with defined variant attributes can be used only in PARENT_VARIANT and VARIANT types of product.\n"
      properties:
        id:
          type: string
          description: Identifier of the product template.
        version:
          type: string
          description: Product template version.
      required:
      - id
      - version
    dynamicVariantProductCreation:
      type: object
      description: Creating products of the DYNAMIC_VARIANT type.
      allOf:
      - $ref: '#/components/schemas/dynamicVariantProduct'
      - type: object
        properties:
          id:
            type: string
            maxLength: 32
            description: Custom product identifier. If not provided, it is automatically generated.
          productType:
            $ref: '#/components/schemas/productType'
    dynamicVariantRecalculationJobStatus:
      type: string
      description: Current status of a dynamic variant recalculation job.
      enum:
      - PENDING
      - PROCESSING
      - FINISHED
      - FAILED
      - FAILED_PERMANENT
    variantProductUpdate:
      type: object
      description: Updating products of the VARIANT type.
      allOf:
      - $ref: '#/components/schemas/variantProduct'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/variantProductMetadataWithVersion'
          productType:
            $ref: '#/components/schemas/productTypeUpdate'
          parentVariantId:
            type: string
            description: Identifier of the PARENT_VARIANT product. This property is taken into account only for insert operations.
    resourceLocation:
      type: object
      properties:
        id:
          type: string
        yrn:
          $ref: '#/components/schemas/YRN'
    bundleProductBulkUpdate:
      type: object
      description: Updating products of the BUNDLE type in bulk.
      allOf:
      - $ref: '#/components/schemas/bundleProductUpdate'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
        required:
        - id
    bundleProductsArray:
      type: array
      description: List of products of the BUNDLE type.
      items:
        $ref: '#/components/schemas/bundleProductWithId'
    dynamicVariantRecalculationJobResponse:
      type: object
      description: 'Represents a single dynamic variant recalculation job. One job is created per unique root product. Jobs remain queryable until automatically removed approximately 30 days after reaching a terminal state.

        '
      properties:
        id:
          type: string
          description: Unique identifier of the recalculation job.
        parentRoot:
          type: string
          description: Identifier of the root product whose variant tree is being recalculated.
        requestedByIds:
          type: array
          description: List of product IDs that were submitted in the recalculation request and resolved to this root.
          items:
            type: string
        status:
          $ref: '#/components/schemas/dynamicVariantRecalculationJobStatus'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the job was created.
        processingStartedAt:
          type: string
          format: date-time
          description: Timestamp when a subscriber picked up the job and started processing. Null while the job is still PENDING.
        finishedAt:
          type: string
          format: date-time
          description: Timestamp when the job reached a terminal state (FINISHED, FAILED, or FAILED_PERMANENT).
        error:
          type: string
          description: Error message if the job failed. Null for successful jobs.
        attempts:
          type: integer
          description: Number of processing attempts made for this job. Incremented on each delivery from the pub/sub subscription.
    labelOverlay:
      type: object
      description: Overlay metadata for a label.
      additionalProperties: false
      properties:
        isTrue:
          type: boolean
        position:
          type: number
    basicProductBulkUpdate:
      type: object
      description: Updating products of the BASIC type in bulk.
      allOf:
      - $ref: '#/components/schemas/basicProductUpdate'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
        required:
        - id
    dynamicVariantRecalculationResponse:
      type: object
      description: 'Response returned when recalculation is triggered. Contains one job per unique root product resolved from the submitted IDs, plus any IDs that were skipped (for example, because a job for that root is already PENDING or PROCESSING).

        '
      properties:
        jobs:
          type: array
          description: List of recalculation jobs created or referenced for each unique root product.
          items:
            $ref: '#/components/schemas/dynamicVariantRecalculationJobResponse'
        skippedProductIds:
          type: array
          description: 'Product IDs that were not processed because a recalculation job for their root is already active (PENDING or PROCESSING). The existing job ID is available in the `jobs` list.

            '
          items:
            type: string
    variantProductCreation:
      type: object
      description: Creating products of the VARIANT type.
      allOf:
      - $ref: '#/components/schemas/variantProduct'
      - type: object
        properties:
          id:
            type: string
            maxLength: 32
            description: Custom product identifier. If not provided, it is automatically generated.
          metadata:
            $ref: '#/components/schemas/variantProductMetadataCore'
          parentVariantId:
            type: string
            description: Identifier of the PARENT_VARIANT product.
          productType:
            $ref: '#/components/schemas/productType'
    variantProductsArray:
      type: array
      description: List of products of the VARIANT type.
      items:
        $ref: '#/components/schemas/variantProductWithId'
    taxClasses:
      type: object
      additionalProperties:
        type: string
      description: 'Map of key-value pairs that associates tax classes with locations (countries). The key of the map should be specified as the existing location/country identifier (see the country-service). The value of the map entry should contain a tax class code (see the tax-service).

        Information about the association is required for price matching mechanism (see the price-service#MatchPrice).'
    parentVariantProductBulkUpdate:
      type: object
      description: Updating products of the PARENT_VARIANT type in bulk.
      allOf:
      - $ref: '#/components/schemas/parentVariantProductUpdate'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/id'
        required:
        - id
    ownVariantAttributes:
      type: object
      description: 'Map of variant attributes defined directly on this product. Keys are attribute identifiers (for example, `storageCapacity`). These are the attributes the caller can set by create/update requests. On responses they represent what is stored on this specific product.

        '
      additionalProperties:
        $ref: '#/components/schemas/dynamicVariantAttribute'
    productVariantMixins:
      type: object
      description: Mixins request.
      additionalProperties: true
    values:
      type: array
      items:
        $ref: '#/components/schemas/value'
    variantAttributes:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/values'
      description: This field contains all information about attributes and their values that are used for creating variants. It is presented in the form of a map, where 'key' is the name of the attribute and 'value' is the list of values of that attribute. The attributes and their values are based on their definitions in the `template` element assigned to the parent variant. Each attribute defined in the product template is flagged as a `variantAttribute`. Only the attributes that have this flag set as `true` can be used in the `variantAttributes` field.
    searchProducts:
      type: object
      properties:
        q:
          type: string
          description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
    dynamicVariantProductWithId:
      type: object
      description: 'Response schema for products of the DYNAMIC_VARIANT type.


        - **`sellable`** — not inherited from parents; must be set explicitly on each product. Root and intermediate variants are typically `false`; leaf variants are typically `true`.

        - **Root products** include a `variants` map containing all descendants with accumulated attributes.

        - **Child products** include `ownVariantAttributes` (attributes defined on this product) and `inheritedVariantAttributes` (read-only, merged from ancestors).

        - `parentVariantPath` is an ordered array of ancestor IDs from direct parent (index 0) to root (last index). Empty for root products.

        - `metadata.dynamicVariantInfo` is present only when a hierarchy integrity issue is detected.

        '
      properties:
        id:
          $ref: '#/components/schemas/id'
        yrn:
          $ref: '#/components/schemas/YRN'
        code:
          type: string
          minLength: 1
          description: Unique product identifier, defined by the user.
        name:
          $ref: '#/components/schemas/localizedValue'
        description:
          $ref: '#/components/schemas/localizedValue'
        productType:
          $ref: '#/components/schemas/productType'
        published:
          $ref: '#/components/schemas/published'
        sellable:
          type: boolean
          description: 'Indicates whether this variant can be sold directly (i.e. it is a leaf in the hierarchy that a customer can add to a cart). This value is **not inherited** from parent variants — it must be set explicitly on each product. Root products and intermediate-level variants are typically `false`; leaf variants are typically `true`.

            '
        parentVariantId:
          type: string
          description: Identifier of the immediate parent product in the variant hierarchy. Absent for root-level products.
        parentVariantPath:
          type: array
          description: 'Ordered array of ancestor product identifiers, from the direct parent (index 0) to the root (last index). Empty for root-level products.

            '
          items:
            type: string
        dynamicVariantType:
          type: string
          description: Optional label identifying the variant level or kind within the hierarchy (for example, `"H1_L1"`).
        ownVariantAttributes:
          $ref: '#/components/schemas/ownVariantAttributes'
        inheritedVariantAttributes:
          $ref: '#/components/schemas/inheritedVariantAttributes'
        variants:
          $ref: '#/components/schemas/variantsMap'
        taxClasses:
          $ref: '#/components/schemas/taxClasses'
        vendor:
          $ref: '#/components/schemas/vendor'
        brandId:
          type: string
          description: ID of brand.
        brand:
          $ref: '#/components/schemas/brand'
        labelIds:
          type: array
          items:
            type: string
          description: Collection of label IDs.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/label'
        categoryIds:
          type: array
          description: Category IDs assigned to the product.
          items:
            type: string
        customerSegmentIds:
          type: array
          description: Customer segment IDs assigned to the product.
          items:
            type: string
        relatedItems:
          type: array
          description: List of items in a relationship with this product.
          items:
            $ref: '#/components/schemas/relatedItem'
        weightDependent:
          type: boolean
          description: Mark the product as weight-dependent if the line item price could change after packaging.
        mixins:
          $ref: '#/components/schemas/productMixins'
        media:
          $ref: '#/components/schemas/productMedia'
        metadata:
          $ref: '#/components/schemas/dynamicVariantProductMetadataGet'
      required:
      - id
      - code
      - name
      - productType
    dynamicVariantProductUpdate:
      type: object
      description: Updating products of the DYNAMIC_VARIANT type.
      allOf:
      - $ref: '#/components/schemas/dynamicVariantProduct'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/productMetadataWithVersion'
          productType:
            $ref: '#/components/schemas/productTypeUpdate'
    dynamicVariantProductsArray:
      type: array
      description: List of products of the DYNAMIC_VARIANT type.
      items:
        $ref: '#/components/schemas/dynamicVariantProductWithId'
    brand:
      type: object
      description: Brand data expanded from `brandId`.
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        localizedName:
          type: object
          additionalProperties:
            type: string
        localizedDescription:
          type: object
          additionalProperties:
            type: string
        image:
          type: string
          format: uri
        cloudinaryUrl:
          type: string
          format: uri
        mediaId:
          type: string
    bundleProduct:
      type: object
      description: Products of the BUNDLE type.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/productCore'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/productMetadataCore'
          template:
            $ref: '#/components/schemas/template'
          bundledProducts:
            $ref: '#/components/schemas/bundledProducts'
          productType:
            $ref: '#/components/schemas/productTypeUpdate'
        required:
        - name
        - code
        - bundledProducts
        - productType
    parentVariantProductCreation:
      type: object
      description: Creating products of the PARENT_VARIANT type.
      allOf:
      - $ref: '#/components/schemas/parentVariantProduct'
      - type: object
        properties:
          id:
            type: string
            maxLength: 32
            description: Custom product identifier. If not provided, it is automatically generated.
          productType:
            $ref: '#/components/schemas/productType'
    variantProductMetadataWithVersion:
      type: object
      description: Metadata with the version information.
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/variantProductMetadataCore'
      - type: object
        properties:
          version:
            type: number
            description: Version of the document.
    vendor:
      type: object
      properties:
        id:
          type: string
          description: An identifier of a vendor to whom the product belongs.
        name:
          type: string
          description: Vendor name.
      required:
      - id
  responses:
    common_response_InternalServerError_500:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/coreErrorMessage'
          examples:
            Internal Server Error:
              value:
                code: 500
                status: Internal Server Error
                message: Problem encountered while trying to connect to the database.
    products_get_response_OK_200:
      description: Resources have been retrieved successfully.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/basicProductsArray'
            - $ref: '#/components/schemas/bundleProductsArray'
            - $ref: '#/components/schemas/parentVariantProductsArray'
            - $ref: '#/components/schemas/variantProductsArray'
            - $ref: '#/components/schemas/dynamicVariantProductsArray'
          examples:
            BASIC Product:
              value:
              - id: 545b4e3dfaee4c10def3db24
                yrn: urn:yaas:saasag:caasproduct:product:myshop;545b4e3dfaee4c10def3db24
                code: SmartphoneX21415269949943
                name: Smartphone X2
                description: The world's best camera and camcorder in a waterproof smartphone.
                published: false
                template:
                  id: 633d774f37937d425ce5570f
                  version: 1
