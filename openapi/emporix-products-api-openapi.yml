          type: string
          description: Identifier of an ancestor product that could not be found, indicating a broken hierarchy chain.
        cycleDetected:
          type: boolean
          description: Indicates that a circular reference was detected in the `parentVariantId` chain.
    basicProductCreation:
      type: object
      description: Creating products of the BASIC type.
      allOf:
      - $ref: '#/components/schemas/basicProduct'
      - type: object
        properties:
          id:
            type: string
            maxLength: 32
