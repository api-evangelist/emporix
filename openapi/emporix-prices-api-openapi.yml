openapi: 3.2.0
info:
  title: Emporix Prices API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Prices across 2 of this provider''s published API definitions: emporix-price-service-openapi.yml, emporix-price-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Prices
paths:
  /price/{tenant}/prices:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    post:
      summary: Creating a new price
      tags:
      - Prices
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
      responses:
        '201':
          description: The request was successful. The price has been created.
          headers:
            Location:
              description: 'Location of the newly created resource.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Identifier of a newly created price.
              examples:
                Response example:
                  value:
                    id: 624c3e7c3406122baacc7e93
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
              examples:
                AmbiguousTenant:
                  $ref: '#/components/examples/BadRequest400_AmbiguousTenant'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: Creates a new price for a specified product.
      operationId: POST-price-create-price
      requestBody:
        content:
          application/json:
            examples:
              Tiered/volume price:
                value:
                  id: 6245aa0a78a8576e338fa9c4
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                  - priceValue: 14.99
                  - priceValue: 13.99
              Basic price:
                value:
                  id: 6245aa0a78a8576e338fa9c4
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
            schema:
              $ref: '#/components/schemas/createPrice'
        required: false
      security:
      - OAuth2:
        - price.price_manage
        - price.price_manage_by_vendor
    get:
      summary: Retrieving all prices
      tags:
      - Prices
      responses:
        '200':
          description: The request was successful. A list of prices is returned.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of retrieved prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/prices'
              examples:
                List of prices:
                  $ref: '#/components/examples/RetrievePricesExample'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: 'Retrieves all prices assigned to the tenant. You can filter the results with query parameters.


        **Additional scopes info**

        No specific scopes are required.

        The `price.price_read_by_vendor` scope allows to fetch just the prices belonging to the vendor.'
      security:
      - OAuth2: []
      parameters:
      - $ref: '#/components/parameters/trait_qParam'
      - $ref: '#/components/parameters/trait_siteCodeAware_siteCode'
      - $ref: '#/components/parameters/trait_currencyAware_currency'
      - $ref: '#/components/parameters/trait_effectiveDateAware_effectiveDate'
      - $ref: '#/components/parameters/trait_sortable_sort'
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_XTotalCount_header'
      - $ref: '#/components/parameters/trait_principalIdAware_principalId'
      - $ref: '#/components/parameters/trait_priceModelIdAware_priceModelId'
      - schema:
          type: string
        in: query
        name: itemId
        description: 'IDs of products for which prices should be retrieved.

          '
      - schema:
          type: string
        in: query
        name: itemType
        description: "Item types for which prices should be retrieved. Possible values:\n* `PRODUCT`\n* `SKU`\n\n  **The `SKU` value is in preview mode** - the system does not fully operate on the SKU concept yet.\n"
      - schema:
          type: string
        in: query
        name: country
        description: 'Codes of countries for which prices should be retrieved.

          '
      - $ref: '#/components/parameters/trait_acceptLanguage_header'
      - $ref: '#/components/parameters/query_price_itemName'
      operationId: GET-price-list-all-prices
    servers:
    - url: https://api.emporix.io
  /price/{tenant}/prices/bulk:
    parameters:
    - name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant''s name.


        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    post:
      summary: Creating multiple prices
      tags:
      - Prices
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
      responses:
        '207':
          description: Multi-Status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/priceBulkResponseEntry'
              examples:
                Multi-Status response example:
                  $ref: '#/components/examples/prices_bulk_post_responseBody'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
              examples:
                Payload size validation example:
                  $ref: '#/components/examples/prices_bulk_post_put_responseBody_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: 'Creates multiple prices. The maximum batch size is 200.


        Response for a particular price is returned at the same position (index) at which that price is located in the request body.'
      operationId: POST-price-create-multiple-prices
      requestBody:
        content:
          application/json:
            examples:
              List of tiered/volume prices:
                value:
                - itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                  - priceValue: 14.99
                  - priceValue: 13.99
                - itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c46
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 20
                  - priceValue: 18
                  - priceValue: 16
              List of basic prices:
                value:
                - itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                - itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c46
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 12
            schema:
              type: array
              items:
                $ref: '#/components/schemas/createPrice'
        required: false
      security:
      - OAuth2:
        - price.price_manage
        - price.price_manage_by_vendor
    put:
      summary: Upserting multiple prices
      tags:
      - Prices
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
      responses:
        '207':
          description: Multi-Status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/priceBulkResponseEntry'
              examples:
                Multi-Status response example:
                  $ref: '#/components/examples/prices_bulk_put_responseBody'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
              examples:
                Payload size validation example:
                  $ref: '#/components/examples/prices_bulk_post_put_responseBody_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: 'Updates or creates multiple prices. The maximum batch size is 200.


        Response for a particular price is returned at the same position (index) at which that price is located in the request body.'
      operationId: PUT-price-update-multiple-prices
      requestBody:
        content:
          application/json:
            examples:
              List of tiered/volume prices:
                value:
                - id: 6245aa0a78a8576e338fa9c4
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                  - priceValue: 14.99
                  - priceValue: 13.99
                  metadata:
                    version: 1
                - id: 6245aa0a78a8576e338fa9c5
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c46
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 20
                  - priceValue: 18
                  - priceValue: 16
                  metadata:
                    version: 1
              List of basic prices:
                value:
                - id: 6245aa0a78a8576e338fa9c4
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                  metadata:
                    version: 1
                - id: 6245aa0a78a8576e338fa9c5
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c46
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 12
                  metadata:
                    version: 1
            schema:
              type: array
              items:
                $ref: '#/components/schemas/updatePrice'
        required: false
      security:
      - OAuth2:
        - price.price_manage
        - price.price_manage_by_vendor
    servers:
    - url: https://api.emporix.io
  /price/{tenant}/prices/{priceId}:
    get:
      summary: Retrieving a price
      tags:
      - Prices
      parameters:
      - schema:
          type: boolean
          default: false
        in: query
        name: extendWithPriceModel
        description: 'If set to `true`, the response will also include the price model''s details.

          '
      - $ref: '#/components/parameters/trait_acceptLanguage_header'
      responses:
        '200':
          description: 'The request was successful. Price details are returned.

            '
          content:
            application/json:
              examples:
                Response example:
                  value:
                    id: 62468170bddc000efeb10781
                    itemId:
                      itemType: PRODUCT
                      id: 5f5a3a365bac380024b93c45
                    currency: EUR
                    location:
                      countryCode: DE
                    priceModelId: 6245a8f578a8576e338fa9c3
                    restrictions:
                      siteCodes:
                      - '1111'
                    tierValues:
                    - priceValue: 15.99
                    - priceValue: 14.99
                    - priceValue: 13.99
                    metadata:
                      version: 1
                      createdAt: '2022-04-01T04:37:04.301Z'
                      modifiedAt: '2022-04-01T04:37:04.301Z'
              schema:
                $ref: '#/components/schemas/getSinglePrice'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: 'Retrieves a specified price''s details by priceId.


        ### Additional scopes info

        No specific scopes are required.


        The `price.price_read_by_vendor` scope allows to fetch just the prices belonging to the vendor.'
      security:
      - OAuth2: []
      operationId: GET-price-retrieve-price
    put:
      summary: Upserting a price
      tags:
      - Prices
      parameters:
      - $ref: '#/components/parameters/trait_partiallyUpdatable_partial'
      - $ref: '#/components/parameters/trait_contentLanguage_header'
      responses:
        '201':
          $ref: '#/components/responses/Created_201'
        '204':
          description: 'The request was successful. The price has been updated.

            '
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: Updates a specified price's details by priceId, or creates a new one with if a price with the given ID doesn't exist yet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updatePrice'
            examples:
              Request example:
                value:
                  id: 62468170bddc000efeb10781
                  itemId:
                    itemType: PRODUCT
                    id: 5f5a3a365bac380024b93c45
                  currency: EUR
                  location:
                    countryCode: DE
                  priceModelId: 6245a8f578a8576e338fa9c3
                  restrictions:
                    siteCodes:
                    - '1111'
                  tierValues:
                  - priceValue: 15.99
                  - priceValue: 14.99
                  - priceValue: 13.99
                  metadata:
                    version: 1
        required: false
        description: ''
      security:
      - OAuth2:
        - price.price_manage
        - price.price_manage_by vendor
      operationId: PUT-price-update-price
    delete:
      summary: Deleting a price
      tags:
      - Prices
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: false
      parameters:
      - name: priceId
        in: path
        required: true
        schema:
          type: string
        description: Price's unique identifier, generated when the price is created.
      - $ref: '#/components/parameters/trait_tenant'
      responses:
        '204':
          description: The request was successful. The price has been updated.
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: Deletes a specified price by priceId.
      security:
      - OAuth2:
        - price.price_manage
        - price.price_manage_by_vendor
      operationId: DELETE-price-remove-price
    servers:
    - url: https://api.emporix.io
  /price/{tenant}/prices/search:
    post:
      summary: Searching for prices
      tags:
      - Prices
      responses:
        '200':
          description: Prices have been successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    itemId:
                      type: string
                    prices:
                      $ref: '#/components/schemas/prices'
              examples:
                Search Prices:
                  value:
                  - itemId: 62d7d680a07705795f72f314
                    prices: []
                  - itemId: 62d7d67da07705795f72f313
                    prices:
                    - id: 62d7d67d92eb0f38a72a2a16
                      itemId:
                        itemType: PRODUCT
                        id: 62d7d67da07705795f72f313
                      itemYrn: urn:yaas:saasag:caasproduct:product:testtenant;62d7d67da07705795f72f313
                      currency: EUR
                      location:
                        countryCode: DE
                      salePrice:
                        discountRate: 0
                      priceModelId: 62d7d67d92eb0f38a72a2a13
                      restrictions:
                        principals:
                        - type: CUSTOMER
                          id: '18637136'
                        validity:
                          from: '2021-08-31T00:07:42.518Z'
                          to: '2026-08-31T00:07:42.518Z'
                        siteCodes:
                        - Berlin
                      tierValues:
                      - priceValue: 10
                      priceModel:
                        id: 62d7d67d92eb0f38a72a2a13
                        name:
                          de: Basic
                        description:
                          de: Basic price model
                        includesTax: false
                        includesMarkup: true
                        measurementUnit:
                          quantity: 1
                          unitCode: pc
                        tierDefinition:
                          tierType: BASIC
                          tiers:
                          - minQuantity:
                              quantity: 0
                              unitCode: pc
                        metadata:
                          version: 1
                          createdAt: '2022-07-20T10:18:37.265Z'
                          modifiedAt: '2022-07-20T10:18:37.265Z'
                        default: false
                      mixins:
                        test2:
                          atr1: test
                          atr2: test2
                        test1:
                          atr1: test
                          atr2: test2
                      metadata:
                        version: 1
                        createdAt: '2022-07-20T10:18:37.984Z'
                        modifiedAt: '2022-07-20T10:18:37.984Z'
                        mixins:
                          test2: url2
                          test1: url1
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      description: Retrieves prices (or a single price) for a list of products.
      security:
      - OAuth2:
        - price.price_read
        - price.price_manage
      operationId: POST-price-search-prices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/searchPrices'
            examples:
              Search Prices:
                value:
                  itemIds:
                  - 62d7d67da07705795f72f313
                  - 62d7d67da07705795f72f314
                  currency: EUR
                  siteCode: Berlin
                  principalId: principalId
                  effectiveDate: '2022-01-01T00:00:00Z'
                  includesTax: true
                  useFallback: false
                  searchMode: ALL_PRICES
        required: false
      parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/query_pricesearch_expand'
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    trait_principalIdAware_principalId:
      name: principalId
      in: query
      description: 'IDs of customers for whom the retrieved prices should be valid.

        '
      schema:
        type: string
    trait_sortable_sort:
      name: sort
      in: query
      description: "List of properties used to sort the results, separated by colons. The order of properties indicates their priority in sorting.\n\nPossible values:\n* `{fieldName}`\n* `{fieldName}:asc`\n* `{fieldName}:desc`\n\n**Note:** If you want to sort the results by localized properties, the possible values are:\n  * `{fieldName}.{language}`\n  * `{fieldName}.{language}:asc`\n  * `{fieldName}.{language}:desc`\n\nIf the sorting direction is not specified, the fields are sorted in ascending order."
      schema:
        type: string
    trait_siteCodeAware_siteCode:
      name: siteCode
      in: query
      description: Codes of sites for which prices should be retrieved.
      schema:
        default: main
        type: string
    trait_paged_pageNumber:
      name: pageNumber
      in: query
      description: 'Page number to be retrieved. The number of the first page is 1.


        **Note:** If the `pageNumber` parameter is passed, size of the pages must be specified in the `pageSize` parameter.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    trait_contentLanguage_header:
      name: Content-Language
      in: header
      required: false
      schema:
        type: string
      description: 'List of languages in which localized fields in the request body are provided.


        * If the `Content-Language` header is set to `*`, the localized fields should be provided as maps of translations, where the keys are language codes and values are the fields in their respective languages.

        * If the `Content-Language` header is set to a specific language, the localized fields should be provided as strings.

        * If the `Content-Language` header is empty, the endpoint will asume that the localized fields are provided in the default language defined in the Configuration Service.


        **Note**: You can provide the localized fields only in languages defined in the Configuration Service. In case the fields are provided in languages that are not defined in the Configuration Service, the request will be rejected.

        '
    trait_currencyAware_currency:
      name: currency
      in: query
      description: Codes of currencies in which prices should be retrieved.
      schema:
        type: string
    trait_priceModelIdAware_priceModelId:
      name: priceModelId
      in: query
      description: 'ID of the price model to which the retrieved prices should be assigned.

        '
      schema:
        type: string
    trait_effectiveDateAware_effectiveDate:
      name: effectiveDate
      in: query
      description: Date on which retrieved prices should be valid, compliant with the ISO 8601 standard. Format:```date-fullyear "-" date-month "-" date-mday "T" partial-time time-offset```
      schema:
        type: string
        default: '2022-01-01T00:00:00Z'
    trait_XTotalCount_header:
      in: header
      name: X-Total-Count
      required: false
      description: Flag indicating whether the total count of retrieved items should be returned.
      schema:
        default: false
        type: boolean
    query_price_itemName:
      name: itemName
      in: query
      required: false
      schema:
        type: string
      description: A product or SKU name.
    trait_acceptLanguage_header:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 'List of language codes acceptable for the response. You can specify factors that indicate which language should be retrieved if the one with a higher factor was not found in the localized fields.

        * If the header is set to a particular language or a list of languages, all localized fields are retrieved as strings.

        * If the header is set to `*`, all localized fields are retrieved as maps of translations, where the keys are language codes and values are the fields in their respective languages.

        * If the header is empty, localized fields are retrieved in the default language defined in the Configuration Service.

        '
    trait_paged_pageSize:
      name: pageSize
      in: query
      description: 'Number of items to be retrieved per page.

        '
      schema:
        default: 60
        minimum: 1
        type: integer
    query_pricesearch_expand:
      name: expand
      in: query
      required: false
      schema:
        type: string
      description: "Fields that should be expanded with additional information in the response body. Expressed as strings separated by commas.\n\nPossible values:\n  * `priceModel`\n"
    trait_partiallyUpdatable_partial:
      name: partial
      in: query
      required: true
      description: '| Value | Description |

        | --- | --- |

        | `true` | A partial update will be performed. |

        | `false` | A full product replacement will be performed. |'
      schema:
        type: boolean
    trait_qParam:
      in: query
      name: q
