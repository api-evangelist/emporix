openapi: 3.2.0
info:
  title: Emporix MCP Server API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged MCP Server across 2 of this provider''s published API definitions: emporix-ai-service-openapi.yml, emporix-ai-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: MCP Server
  description: Manage MCP Servers
paths:
  /ai-service/{tenant}/agentic/mcp-servers:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    - $ref: '#/components/parameters/qParam'
    - $ref: '#/components/parameters/pageSize'
    - $ref: '#/components/parameters/pageNumber'
    - $ref: '#/components/parameters/sort'
    - $ref: '#/components/parameters/fields'
    - $ref: '#/components/parameters/expandMcpServer'
    - $ref: '#/components/parameters/header_xTotalCount'
    get:
      summary: Listing MCP servers
      operationId: GET-ai-list-mcp-servers
      responses:
        '200':
          description: List of MCP servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/McpServerResponse'
              examples:
                Mcp Servers Response:
                  $ref: '#/components/examples/McpServersResponse'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
      description: Retrieves MCP servers based on the provided query.
      security:
      - OAuth2:
        - ai.agent_read
      tags:
      - MCP Server
    servers:
    - url: https://api.emporix.io
  /ai-service/{tenant}/agentic/mcp-servers/search:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    post:
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/expandMcpServer'
      - $ref: '#/components/parameters/header_xTotalCount'
      summary: Searching MCP servers
      operationId: POST-ai-search-mcp-servers
      responses:
        '200':
          description: List of MCP servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/McpServerResponse'
              examples:
                Tokens Response:
                  $ref: '#/components/examples/McpServersResponse'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
      requestBody:
        $ref: '#/components/requestBodies/QParamSearchBody'
      description: Searches for MCP servers based on the provided query.
      security:
      - OAuth2:
        - ai.agent_read
      tags:
      - MCP Server
    servers:
    - url: https://api.emporix.io
  /ai-service/{tenant}/agentic/mcp-servers/{mcpServerId}:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    - schema:
        type: string
      name: mcpServerId
      in: path
      required: true
    get:
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/expandMcpServer'
      summary: Retrieving MCP server by ID
      operationId: GET-ai-retrieve-mcp-server
      responses:
        '200':
          description: A single mcp server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerResponse'
              examples:
                MCP Server Response:
                  $ref: '#/components/examples/McpServerResponse'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
      description: Retrieves the MCP server by a given ID.
      security:
      - OAuth2:
        - ai.agent_read
      tags:
      - MCP Server
    put:
      summary: Upserting MCP server
      parameters:
      - $ref: '#/components/parameters/forceDisable'
      operationId: PUT-ai-upsert-mcp-server
      responses:
        '201':
          description: ID of created MCP server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              examples:
                Id Of Created Mcp Server:
                  $ref: '#/components/examples/IdResponse'
        '204':
          description: The resource has been successfully updated.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
        '409':
          $ref: '#/components/responses/409_resp_common'
      description: 'Updates or creates a specified MCP server by replacing all of its existing data with data from the request body.

        If the `metadata.version` is provided, then optimistic locking is enabled and version must match the version in the database.


        ***Important***: If MCP server is being used by an enabled agent then disabling MCP is not possible without `force` flag set to `true`. Only then the agent and MCP server are disabled.


        The `type: dynamic` value and its `tools` definitions are in preview. When upserting an enabled dynamic MCP server, each tool''s `config.invocation.functionId` is validated against the Automation service. The request returns `400` when a referenced function does not exist on the tenant.


        {% hint style="danger" %}

        Hosting of cloud functions and use of dynamic MCP servers is not included in standard billing plans and is billed separately on a pay-as-you-go basis. If you''re interested in getting access to these features, contact the Sales Team.

        {% endhint %}'
      security:
      - OAuth2:
        - ai.agent_manage
      requestBody:
        $ref: '#/components/requestBodies/mcpServerUpsertBody'
      tags:
      - MCP Server
    patch:
      summary: Partially updating MCP server
      parameters:
      - $ref: '#/components/parameters/force'
      operationId: PATCH-ai-update-mcp-server
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
      description: 'Partially updates a single mcp server document with given information.

        Single update may contain multiple partial updates in the form of an array. It contains the allowed operations list:

        - `add` (adding an item to the items list)

        - `remove` (removing an item from the items list)

        - `replace` (replacing an item with given ID with new definition)


        ***Important***: If an MCP server is being used by an enabled agent then disabling MCP is not possible without `force` flag set to `true`. Only then the agent and MCP server are disabled.'
      security:
      - OAuth2:
        - ai.agent_manage
      requestBody:
        $ref: '#/components/requestBodies/mcpServerPatchBody'
      tags:
      - MCP Server
    delete:
      parameters:
      - $ref: '#/components/parameters/force'
      summary: Deleting MCP server
      operationId: DELETE-ai-delete-mcp-server
      responses:
        '204':
          description: Given mcp server has been deleted.
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
        '404':
          $ref: '#/components/responses/404_resp_common'
      description: 'Deletes MCP server by given ID.


        ***Important***: If MCP server is being used by an agent then delete operation is not possible without `force` flag set to `true`.'
      security:
      - OAuth2:
        - ai.agent_manage
      tags:
      - MCP Server
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    qParam:
      in: query
      name: q
      description: 'A standard query parameter is used to search for specific values.


        See: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)

        '
      schema:
        type: string
    forceDisable:
      schema:
        type: boolean
      in: query
      name: force
      example: false
      description: Allows you to disable a given entity even if it is used as a dependency in other entries. In that case, cascade disable is performed.
    sort:
      schema:
        type: string
      in: query
      name: sort
      description: List of properties used to sort the results, separated by colons.
    expandMcpServer:
      schema:
        type: string
        enum:
        - token
      in: query
      name: expand
      description: Fields to be expanded in the response. It means that instead of the object IDs, the whole objects are returned in the response.
    header_xTotalCount:
      schema:
        type: boolean
      in: header
      name: X-Total-Count
      description: Flag indicating whether the total number of retrieved results should be returned.
    path_tenant:
      name: tenant
      in: path
      required: true
      schema:
        type: string
      description: 'Your Emporix tenant name.


        **Note**: The tenant name should always be provided in lowercase.

        '
    force:
      schema:
        type: boolean
      in: query
      name: force
      example: false
      description: Allows you to remove a given entity even if it is used as a dependency in other entries. In that case, the removed entity is unassigned from other entries.
    pageNumber:
      schema:
        type: string
      in: query
      name: pageNumber
      description: The page number to be retrieved. The size of the pages should be specified by the `pageSize` parameter.
    pageSize:
      schema:
        type: string
      in: query
      name: pageSize
      description: The number of documents to be retrieved per page.
    fields:
      schema:
        type: string
      in: query
      name: fields
      description: Fields to be returned in the response.
  schemas:
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
        type:
          type: string
        message:
          type: string
        moreInfo:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              type:
                type: string
              message:
                type: string
              moreInfo:
                type: string
      description: ''
    CustomMcpServerResponse:
      allOf:
      - $ref: '#/components/schemas/BaseManagedMcpServer'
      - type: object
        description: An object representing customer's own implementation of the MCP server.
        properties:
          id:
            type: string
            description: Unique identifier of the MCP server.
          type:
            allOf:
            - $ref: '#/components/schemas/ManagedMcpServerType'
            description: Type of the managed MCP server resource.
            example: custom
          config:
            $ref: '#/components/schemas/McpServerConfigResponse'
          metadata:
            $ref: '#/components/schemas/MetadataResponse'
    QParamSearchBody:
      type: object
      properties:
        q:
          type: string
          description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
    McpToolInvocationResponse:
      type: object
      properties:
        functionId:
          type: string
          description: Identifier of the Automation function to invoke when the tool is called.
        method:
          $ref: '#/components/schemas/McpToolInvocationMethod'
        argsLocation:
          $ref: '#/components/schemas/McpToolInvocationArgsLocation'
    IdWrapperRequest:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    CustomMcpServerTransportType:
      type: string
      enum:
      - streamable_http
      - sse
      description: Type of the communication between the agent and the MCP server. The `streamable_http` protocol is recommended, since the `sse` protocol is deprecated as transport for custom MCP servers.
    McpServerConfigRequest:
      allOf:
      - $ref: '#/components/schemas/McpServerConfig'
      - type: object
        properties:
          authorizationHeaderToken:
            $ref: '#/components/schemas/IdWrapperRequest'
    ExpandedTokenResponse:
      allOf:
      - $ref: '#/components/schemas/IdResponse'
      - type: object
        properties:
          name:
            type: string
            description: Name of the token.
          metadata:
            $ref: '#/components/schemas/MetadataResponse'
    DynamicMcpServerResponse:
      allOf:
      - $ref: '#/components/schemas/BaseManagedMcpServer'
      - type: object
        properties:
          id:
            type: string
            description: Unique identifier of the MCP server.
          type:
            allOf:
            - $ref: '#/components/schemas/ManagedMcpServerType'
            description: For dynamic MCP servers it has to be set to `dynamic`.
            example: dynamic
          tools:
            type: array
            description: 'List of tools exposed by this MCP server.


              **The `tools` field is in preview mode** - some of the features may not be fully operational yet.'
            items:
              $ref: '#/components/schemas/McpToolResponse'
          metadata:
            $ref: '#/components/schemas/MetadataResponse'
    IdResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the resource.
    McpServerResponse:
      oneOf:
      - $ref: '#/components/schemas/CustomMcpServerResponse'
      - $ref: '#/components/schemas/DynamicMcpServerResponse'
    McpToolInvocationMethod:
      type: string
      enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      description: HTTP method used to invoke the Automation function.
    ErrorMessageFault:
      type: object
      properties:
        fault:
          type: object
          properties:
            faultstring:
              type: string
            detail:
              type: object
              properties:
                errorcode:
                  type: string
    ExpandableTokenResponse:
      oneOf:
      - $ref: '#/components/schemas/IdResponse'
      - $ref: '#/components/schemas/ExpandedTokenResponse'
      description: The full response representing token. If the `expand=token` is **not** used, then only `id` field is returned, otherwise all fields are returned.
    McpToolRequest:
      type: object
      description: 'Tool definition for a dynamic MCP server.


        **Dynamic MCP tools are in preview mode** - some of the features may not be fully operational yet.'
      properties:
        name:
          type: string
          description: Unique name of the tool. Must contain only letters, numbers, and underscores.
          pattern: ^[A-Za-z0-9_]+$
        description:
          type: string
          description: Human-readable description of the tool.
        prompt:
          type: string
          description: Prompt that defines when and why the agent should call this tool.
        enabled:
          type: boolean
          description: An indicator whether the tool is enabled.
          default: false
        config:
          $ref: '#/components/schemas/McpToolConfigRequest'
      required:
      - name
      - prompt
      - config
    McpToolResponse:
      type: object
      description: 'Tool definition for a dynamic MCP server.


        **Dynamic MCP tools are in preview mode** - some of the features may not be fully operational yet.'
      properties:
        name:
          type: string
          description: Unique name of the tool. Contains only letters, numbers, and underscores.
        description:
          type: string
          description: Human-readable description of the tool.
        prompt:
          type: string
          description: Prompt that defines when and why the agent should call this tool.
        enabled:
          type: boolean
          description: An indicator whether the tool is enabled.
        config:
          $ref: '#/components/schemas/McpToolConfigResponse'
    CustomMcpServerRequest:
      allOf:
      - $ref: '#/components/schemas/BaseManagedMcpServer'
      - type: object
        description: An object representing customer's own implementation of the MCP server.
        properties:
          type:
            allOf:
            - $ref: '#/components/schemas/ManagedMcpServerType'
            description: For custom MCP servers it has to be set to `custom` or omitted. Defaults to `custom`.
            example: custom
          config:
            $ref: '#/components/schemas/McpServerConfigRequest'
          metadata:
            $ref: '#/components/schemas/MetadataRequest'
        required:
        - name
        - transport
        - config
    BaseManagedMcpServer:
      type: object
      properties:
        name:
          type: string
          description: Name of the MCP server.
        enabled:
          type: boolean
          description: An indicator whether the MCP server is enabled.
          default: false
        transport:
          $ref: '#/components/schemas/CustomMcpServerTransportType'
    McpServerRequest:
      oneOf:
      - $ref: '#/components/schemas/CustomMcpServerRequest'
      - $ref: '#/components/schemas/DynamicMcpServerRequest'
    McpToolConfigRequest:
      type: object
      properties:
        requiredScopes:
          type: array
          description: OAuth scopes required to invoke the tool.
          items:
            type: string
        inputSchema:
          type: string
          description: JSON Schema document describing the tool input, provided as a JSON string.
        invocation:
          $ref: '#/components/schemas/McpToolInvocationRequest'
      required:
      - inputSchema
      - invocation
    McpServerConfig:
      type: object
      properties:
        url:
          type: string
          description: URL of the MCP server.
        authorizationHeaderName:
          type: string
          description: Name of the header required for authorization, e.g. `Authorization`.
      required:
      - url
    McpToolConfigResponse:
      type: object
      properties:
        requiredScopes:
          type: array
          description: OAuth scopes required to invoke the tool.
          items:
            type: string
        inputSchema:
          type: string
          description: JSON Schema document describing the tool input, provided as a JSON string.
        invocation:
          $ref: '#/components/schemas/McpToolInvocationResponse'
    McpToolInvocationRequest:
      type: object
      properties:
        functionId:
          type: string
          description: Identifier of the Automation function to invoke when the tool is called.
        method:
          $ref: '#/components/schemas/McpToolInvocationMethod'
        argsLocation:
          $ref: '#/components/schemas/McpToolInvocationArgsLocation'
      required:
      - functionId
      - method
    ManagedMcpServerType:
      type: string
      enum:
      - custom
      - dynamic
      description: "Type of the managed MCP server resource. Possible values:\n* `custom`\n* `dynamic`\n\n  **The `dynamic` value is in preview mode** - some of the features may not be fully operational yet."
    McpServerConfigResponse:
      allOf:
      - $ref: '#/components/schemas/McpServerConfig'
      - type: object
        properties:
          authorizationHeaderToken:
            $ref: '#/components/schemas/ExpandableTokenResponse'
    DynamicMcpServerRequest:
      allOf:
      - $ref: '#/components/schemas/BaseManagedMcpServer'
      - type: object
        description: 'Managed MCP server whose tools invoke Emporix cloud functions.


          {% hint style="danger" %}

          Hosting of cloud functions and use of dynamic MCP servers is not included in standard billing plans and is billed separately on a pay-as-you-go basis. If you''re interested in getting access to these features, contact the [Sales Team](mailto:support@emporix.com).

          {% endhint %}'
        properties:
          type:
            allOf:
            - $ref: '#/components/schemas/ManagedMcpServerType'
            description: For dynamic MCP servers it has to be set to `dynamic`.
            example: dynamic
          tools:
            type: array
            description: 'List of tools exposed by this MCP server.


              **The `tools` field is in preview mode** - some of the features may not be fully operational yet.'
            items:
              $ref: '#/components/schemas/McpToolRequest'
          metadata:
            $ref: '#/components/schemas/MetadataRequest'
        required:
        - name
        - type
        - tools
    PatchRequest:
      type: array
      description: Partial update operation list.
      items:
        type: object
        properties:
          op:
            anyOf:
            - enum:
              - ADD
              - REMOVE
              - REPLACE
            type: string
          path:
            type: string
            example: /name
          value:
            anyOf:
            - type: string
              description: Value of the string type.
            - type: object
              description: Any part of the details object.
        required:
        - op
        - path
    MetadataResponse:
      allOf:
      - $ref: '#/components/schemas/MetadataRequest'
      - type: object
        properties:
          createdAt:
            description: 'Date and time when the object was created. The value is approved as an ISO-8601 representation of an Instant. For example: `2022-04-30T13:18:02.379Z`'
            type: string
          modifiedAt:
            description: 'Date and time when the object was last modified. The value is approved as an ISO-8601 representation of an Instant. For example: `2022-04-30T13:18:02.379Z`'
            type: string
        required:
        - version
        - createdAt
        - modifiedAt
    MetadataRequest:
      type: object
      properties:
        version:
          minimum: 1
          type: integer
          description: Version of the object. The version is required during the update operation because of the optimistic locking mechanism.
      required:
      - version
    McpToolInvocationArgsLocation:
      type: string
      enum:
      - body
      - query
      description: Location of the tool arguments in the HTTP request. Defaults to `body` when omitted.
  requestBodies:
    mcpServerPatchBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatchRequest'
          examples:
            Change name:
              value:
              - op: REPLACE
                path: /name
                value: New Custom MCP Server
            Replace tools on dynamic MCP server:
              value:
              - op: REPLACE
                path: /tools
                value:
                - name: get_order
                  prompt: Use this tool to retrieve an order by ID.
                  enabled: true
                  config:
                    inputSchema: '{"type":"object","properties":{"orderId":{"type":"string"}},"required":["orderId"]}'
                    invocation:
                      functionId: fn-get-order
                      method: GET
                      argsLocation: query
    QParamSearchBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QParamSearchBody'
          examples:
            Search Request:
              value:
                q: name:~Complaint
    mcpServerUpsertBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/McpServerRequest'
          examples:
            Create Custom MCP Server:
              $ref: '#/components/examples/CustomMcpServerRequest'
            Create Dynamic MCP Server:
              $ref: '#/components/examples/DynamicMcpServerRequest'
  responses:
    409_resp_common:
      description: "There are three possible reasons:\n 1. Resource with given code already exists, please choose unique code for your resource\n 2. Optimistic locking failed. If user sends metadata/version attribute which is outdated (someone else updated resource in the time user was performing his changes). User should retrieve the latest product data and retry the request.\n 3. Optimistic locking failed. User did not provide metadata/version attribute in update request, but someone else updated product while it was internally handled by product service. Resending the same request can result in successful update, but the update can override recently persisted changes.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Resource conflict:
              value:
                code: 409
                status: Conflict
                message: Conflict - a resource with given code or id has already exist.
    403_resp_common:
      description: Authorization scopes of the access token are not sufficient and do not match the scopes required by the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Access forbidden:
              value:
                code: 403
                status: Forbidden
                message: The access to the requested resource has been forbidden by the server.
    400_resp_common:
      description: The request was syntactically incorrect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Code must not be null:
              value:
                code: 400
                status: Bad Request
                message: Validation problem with request body.
                details:
                - message: code must not be null nor blank
    401_resp_common:
      description: The authorization token is invalid or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessageFault'
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
    404_resp_common:
      description: Example response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Resource not found:
              value:
                resourceId: 628cd20c6e8b2432b6346ca6
                code: 404
                status: Not Found
                message: The resource with id 628cd20c6e8b2432b6346ca6 has not been found.
  examples:
    McpServerResponse:
      value:
        id: mcp-custom
        name: Custom MCP Server
        type: custom
        enabled: true
        transport: streamable_http
        config:
          url: http://localhost:7900/mcp
          authorizationHeaderName: Authorization
          authorizationHeaderToken:
            id: token-id
    IdResponse:
      value:
        id: a81bc81b-dead-4e5d-abff-90865d1e13b1
    DynamicMcpServerRequest:
      value:
        name: Dynamic MCP Server
        type: dynamic
        enabled: true
        tools:
        - name: get_order
          description: Retrieves an order by ID.
          prompt: Use this tool when the user asks for order details.
          enabled: true
          config:
            requiredScopes:
            - order.order_read
            inputSchema: '{"type":"object","properties":{"orderId":{"type":"string"}},"required":["orderId"]}'
            invocation:
              functionId: fn-get-order
              method: GET
              argsLocation: query
