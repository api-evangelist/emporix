openapi: 3.2.0
info:
  title: Emporix Addresses API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Addresses across 4 of this provider''s published API definitions: emporix-customer-management-openapi.yml, emporix-customer-service-openapi.yml, emporix-customer-management-openapi.yml, emporix-customer-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Addresses
  description: Manage customer address information.
