      description: 'Adds an address to a customer profile.


        **Note**: The request needs to be authorized with a customer access token.'
      operationId: POST-customer-add-address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateDto'
            examples:
              Request example:
                value:
                  contactName: John Doe
                  companyName: Emporix
                  street: Platz der Republik
                  streetNumber: '1'
                  streetAppendix: ''
                  extraLine1: ''
                  extraLine2: ''
                  extraLine3: ''
                  extraLine4: ''
                  zipCode: '11011'
                  city: Berlin
                  country: DE
                  state: Berlin
                  contactPhone: '123456789'
                  tags:
                  - BILLING
                  - SHIPPING
        required: false
      security:
      - CustomerAccessToken: []
      summary: Adding a customer address
      tags:
      - Addresses
    get:
