components:
  parameters:
    addressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Address unique identifier generated when the address is added to a customer profile.
    tags:
      name: tags
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        example: BILLING,SHIPPING
      description: List of address tags, separated by commas.
    tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    tags_2:
      name: tags
      in: query
      required: true
      schema:
        type: string
        example: BILLING,SHIPPING
      description: List of address tags, separated by commas.
    customerNumber:
      name: customerNumber
      in: path
      required: true
      schema:
        type: string
      description: Customer unique identifier generated when the customer profile is created.
    tenant_2:
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      name: tenant
      in: path
      required: true
      schema:
        type: string
    Api_Tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    addressId_2:
      name: addressId
      in: path
      required: true
      schema:
        type: string
      description: Address unique identifier generated when the address is added to a customer profile.
    tags_3:
      name: tags
      in: query
      required: true
      schema:
        type: string
        example: BILLING,SHIPPING
      description: List of address tags, separated by commas.
    tenant_3:
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      name: tenant
      in: path
      required: true
      schema:
        type: string
    addressId_3:
      name: addressId
      in: path
      required: true
      schema:
        type: string
      description: Address unique identifier generated when the address is added to a customer profile.
  schemas:
    AddressDto:
      title: AddressDto
      allOf:
      - $ref: '#/components/schemas/AddressCommonDto'
      - properties:
          id:
            type: string
            description: Customer address' unique identifier generated when the address is added to the customer account.
          isDefault:
            type: boolean
            description: Flag indicating whether the address is the customer default address.
        type: object
    ErrorMessage:
      title: ''
      description: Schema for API-specific errors.
      type: object
      properties:
        status:
          minimum: 100
          maximum: 599
          description: Original HTTP error code. It should be consistent with the HTTP response code.
          type: integer
        type:
          pattern: '[a-z]+[a-z_]*[a-z]+'
          description: 'Classification of the error type.

            **Note:** The error type should be written in lowercase and include underscores, for example `validation_failure`.'
          type: string
        message:
          description: Descriptive error message for debugging purposes.
          type: string
        moreInfo:
          type: string
          description: More information (such as a link to the documentation) for investigating further and getting support.
        details:
          description: List of problems causing the error.
          type: array
          items:
            title: errorDetail
            description: Specific error cause.
            type: object
            properties:
              field:
                description: 'Element in request data which is causing the error, for example `category.name`.

                  If the violation was not field-specific, this field will be empty.'
                type: string
              type:
                pattern: '[a-z]+[a-z_]*[a-z]+'
                description: 'Classification of the specific error cause. This value should always be interpreted within the context of the general error type.

                  **Note:** The error type should be written in lowercase and include underscores, for example `missing_value`.'
                type: string
              message:
                description: Descriptive error message for debugging purposes.
                type: string
              moreInfo:
                type: string
                description: More information (such as a link to the documentation) for investigating further and getting support.
    AddressCommonDto:
      title: AddressCommonDto
      type: object
      allOf:
      - $ref: '#/components/schemas/AddressCreateDto'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/DefaultDtoMetadata'
    DefaultDtoMetadata:
      title: DefaultDtoMetadata
      type: object
      allOf:
      - $ref: '#/components/schemas/BasicMetadataDto'
      - type: object
        properties:
          version:
            type: integer
    ResourceLocation:
