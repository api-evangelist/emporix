openapi: 3.2.0
info:
  title: Emporix Transaction API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Transaction across 2 of this provider''s published API definitions: emporix-payment-gateway-openapi.yml, emporix-payment-gateway-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2: []
tags:
- name: Transaction
paths:
  /payment-gateway/{tenant}/transactions:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    get:
      summary: Retrieving many transactions
      tags:
      - Transaction
      responses:
        '200':
          $ref: '#/components/responses/paymentTransactionsResponse'
        '401':
          $ref: '#/components/responses/common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/common_response_Forbidden_403'
        '500':
          $ref: '#/components/responses/common_response_InternalServerError_500'
      operationId: GET-payment-gateway-list-transactions
      description: Retrieves many payment transactions. A particular transaction contains all transactions' events attached as an entries of the response body.
      security:
      - OAuth2:
        - payment-gateway.paymenttransactions_read
      parameters:
      - $ref: '#/components/parameters/page_number_query_param'
      - $ref: '#/components/parameters/page_size_query_param'
      - $ref: '#/components/parameters/sort_query_param'
      - $ref: '#/components/parameters/x_total_count_header'
    servers:
    - url: https://api.emporix.io
  /payment-gateway/{tenant}/transactions/{transactionId}:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    - $ref: '#/components/parameters/path_transaction_id'
    get:
      summary: Retrieving a single transaction
      tags:
      - Transaction
      responses:
        '200':
          $ref: '#/components/responses/paymentTransactionResponse'
        '401':
          $ref: '#/components/responses/common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/common_response_Forbidden_403'
        '404':
          $ref: '#/components/responses/common_response_NotFound_404'
        '500':
          $ref: '#/components/responses/common_response_InternalServerError_500'
      operationId: GET-payment-gateway-retrieve-transaction-by-transactionId
      security:
      - OAuth2:
        - payment-gateway.paymenttransactions_read
      description: Retrieves a single payment transaction. The transaction contains all the transaction's events attached as an entries of the response body.
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    x_total_count_header:
      name: X-Total-Count
      in: header
      required: false
      schema:
        type: boolean
      description: To get information how many entities meet the filtering requirements, the `X-Total-Count` header has been introduced. The header is optional and its default value is `false`. If the header is provided and it is set to `true`, then the total count is returned in the `X-Total-Count` response header. In both cases (X-Total-Count `true`, `false` or not provided), the response body has the same format (array of entities). This means that the information about the total count is returned only on demand, provided that the X-Total-Count header is present in a request.
    path_tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant''s name.

        **Note**: The tenant name should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    page_size_query_param:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 50
      description: The number of documents being retrieved on one page.
    sort_query_param:
      name: sort
      in: query
      required: false
      schema:
        type: string
        example: sort=name,metadata.createdAt:desc
      description: 'Fields to sort the response data by following the order of the parameters from left to right. Can contain multiple fields in the following format: `field name:sort direction`, separated by a comma. The colon preceding the `sort direction` parameter is optional, and the descending order is taken only if it is equal to `desc` or `DESC`. The ascending order is assumed in any other case.'
    path_transaction_id:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier of a payment transaction.
    page_number_query_param:
      name: pageNumber
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: The page number to be retrieved, where the size of the pages is specified by the `pageSize` parameter. The number of the first page is 1.
  schemas:
    paymentTransactionResponse:
      title: paymentTransactionResponse
      type: object
      properties:
        id:
          type: string
          description: A unique identifier of a payment transaction.
        provider:
          $ref: '#/components/schemas/provider'
          description: Indicates which provider should be used.
        paymentInformation:
          type: object
          description: Information related to a payment mode.
          properties:
            paymentMode:
              type: string
              description: A unique identifier of a payment mode configured for the tenant.
            creditCardToken:
              type: string
              description: Token of the credit card.
            cardHolderName:
              type: string
              description: Name of the card holder.
            payByLinkURL:
              type: string
              description: URL for pay-by-link payment flow.
            iban:
              type: string
              description: International Bank Account Number.
            bic:
              type: string
              description: Bank Identifier Code (SWIFT).
            sepaMandateReference:
              type: string
              description: SEPA mandate reference.
        entries:
          type: array
          description: List of transaction entries representing payment events.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of a payment transaction entry.
              createdDate:
                type: string
                format: date-time
                description: Timestamp when the event happened.
                example: '2023-07-04T22:08:05.465Z'
              type:
                type: string
                description: Event type.
                enum:
                - INITIALIZATION
                - AUTHORIZATION
                - CAPTURE
                - REFUND
                - CANCEL
                - AUTHORIZATION_START
                - AUTHORIZATION_CALLBACK
              successful:
                type: boolean
                description: Indicates if the event completed successfully.
              amount:
                type: object
                properties:
                  amount:
                    type: number
                    description: Amount related to the event.
                  currency:
                    type: string
                    description: ISO currency code.
                    example: EUR
              summary:
                type: string
                description: Summary of the event.
              remoteRequest:
                type: string
                description: Serialized request body sent to payment provider.
              remoteResponse:
                type: string
                description: Serialized response body from payment provider.
              remoteToken:
                type: string
                description: Remote token returned by payment provider.
              additionalInfo:
                type: object
                description: Additional info about the transaction.
                additionalProperties: true
    provider:
      type: string
      enum:
      - INVOICE
      - CASH_ON_DELIVERY
      - SPREEDLY
      - SPREEDLY_SAFERPAY
      - UNZER
    coreErrorMessage:
      anyOf:
      - type: object
        properties:
          code:
            type: integer
            description: HTTP Status code.
          timestamp:
            type: string
            description: Indicates a timestamp when the error occurred.
          message:
            type: string
            description: Error message.
      - type: object
        properties:
          type:
            type: string
            description: HTTP error type.
          status:
            type: integer
            description: HTTP Status code.
          message:
            type: string
            description: Error message.
          moreInfo:
            type: string
            description: URL which additional information.
          details:
            type: array
            items:
              type: object
              properties:
                message:
                  type: string
                  description: Detailed message.
  responses:
    paymentTransactionResponse:
      description: Payment transaction response
      content:
