openapi: 3.2.0
info:
  title: Emporix Legal Entities API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Legal Entities across 2 of this provider''s published API definitions: emporix-client-management-openapi.yml, emporix-client-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2:
  - customermanagement.legalentity_read
  - customermanagement.legalentity_read_own
  - customermanagement.legalentity_manage
  - customermanagement.contactassignment_read
  - customermanagement.contactassignment_manage
  - customermanagement.location_read
  - customermanagement.location_manage
tags:
- name: Legal Entities
paths:
  /customer-management/{tenant}/legal-entities:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    post:
      summary: Creating legal entity
      description: Creates a new legal entity for the tenant. A legal entity represents a company or it's subsidiary in the system.
      security:
      - OAuth2:
        - customermanagement.legalentity_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/legalEntityCreate'
            examples:
              Create a company:
                value:
                  name: ABC Company
                  type: COMPANY
                  legalInfo:
                    legalName: ABC Company
                    registrationDate: '2022-03-31T13:18:02.379Z'
                    registrationAgency: Comp reg agency
                    registrationId: 627e06ecf0452c2d6c0b81391
                    countryOfRegistration: DE
                    taxRegistrationNumber: '1234'
                  accountLimit:
                    currency: EUR
                    value: 1000.99
                  customerGroups:
                  - id: 123e06ecf0452c2d6c0b81390
                    name:
                      en: En customer group name
                      de: De customer group name
                  entitiesAddresses:
                  - id: 123e123455452c2d6c0b81390
                  - id: 123e06ecf0acd223140b12345
                  approvalGroup:
                  - id: 123e121111452c12330b81390
                  - id: 123e061110acd223133333345
                  restrictions:
                  - US
              Create a subsidiary:
                value:
                  name: ABC Subsidiary
                  type: SUBSIDIARY
                  parentId: 627e06ecf0452c2d6c0b81391
                  legalInfo:
                    legalName: ABC Subsidiary
                    registrationDate: '2022-03-31T13:18:02.379Z'
                    registrationAgency: Sub reg agency
                    registrationId: 627e06ecf0452c2d6c0b81391
                    countryOfRegistration: DE
                    taxRegistrationNumber: '4311'
                  accountLimit:
                    currency: EUR
                    value: 1000.99
                  customerGroups:
                  - id: 123e06ecf0452c2d6c0b81390
                  - id: 123e06ecf0452c2d6c0b12345
                  entitiesAddresses:
                  - id: 123e123455452c2d6c0b81390
                  approvalGroup:
                  - id: 123e061110acd223133333345
      responses:
        '201':
          description: The request was successful. The legal entity has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              examples:
                Legal entity created:
                  value:
                    id: 53ac81fd0cce8b26b36f3492
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: POST-customer-mgmt-create-legal-entity
      tags:
      - Legal Entities
    get:
      summary: Retrieving all legal entities
      description: 'Retrieves all legal entities. You can filter, sort and paginate the results with query parameters.


        * If the `customermanagement.legalentity_read` scope is used, then all legal entities assigned to the tenant are returned.

        * If the `customermanagement.legalentity_read_own` scope is used, then all legal entities assigned to the customer are returned.'
      security:
      - OAuth2:
        - customermanagement.legalentity_read
        - customermanagement.legalentity_read_own
      parameters:
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_XTotalCount_header'
      - $ref: '#/components/parameters/trait_sort'
      - $ref: '#/components/parameters/trait_q_param'
      - $ref: '#/components/parameters/trait_fields'
      - $ref: '#/components/parameters/trait_legalEntity_id_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_name_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_type_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_parentId_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_legalName_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationDate_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_taxRegistrationNumber_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationAgency_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_countryOfRegistration_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationId_query_param'
      responses:
        '200':
          $ref: '#/components/responses/GetLegalEntities'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: GET-customer-mgmt-list-legal-entities
      tags:
      - Legal Entities
    servers:
    - url: https://api.emporix.io
  /customer-management/{tenant}/legal-entities/search:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    post:
      summary: Searching with parameters for legal entities
      description: 'Retrieves all legal entities that match provided criteria.


        If the `customermanagement.legalentity_read` scope is used, then all legal entities assigned to the tenant are returned.

        If the `customermanagement.legalentity_read_own` scope is used, then all legal entities assigned to the customer are returned.'
      security:
      - OAuth2:
        - customermanagement.legalentity_read
        - customermanagement.legalentity_read_own
      parameters:
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_XTotalCount_header'
      - $ref: '#/components/parameters/trait_sort'
      - $ref: '#/components/parameters/trait_fields'
      - $ref: '#/components/parameters/trait_legalEntity_id_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_name_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_type_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_parentId_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_legalName_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationDate_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_taxRegistrationNumber_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationAgency_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_countryOfRegistration_query_param'
      - $ref: '#/components/parameters/trait_legalEntity_registrationId_query_param'
      requestBody:
        content:
          application/json:
            schema:
              title: qParam
              type: object
              properties:
                q:
                  type: string
                  description: Query param for filtering entities by specified type.
            examples:
              Search by type:
                value:
                  q: type:COMPANY
              Search by date:
                value:
                  q: metadata.createdAt:(>"2023-04-17T08:00:00.000Z" AND <"2024-04-17T17:30:00.000Z")
              Search by name:
                value:
                  q: name:"Company Name"
      responses:
        '200':
          $ref: '#/components/responses/GetLegalEntities'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: POST-customer-mgmt-search-legal-entities
      tags:
      - Legal Entities
    servers:
    - url: https://api.emporix.io
  /customer-management/{tenant}/legal-entities/{legalEntityId}:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    - $ref: '#/components/parameters/trait_legalEntity_id_path'
    get:
      summary: Retrieving a legal entity
      parameters:
      - $ref: '#/components/parameters/trait_fields'
      description: Retrieves a legal entity by the specified unique identifier.
      security:
      - OAuth2:
        - customermanagement.legalentity_read
      responses:
        '200':
          $ref: '#/components/responses/GetLegalEntity'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: GET-customer-mgmt-retrieve-legal-entity
      tags:
      - Legal Entities
    put:
      summary: Upserting a legal entity
      description: 'Updates or creates a legal entity with given legal entity id. You can omit the `metadata.version`, but then optimistic locking is not enabled.


        **Important**: If automatically generated customer group is not present in customerGroups list,

        this group will be removed from iam.'
      security:
      - OAuth2:
        - customermanagement.legalentity_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/legalEntityUpdate'
            examples:
              Update the legal entity:
                value:
                  name: ABC Subsidiary
                  type: SUBSIDIARY
                  parentId: 627e06ecf0452c2d6c0b81391
                  accountLimit:
                    currency: EUR
                    value: 1000.99
                  legalInfo:
                    legalName: ABC Subsidiary
                    registrationDate: '2022-03-31T13:18:02.379Z'
                    registrationAgency: Sub reg agency
                    registrationId: 627e06ecf0452c2d6c0b81391
                    countryOfRegistration: DE
                    taxRegistrationNumber: '4311'
                  customerGroups:
                  - id: 123e06ecf0452c2d6c0b81390
                  - id: 123e06ecf0452c2d6c0b12345
                  entitiesAddresses:
                  - id: 123e123455452c2d6c0b81390
                  - id: 123e06ecf0acd223140b12345
                  approvalGroup:
                  - id: 123e121111452c12330b81390
                  - id: 123e061110acd223133333345
                  restrictions:
                  - US
                  metadata:
                    version: 1
      responses:
        '201':
          description: The request was successful. The legal entity has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              examples:
                Legal entity created:
                  value:
                    id: 53ac81fd0cce8b26b36f3492
        '204':
          description: The legal entity has been updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest_400_Update'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: PUT-customer-mgmt-update-legal-entity
      tags:
      - Legal Entities
    delete:
      summary: Delete a legal entity
      description: 'Deletes a legal entity.


        **Important**: This operation causes removal of all other entities exclusively subordinated to the requested legal entity in an async way.'
      security:
      - OAuth2:
        - customermanagement.legalentity_manage
      responses:
        '204':
          description: The legal entity has been deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest_400_Update'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: DELETE-customer-mgmt-remove-legal-entity
      tags:
      - Legal Entities
    servers:
    - url: https://api.emporix.io
  /customer-management/{tenant}/legal-entities/{legalEntityId}/parent-hierarchy:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    - $ref: '#/components/parameters/trait_legalEntity_id_path'
    get:
      summary: Retrieving a legal entity with parent hierarchy
      description: Retrieves the provided legal entity and all its parent legal entities.
      security:
      - OAuth2:
        - customermanagement.legalentity_read
        - customermanagement.legalentity_manage
      responses:
        '200':
          $ref: '#/components/responses/GetParentHierarchy'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: GET-customer-mgmt-retrieve-legal-entity-parent-hierarchy
      tags:
      - Legal Entities
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    trait_legalEntity_id_path:
      name: legalEntityId
      in: path
      required: true
      schema:
        type: string
      description: The legal entity unique identifier.
    trait_fields:
      in: query
      name: fields
      required: false
      description: Comma-separated list of fields to return in the response. If not specified, all fields are returned.
      schema:
        type: string
        example: name,type
    trait_paged_pageNumber:
      name: pageNumber
      in: query
      description: 'The page number to be retrieved where the size of the pages must be specified by the pageSize parameter.

        The number of the first page is 1.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    trait_legalEntity_countryOfRegistration_query_param:
      name: legalInfo.countryOfRegistration
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity registration country. When specified, only legal entities containing the specified registration country will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_legalEntity_parentId_query_param:
      name: parentId
      in: query
      required: false
      schema:
        type: string
      description: 'The id of the parent legal entity. When specified, only legal entities with the specified parent will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_XTotalCount_header:
      in: header
      name: X-Total-Count
      required: false
      description: In order to get information how many entities meet a filter requirements, X-Total-Count header has been introduced. The header is optional and its default value is false. It the header is provided and it is true then total count is returned in the X-Total-Count response header. In both cases (X-Total-Count true, false or not provided), the response body has the same format (array of entities). In other words, the information about total count is returned on demand, depending of an existence of X-Total-Count header in a request. Therefore, the X-Total-Count header is not returned if an API consumer didn't ask for it.
      schema:
        default: false
        type: boolean
    trait_legalEntity_registrationAgency_query_param:
      name: legalInfo.registrationAgency
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity registration agency. When specified, only legal entities containing the specified registration agency will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_legalEntity_id_query_param:
      name: id
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity id. When specified, only legal entity with the specified id will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used. The operator is case-insensitive.

        '
    trait_q_param:
      in: query
      name: q
      required: false
      description: "Query param for filtering entities by specified type. Examples of query params which are supported:\n\n| Q Param                                                                            | Description                                                                                                                          |\n|------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|\n| `name:\"Exact match\"`                                                               | find an entity with `name` field with `Exact match` value                                                                            |\n| `name:~John`                                                                       | find an entity with `name` field containing `John` value                                                                             |\n| `locDescription.fr:\"Description traduction française 02\"`                          | find an entity with localized `locDescription` field with `Description traduction française 02` value in french language             |      \n| `primary:true`                                                                     | find an entity with `primary` field with `true` value                                                                                |\n| `metadata.createdAt:(>\"2019-01-06T10:29:30.602Z\" AND <\"2020-01-07T10:29:30.602Z\")` | find an entity with `metadata.createdAt` field with value between `2019-01-06T10:29:30.602Z` and `2020-01-07T10:29:30.602Z`          |\n| `name:exists`                                                                      | find an entity with existing `name` field                                                                                            |\n| `name:null`                                                                        | find an entity with non-existing `name` field                                                                                        |\n| `name:missing`                                                                     | find an entity with non-existing `name` field                                                                                        |\n| `name:\"John\" surname:~Smith`                                                       | find an entity with `name` exactly equals to `John` and surname containing `Smith` value                                             |\n| `name:(\"John\",\"Jack\",\"James\")`                                                     | find an entity with `name` field with one of the following value: `John` or `Jack` or `James`                                        |\n"
      schema:
        type: string
        example: name:~john
    trait_paged_pageSize:
      name: pageSize
      in: query
      description: 'The number of documents being retrieved on the page.

        '
      schema:
        default: 16
        minimum: 1
        type: integer
    trait_legalEntity_taxRegistrationNumber_query_param:
      name: legalInfo.taxRegistrationNumber
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity tax registration number. When specified, only legal entities with the specified tax registration number will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_legalEntity_name_query_param:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity name. When specified, only legal entities containing the specified name will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_sort:
      in: query
      name: sort
      required: false
      description: Fields to sort the response data by following order of the parameters from left to right. Can contain multiple fields in format: field name:sort direction separated by a comma. The colon with sort direction parameter is redundant and descending order is taken only if it is equal to desc or DESC. Ascending order is considered in any other case.
      schema:
        type: string
        example: name,metadata.createdAt:desc
    trait_legalEntity_type_query_param:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - COMPANY
        - SUBSIDIARY
      description: 'Legal entity type. When specified, only legal entities with the specified type will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_tenant:
      name: tenant
      in: path
      required: true
      description: 'The tenant that the caller is acting upon.


        Please note that this value is always lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    trait_legalEntity_registrationId_query_param:
      name: legalInfo.registrationId
      in: query
      required: false
      schema:
        type: string
      description: 'The id of the legal entity registration. When specified, only legal entities with the specified registration ID will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_legalEntity_registrationDate_query_param:
      name: legalInfo.registrationDate
      in: query
      required: false
      schema:
        type: string
      description: 'Legal entity registration date. When specified, only legal entities registered in the specified date will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_legalEntity_legalName_query_param:
      name: legalInfo.legalName
      in: query
      required: false
      schema:
        type: string
      description: 'The legal name of the entity. When specified, only legal entities containing the specified name will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
  schemas:
    legalEntityCreate:
      title: Legal Entity create payload
      type: object
      properties:
        id:
          type: string
          description: Custom legal entity identifier. If not provided, it is automatically generated.
          minLength: 1
          maxLength: 66
          pattern: ^[a-zA-Z0-9_-]$
        name:
          type: string
          description: The name of the legal entity.
        type:
          type: string
          enum:
          - COMPANY
          - SUBSIDIARY
          description: 'The type of the legal entity. Default value if not provided is: `COMPANY`'
        parentId:
          type: string
          description: The id of the parent legal entity.
        accountLimit:
          $ref: '#/components/schemas/accountLimit'
        legalInfo:
          $ref: '#/components/schemas/legalInfo'
        customerGroups:
          type: array
          description: The list of customer group IDs assigned to the legal entity.
          items:
            $ref: '#/components/schemas/customerGroup'
        entitiesAddresses:
          type: array
          description: The list of location IDs assigned to the legal entity.
          items:
            $ref: '#/components/schemas/resourceId'
        approvalGroup:
          type: array
          description: The list of customer assignment IDs of an approval group of the legal entity.
          items:
            $ref: '#/components/schemas/resourceId'
        restrictions:
          $ref: '#/components/schemas/restrictions'
        metadata:
          $ref: '#/components/schemas/metadata_create'
        mixins:
          type: object
          description: Mixins request. A map where a key represent mixins set name and a value represent a map with key-value pairs.
          additionalProperties: true
      required:
      - name
    metadataUpdate:
      type: object
      properties:
        version:
          minimum: 1
          type: integer
          description: Version of the document.
        mixins:
          type: object
          description: Links to the mixin schemas. A map where the keys represent mixins set attributes and the values represent url to a schema for a particular set.
          additionalProperties: true
    legalEntityUpdate:
      title: Legal Entity update payload
      type: object
      properties:
        name:
          type: string
          description: The name of the legal entity.
        type:
          type: string
          enum:
          - COMPANY
          - SUBSIDIARY
          description: The type of the legal entity.
        parentId:
          type: string
          description: The id of the parent legal entity.
        accountLimit:
          $ref: '#/components/schemas/accountLimit'
        legalInfo:
          $ref: '#/components/schemas/legalInfo'
        customerGroups:
          type: array
          description: The list of customer group IDs assigned to the legal entity.
          items:
            $ref: '#/components/schemas/resourceId'
        entitiesAddresses:
          type: array
          description: The list of location IDs assigned to the legal entity.
          items:
            $ref: '#/components/schemas/resourceId'
        approvalGroup:
          type: array
          description: The list of customer assignment IDs of an approval user group of the legal entity.
          items:
            $ref: '#/components/schemas/resourceId'
        restrictions:
          $ref: '#/components/schemas/restrictions'
        metadata:
          $ref: '#/components/schemas/metadataUpdate'
        mixins:
          type: object
          description: Mixins request. A map where a key represent mixins set name and a value represent a map with key-value pairs.
          additionalProperties: true
      required:
      - name
      - type
    resourceId:
      title: Resource
      type: object
      properties:
        id:
          type: string
          description: Id of a resource.
    metadata:
      type: object
      allOf:
      - $ref: '#/components/schemas/metadataUpdate'
      - type: object
        properties:
          createdAt:
            description: Date and time when the document was created.
            type: string
          modifiedAt:
            description: Date and time when the document was last modified.
            type: string
    restrictions:
      title: Restriction
      type:
      - array
      - 'null'
      maximum: 1
      description: List of restrictions which determine who can view or manage the Legal Entity.
      items:
        type: string
        description: "Access control identifier that determines who can view or manage the Legal Entity.\n\n**Purpose**: Restricts Legal Entity visibility based on scope permissions. Only users/applications \nwith matching restrictions scopes can access Legal Entities with a specific restrictions value.\n\n**Access Control**:\n- *Reading*: Users can only query and view Legal Entities whose `restrictions` value matches one of their authorized restrictions.\n\n**Validation**: The value must exist in the tenant's configured list of valid restrictions.\n"
        example: DE
    customer:
      title: Customer
      properties:
        id:
          type: string
