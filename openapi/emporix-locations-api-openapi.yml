openapi: 3.2.0
info:
  title: Emporix Locations API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Locations across 6 of this provider''s published API definitions: emporix-availability-openapi.yml, emporix-client-management-openapi.yml, emporix-vendor-service-openapi.yml, emporix-availability-openapi.yml, emporix-client-management-openapi.yml, emporix-vendor-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Locations
paths:
  /availability/{tenant}/locations/{site}:
    parameters:
    - $ref: '#/components/parameters/tenant-path'
    - $ref: '#/components/parameters/site-path'
    get:
      tags:
      - Locations
      deprecated: true
      summary: Retrieving all locations for a site
      description: Retrieves all locations for a specified site.
      security:
      - OAuth2:
        - availability.availability_view
      responses:
        '200':
          description: The request was successful. A list of locations is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
              examples:
                Response example:
                  $ref: '#/components/examples/LocationList'
        '400':
          $ref: '#/components/responses/BadRequestResponse400'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse401'
        '403':
          $ref: '#/components/responses/ForbiddenResponse403'
        '404':
          $ref: '#/components/responses/NotFoundResponse404'
        '500':
          $ref: '#/components/responses/ServerErrorResponse500'
      operationId: GET-availability-retrieve-locations-site
    post:
      tags:
      - Locations
      deprecated: true
      summary: Adding a new location to a site
      description: Adds a new location to a specified site.
      security:
      - OAuth2:
        - availability.availability_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
            examples:
              Request example:
                $ref: '#/components/examples/Location'
      responses:
        '201':
          description: ' The request was successful. The location has been added to the site.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: 'Successfully created location with id: shop1:1234'
                code: 201
        '400':
          $ref: '#/components/responses/BadRequestResponse400'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse401'
        '403':
          $ref: '#/components/responses/ForbiddenResponse403'
        '409':
          $ref: '#/components/responses/ConflictResponse409'
        '500':
          $ref: '#/components/responses/ServerErrorResponse500'
      operationId: POST-availability-add-locations-site
    put:
      tags:
      - Locations
      deprecated: true
      summary: Updating locations
      description: Updates locations for a specified site.
      security:
      - OAuth2:
        - availability.availability_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationOrderList'
            examples:
              Request example:
                $ref: '#/components/examples/LocationOrderList'
      responses:
        '200':
          description: ' The request was successful. The locations have been updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Successfully modified 5 location(s)
                code: 200
        '400':
          $ref: '#/components/responses/BadRequestResponse400'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse401'
        '403':
          $ref: '#/components/responses/ForbiddenResponse403'
        '500':
          $ref: '#/components/responses/ServerErrorResponse500'
      operationId: PUT-availability-update-locations-site
    servers:
    - url: https://api.emporix.io
  /availability/{tenant}/locations/{location}:
    description: Availability service
    parameters:
    - $ref: '#/components/parameters/tenant-path'
    delete:
      tags:
      - Locations
      deprecated: true
      summary: Deleting a location
      description: Deletes a specified location.
      security:
      - OAuth2:
        - availability.availability_manage
      parameters:
      - $ref: '#/components/parameters/tenant-path'
      - $ref: '#/components/parameters/location-path'
      responses:
        '200':
          description: ' The request was successful. The location has been deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Successfully deleted 5 location(s)
                code: 200
        '401':
          $ref: '#/components/responses/UnauthorizedResponse401'
        '403':
          $ref: '#/components/responses/ForbiddenResponse403'
        '500':
          $ref: '#/components/responses/ServerErrorResponse500'
      operationId: DELETE-availability-remove-location
    servers:
    - url: https://api.emporix.io
  /availability/{tenant}/search/locations:
    description: Availability service
    parameters:
    - $ref: '#/components/parameters/tenant-path'
    post:
      deprecated: true
      summary: Retrieving product locations
      description: Retrieves locations of specified products.
      security:
      - OAuth2:
        - availability.availability_view
      parameters:
      - $ref: '#/components/parameters/tenant-path'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSearch'
            examples:
              Request example:
                $ref: '#/components/examples/LocationSearch'
      responses:
        '200':
          description: The request was successful. A list of locations is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLocationList'
              examples:
                Response example:
                  $ref: '#/components/examples/ProductLocationList'
        '400':
          $ref: '#/components/responses/BadRequestResponse400'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse401'
        '403':
          $ref: '#/components/responses/ForbiddenResponse403'
        '404':
          $ref: '#/components/responses/NotFoundResponse404'
        '500':
          $ref: '#/components/responses/ServerErrorResponse500'
      operationId: POST-availability-search-locations
      tags:
      - Locations
    servers:
    - url: https://api.emporix.io
  /customer-management/{tenant}/locations:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    post:
      summary: Creating location
      description: Creates a new location for the tenant. A location represents address information about a legal entity of the Company.
      security:
      - OAuth2:
        - customermanagement.location_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locationCreate'
            examples:
              Create a location:
                value:
                  name: Main HQ
                  type: HEADQUARTER
                  contactDetails:
                    emails:
                    - jon.doe@example.com
                    - adam.smith@sample.org
                    phones:
                    - '1234567890'
                    - '123456789'
                    addressLine1: W Sample St
                    addressLine2: 3601-3799
                    city: South Bend
                    state: Indiana
                    postcode: '46619'
                    countryCode: US
                    tags:
                    - shipping
      responses:
        '201':
          description: The request was successful. The location has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              examples:
                Location created:
                  value:
                    id: 53ac81fd0cce8b26b36f1234
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: POST-customer-mgmt-create-location
      tags:
      - Locations
    get:
      summary: Retrieving all locations
      description: Retrieves all locations assigned to the tenant. You can filter, sort and paginate the results with query parameters.
      security:
      - OAuth2:
        - customermanagement.location_read
      parameters:
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_XTotalCount_header'
      - $ref: '#/components/parameters/trait_sort'
      - $ref: '#/components/parameters/trait_q_param'
      - $ref: '#/components/parameters/trait_fields'
      - $ref: '#/components/parameters/trait_location_name_query_param'
      - $ref: '#/components/parameters/trait_location_type_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_email_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_phone_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_address_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_city_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_state_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_postcode_query_param'
      - $ref: '#/components/parameters/trait_location_contactDetails_countryCode_query_param'
      responses:
        '200':
          $ref: '#/components/responses/GetLocations'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: GET-customer-mgmt-list-all-locations
      tags:
      - Locations
    servers:
    - url: https://api.emporix.io
  /customer-management/{tenant}/locations/{locationId}:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    - $ref: '#/components/parameters/trait_location_id_path'
    get:
      parameters:
      - $ref: '#/components/parameters/trait_fields'
      summary: Retrieving a location
      description: Retrieves a location by the specified unique identifier.
      security:
      - OAuth2:
        - customermanagement.location_read
      responses:
        '200':
          $ref: '#/components/responses/GetLocation'
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: GET-customer-mgmt-retrieve-location
      tags:
      - Locations
    put:
      summary: Upserting a location
      description: Updates or creates a location with given location id. You can omit the `metadata.version`, but then optimistic locking is not enabled.
      security:
      - OAuth2:
        - customermanagement.location_manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/locationUpdate'
            examples:
              Update the location:
                value:
                  name: Main Warehouse
                  type: WAREHOUSE
                  contactDetails:
                    emails:
                    - jon.doe@example.com
                    - adam.smith@sample.org
                    phones:
                    - '1234567890'
                    - '123456789'
                    addressLine1: W Sample St
                    addressLine2: 3601-3799
                    city: South Bend
                    state: Indiana
                    postcode: '46619'
                    countryCode: US
                    tags:
                    - shipping
                  metadata:
                    version: 1
      responses:
        '201':
          description: The request was successful. The location has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              examples:
                Location created:
                  value:
                    id: 53ac81fd0cce8b26b36f3492
        '204':
          description: The location has been updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest_400_Update'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: PUT-customer-mgmt-update-location
      tags:
      - Locations
    delete:
      summary: Delete a location
      description: Deletes a location.
      security:
      - OAuth2:
        - customermanagement.location_manage
      responses:
        '204':
          description: The location has been deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
      operationId: DELETE-customer-mgmt-remove-location
      tags:
      - Locations
    servers:
    - url: https://api.emporix.io
  /vendor/{tenant}/locations:
    parameters:
    - $ref: '#/components/parameters/trait_tenant'
    post:
      summary: Creating a location
      description: Creates a new location for the tenant. A location represents address information for a vendor.
      security:
      - OAuth2:
        - vendor.vendor_manage
      requestBody:
        content:
          application/json:
