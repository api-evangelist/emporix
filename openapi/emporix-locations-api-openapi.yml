                  contactDetails:
                    emails:
                    - jon.doe@example.com
                    - adam.smith@sample.org
                    phones:
                    - '1234567890'
                    - '123456789'
                    addressLine1: W Sample St
                    addressLine2: 3601-3799
                    city: South Bend
                    state: Indiana
                    postcode: '46619'
                    countryCode: US
                    tags:
                    - shipping
      responses:
        '201':
          description: The request was successful. The location has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              examples:
                Location created:
                  value:
                    id: 53ac81fd0cce8b26b36f1234
        '400':
          $ref: '#/components/responses/BadRequest_400_2'
        '401':
          $ref: '#/components/responses/Unauthorized_401_2'
        '403':
          $ref: '#/components/responses/Forbidden_403_2'
        '409':
          $ref: '#/components/responses/Conflict_409_2'
        '500':
          $ref: '#/components/responses/InternalServiceError_500_2'
      operationId: POST-vendor-mgmt-create-location
      tags:
      - Locations
    get:
      summary: Retrieving all locations
      description: Retrieves all locations assigned to the tenant. You can filter, sort and paginate the results with query parameters.
      security:
      - OAuth2:
        - vendor.vendor_read
        - vendor.vendor_manage
      parameters:
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_XTotalCount_header_2'
      - $ref: '#/components/parameters/trait_sort_2'
      - $ref: '#/components/parameters/trait_q_param_2'
      - $ref: '#/components/parameters/trait_fields'
      - $ref: '#/components/parameters/trait_location_name_query_param_2'
      - $ref: '#/components/parameters/trait_location_type_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_email_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_phone_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_address_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_city_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_state_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_postcode_query_param_2'
      - $ref: '#/components/parameters/trait_location_contactDetails_countryCode_query_param_2'
      responses:
        '200':
          $ref: '#/components/responses/GetLocations_2'
        '400':
          $ref: '#/components/responses/BadRequest_400_2'
        '401':
          $ref: '#/components/responses/Unauthorized_401_2'
        '403':
          $ref: '#/components/responses/Forbidden_403_2'
        '500':
          $ref: '#/components/responses/InternalServiceError_500_2'
      operationId: GET-vendor-mgmt-list-all-locations
      tags:
      - Locations
    servers:
    - url: https://api.emporix.io
