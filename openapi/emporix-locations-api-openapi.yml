components:
  parameters:
    tenant-path:
      in: path
      name: tenant
      required: true
      description: 'Your Emporix tenant name.


        **Note**: The tenant name should always be provided in lowercase.

        '
      schema:
        type: string
        example: testtenant
    site-path:
      in: path
      name: site
      required: true
      description: Site code, defined when the site is created.
      schema:
        type: string
        example: shop1
    location-path:
      in: path
      name: location
      required: true
      description: Location unique identifier.
      schema:
        type: string
        example: shop1:1234
    trait_fields:
      in: query
      name: fields
      required: false
      description: Comma-separated list of fields to return in the response. If not specified, all fields are returned.
      schema:
        type: string
        example: name,type
    trait_paged_pageNumber:
      name: pageNumber
      in: query
      description: 'The page number to be retrieved where the size of the pages must be specified by the pageSize parameter.

        The number of the first page is 1.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    trait_location_name_query_param:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: 'Location name. When specified, only locations containing the specified name will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_location_contactDetails_email_query_param:
      name: contactDetails.email
      in: query
      required: false
      schema:
        type: string
      description: 'The email of the contact details of the location. When specified, only locations with contact details containing the specified email will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_location_contactDetails_city_query_param:
      name: contactDetails.city
      in: query
      required: false
      schema:
        type: string
      description: 'The address of the contact details of the location. When specified, only locations with contact details containing the specified city will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_location_contactDetails_postcode_query_param:
      name: contactDetails.postcode
      in: query
      required: false
      schema:
        type: string
      description: 'The postcode of the contact details of the location. When specified, only locations with contact details containing the specified postcode will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_location_contactDetails_state_query_param:
      name: contactDetails.state
      in: query
      required: false
      schema:
        type: string
      description: 'The address of the contact details of the location. When specified, only locations with contact details containing the specified state will be returned.


        **Note**: When filtering the results with this field, the `contains` operator is used. The operator is case-insensitive.

        '
    trait_XTotalCount_header:
      in: header
      name: X-Total-Count
      required: false
      description: In order to get information how many entities meet a filter requirements, X-Total-Count header has been introduced. The header is optional and its default value is false. It the header is provided and it is true then total count is returned in the X-Total-Count response header. In both cases (X-Total-Count true, false or not provided), the response body has the same format (array of entities). In other words, the information about total count is returned on demand, depending of an existence of X-Total-Count header in a request. Therefore, the X-Total-Count header is not returned if an API consumer didn't ask for it.
      schema:
        default: false
        type: boolean
    trait_location_id_path:
      name: locationId
      in: path
      required: true
      schema:
        type: string
      description: The location unique identifier.
    trait_location_type_query_param:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum:
        - HEADQUARTER
        - WAREHOUSE
        - OFFICE
      description: 'The type of the location. When specified, only locations of the specified type will be returned.


        **Note**: When filtering the results with this field, the `equals` operator is used.

        '
    trait_q_param:
      in: query
      name: q
      required: false
