openapi: 3.2.0
info:
  title: Emporix Search API
  version: ''
  description: 'Operations tagged Search across 4 of this provider''s published API definitions: emporix-approval-service-openapi.yml, emporix-search-service-openapi.yml, emporix-approval-service-openapi.yml, emporix-search-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Search
paths:
  /approval/{tenant}/search/users:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    post:
      summary: Search for the users eligible to act as approvers
      responses:
        '200':
          $ref: '#/components/responses/ApprovalSearchUsersResponse_200'
        '400':
          $ref: '#/components/responses/approvals_response_BadRequest_400'
        '401':
          $ref: '#/components/responses/common_response_Unauthorized_401'
        '403':
          $ref: '#/components/responses/common_response_Forbidden_403'
      description: 'Searches for the users who can be assigned to the approvals. The user must be a *Requestor* or an *Approver* to have the required `approval.approval_read_own` scope.


        In case of any validation problem, the below `errorCodes` can be returned:

        - **APPROVAL-400008**: Requested user has no permissions to the resource.

        - **APPROVAL-400011**: Requested user is not assigned to any company.

        - **APPROVAL-404002**: Provided resource does not exist.

        - **APPROVAL-404003**: Requested user is not assigned to any legal entity.'
      operationId: POST-approval-search-users
      requestBody:
        $ref: '#/components/requestBodies/approvalSearchUsersRequestBody'
      parameters:
      - $ref: '#/components/parameters/path_tenant'
      security:
      - CustomerAccessToken: []
      tags:
      - Search
    servers:
    - url: https://api.emporix.io
  /search/{tenant}/search/{type}:
    parameters:
    - $ref: '#/components/parameters/path_tenant_2'
    - $ref: '#/components/parameters/path_type'
    post:
      summary: Searching documents
      operationId: POST-search-tenant-type
      tags:
      - Search
      description: '!Preview


        {% hint style="danger" %}

        This functionality is in preview mode - some of the features may not be fully operational yet.

        {% endhint %}


        Searches documents of one type. The `search.search_read` scope is required.


        For a direct search, the body names an index and supplies queries, a filter, or both. A list of queries matches when any query matches. An `and` group matches when every query matches. An `or` group matches when any query matches. Filters narrow the matches. The response is a JSON array of matching documents. When `fields` is omitted, each document also includes `_score`.


        When the body contains `searchQueryId`, the request runs a saved search. `query` is required. The saved search supplies the index, the filters, and the query shape. `query` replaces the text of every search term. A saved search that contains only filters keeps those filters.


        When the `X-Total-Count` request header is `true`, the response includes the `X-Total-Count` header with the number of matching documents. The response body stays an array.


        Filter and sort fields must be indexed. For a direct search, that is the index named by `index`. For a saved search, that is the index stored on the saved search.


        **Additional permissions requirements**:


        | Type | Scope requirements |

        | --- | --- |

        | `Custom Schema Type` | `schema.custominstance_read`, `custom.{type}_read`, or `custom.{type}_read_own` |


        A caller without one of those scopes receives `403 Forbidden`.'
      security:
      - OAuth2:
        - search.search_read
      parameters:
      - $ref: '#/components/parameters/query_pageNumber'
      - $ref: '#/components/parameters/query_pageSize'
      - $ref: '#/components/parameters/query_sort'
      - $ref: '#/components/parameters/query_fields'
      - $ref: '#/components/parameters/header_Accept-Language'
      - $ref: '#/components/parameters/header_X-Total-Count'
      requestBody:
        $ref: '#/components/requestBodies/search_POST'
      responses:
        '200':
          description: The search succeeded. The body is the current page of matching documents.
          headers:
            X-Total-Count:
              description: Number of matching documents. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
              examples:
                Text search:
                  $ref: '#/components/examples/searchHits'
        '400':
          description: The request is invalid, or a filter or sort field is not indexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Index is required:
                  value:
                    code: 400
                    status: '400'
                    message: Index is required.
                Queries or filters are required:
                  value:
                    code: 400
                    status: '400'
                    message: Queries or filters are required.
                Type is not a custom entity:
                  value:
                    code: 400
                    status: '400'
                    message: Type is not a custom entity.
                Query is required:
                  value:
                    code: 400
                    status: '400'
                    message: Query is required.
                Search query id is required:
                  value:
                    code: 400
                    status: '400'
                    message: Search query id is required.
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          description: The access token does not include the required `search.search_read` scope, or a scope required to read the documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Missing search scope:
                  value:
                    code: 403
                    status: '403'
                    message: User not authorized.
                    details:
                    - message: Missing one of required scopes '[search.search_read]'
                Missing custom entity scope:
                  value:
                    code: 403
                    status: '403'
                    message: Missing one of required scopes '[schema.custominstance_read, custom.vehicle_read, custom.vehicle_read_own]'.
        '500':
          $ref: '#/components/responses/500_resp_common'
        '502':
          description: The Schema Service could not confirm that the type is a custom entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Schema service unavailable:
                  value:
                    code: 502
                    status: '502'
                    message: Error while fetching custom entity='VEHICLE' for tenant='acme'. Error=Connection refused
        '404':
          description: No saved search with this id exists for the tenant and type. Returned when the body contains `searchQueryId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Saved search not found:
                  value:
                    code: 404
                    status: '404'
                    message: The search query with id='red-cars' has not been found on tenant='acme'.
    servers:
    - url: https://api.emporix.io
components:
  responses:
    approvals_response_BadRequest_400:
      description: Bad request due to validation, incorrect parameters, etc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/coreErrorMessage'
          examples:
            Bad request:
              value:
                code: 400
                status: Bad Request
                message: Problem with validation
                details:
                - message: 'resourceType: cannot be null'
                errorCode: APPROVAL-400001
    common_response_Unauthorized_401:
      description: Unauthorized.
      content:
        application/json:
          schema:
            type: object
            properties:
              fault:
                type: object
                properties:
                  faultstring:
                    type: string
                  detail:
                    type: object
                    properties:
                      errorcode:
                        type: string
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
    common_response_Forbidden_403:
      description: Access forbidden. The caller is not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/coreErrorMessage'
          examples:
            Forbidden:
              value:
                code: 403
                status: Forbidden
                message: The access to the requested resource has been forbidden by the server.
    ApprovalSearchUsersResponse_200:
      description: Approval permitted response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/approvalSearchUsersResponse'
          examples:
            List of approval users:
              value:
              - userId: aaa2f2b6-7dc8-45ff-9f20-4e6163c14ceb
                firstName: John
                lastName: Doe
    500_resp_common:
      description: A server-side error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Internal Server Error:
              value:
                code: 500
                status: '500'
                message: The server has encountered an error during processing the request data while trying to connect to the database.
    401_resp_common:
      description: The authorization token is invalid or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessageFault'
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
  requestBodies:
    approvalSearchUsersRequestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/searchUsersRequest'
          examples:
            Search for approval users (cart):
              value:
                resourceId: cartId
                resourceType: CART
                action: CHECKOUT
            Search for approval users (quote):
              value:
                resourceId: quoteId
                resourceType: QUOTE
                action: CHECKOUT
    search_POST:
      required: true
      content:
        application/json:
          schema:
            description: A direct search or a saved search. When `searchQueryId` is present, the service runs the saved search and ignores the other properties.
            anyOf:
            - $ref: '#/components/schemas/SearchRequest'
            - $ref: '#/components/schemas/SavedSearchCall'
          examples:
            Text search:
              $ref: '#/components/examples/textSearchRequest'
            Fuzzy search:
              $ref: '#/components/examples/fuzzySearchRequest'
            Fuzzy search with two edits:
              $ref: '#/components/examples/fuzzyTwoEditsRequest'
            Phrase search:
              $ref: '#/components/examples/phraseSearchRequest'
            Autocomplete search:
              $ref: '#/components/examples/autocompleteSearchRequest'
            Wildcard search:
              $ref: '#/components/examples/wildcardSearchRequest'
            Boosted fields:
              $ref: '#/components/examples/boostedFieldsRequest'
            Several queries:
              $ref: '#/components/examples/severalQueriesRequest'
            And queries:
              $ref: '#/components/examples/andQueriesRequest'
            Filter only:
              $ref: '#/components/examples/filterSearchRequest'
            Contains filter:
              $ref: '#/components/examples/containsFilterRequest'
            Range filter:
              $ref: '#/components/examples/rangeFilterRequest'
            List filter:
              $ref: '#/components/examples/inFilterRequest'
            Exists filter:
              $ref: '#/components/examples/existsFilterRequest'
            Nested filters:
              $ref: '#/components/examples/nestedFilterRequest'
            Saved search:
              $ref: '#/components/examples/savedSearchCall'
  parameters:
    path_tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.

        **Note**: The tenant name should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    header_X-Total-Count:
      name: X-Total-Count
      in: header
      required: false
      description: Flag indicating whether the total count of retrieved items should be returned.
      schema:
        default: false
        type: boolean
    header_Accept-Language:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 'List of language codes acceptable for the response.


        * If the header is set to a language or a list of languages, the service returns the first requested language that has a translation. Localized fields are maps with that language code as the key.

        * If the header is set to `*`, localized fields are retrieved as maps of translations, where the keys are language codes and values are the fields in their respective languages.

        * If the header is empty, localized fields are retrieved as maps containing a single translation, where the key is a language code and the value is the field in the specified language. The endpoint assumes that localized fields are to be retrieved in the tenant''s default language defined in the Configuration Service.

        * If none of the requested languages has a translation, the localized fields are omitted from the response.

        '
    path_tenant_2:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant''s name.

        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    query_sort:
      name: sort
      in: query
      description: 'List of properties used to sort the results, separated by commas. The order of properties indicates their priority in sorting.


        Possible values:


        * `{fieldName}`

        * `{fieldName}:ASC`

        * `{fieldName}:DESC`


        When the direction is omitted, the field is sorted in ascending order.


        For the localized `name` field, the language can be included as `name.{language}`. When the language is omitted, the service uses the language from `Accept-Language`.


        When `sort` is omitted, results are ordered by search relevance.'
      schema:
        type: string
        example: name:ASC,id:DESC
    path_type:
      name: type
      in: path
      required: true
      description: 'Type of documents to search.


        For now, only custom schema types are supported.

        '
      schema:
        type: string
        example: VEHICLE
    query_pageNumber:
      name: pageNumber
      in: query
      description: 'Page number to be retrieved. The number of the first page is 1.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    query_fields:
      name: fields
      in: query
      description: 'Comma-separated list of fields to return. When the parameter is omitted, the stored document is returned.


        `id` selects the document identifier. `_score` selects the relevance score.'
      schema:
        type: string
        example: id,name,_score
    query_pageSize:
      name: pageSize
      in: query
      description: Number of items to be retrieved per page.
      schema:
        default: 60
        minimum: 1
        maximum: 2000
        type: integer
    path_tenant_3:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant''s name.

        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
  schemas:
    resourceType:
      title: A type of a resource
      description: "Type of resource under approval.  \n"
      type: string
      enum:
      - CART
      - QUOTE
    user:
      title: user schema
      type: object
      properties:
        userId:
          type: string
          description: An identifier of the user.
        firstName:
          type: string
          description: First name of the user.
        lastName:
          type: string
          description: Last name of the user.
      required:
      - userId
      - firstName
      - lastName
    approvalAction:
      title: An approval action
      description: Base schema for an approval action type.
      type: string
      enum:
      - CHECKOUT
    approvalSearchUsersResponse:
      title: Search approval users response
      description: Base schema search approval users response.
      type: array
      items:
        $ref: '#/components/schemas/user'
    searchUsersRequest:
      title: Search approver users request
      type: object
      properties:
        resourceType:
          $ref: '#/components/schemas/resourceType'
        resourceId:
          type: string
          description: An identifier of the resource for approval.
        action:
          $ref: '#/components/schemas/approvalAction'
      required:
      - resourceType
      - resourceId
      - action
    coreErrorMessage:
      type: object
      properties:
        code:
          type: integer
          description: HTTP Status Code.
        status:
          type: string
          description: HTTP Status.
        message:
          type: string
          description: Error message.
        errorCode:
          type: string
          description: code of the error.
        details:
          description: Details information.
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              type:
                type: string
              message:
                type: string
              moreInfo:
                type: string
    ErrorMessage:
      type: object
      description: Error returned for a failed request.
      properties:
        code:
          type: integer
          description: HTTP status code.
        status:
          type: string
          description: HTTP status code as text.
        message:
          type: string
          description: Explanation of the failure.
        details:
          type: array
          description: Field-level or scope-level messages, when the failure has more than one part.
          items:
            type: object
            properties:
              message:
                type: string
                description: One part of the failure.
    SearchRequest:
      type: object
      description: 'Search criteria. Provide `queries`, `filters`, or both. `index` is always required. Unknown properties are ignored. Use `SavedSearchCall` instead when the body contains `searchQueryId`.


        A list of queries matches when any query matches. An `and` group matches when every query matches. An `or` group matches when any query matches. Filters narrow those matches and do not change the score.'
      properties:
        queries:
          description: 'Queries to match. Use an array as shorthand for an `or` group, or an `and` group, an `or` group, or one query.


            `name` is localized. The search uses the field path as sent. It does not expand `name` with the `Accept-Language` value.'
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/QueryNode'
          - $ref: '#/components/schemas/QueryNode'
        filters:
          $ref: '#/components/schemas/FilterNode'
        index:
          type: string
          description: Name of the index to query.
          example: custom-entities
      required:
      - index
      anyOf:
      - required:
        - queries
      - required:
        - filters
    SearchType:
      type: string
      description: 'Match mode.


        * `TEXT` matches the query tokens.

        * `PHRASE` matches the query as adjacent words in order.

        * `AUTOCOMPLETE` matches the index field''s autocomplete mode. `PREFIX` matches the start of a word. `NGRAM` matches a character sequence inside a word.

        * `WILDCARD` matches a pattern. `*` matches any number of characters. `?` matches one character. Fuzzy matching is not supported.'
      enum:
      - TEXT
      - PHRASE
      - AUTOCOMPLETE
      - WILDCARD
    Fuzzy:
      type: object
      description: Edit-distance matching. Supported only when `type` is `TEXT` and `enabled` is `true`.
      properties:
        enabled:
          type: boolean
          description: When `true`, matches that are one or two edits from the query are included.
        maxEdits:
          type: integer
          description: Maximum edit distance. Required when `enabled` is `true`. Allowed values are 1 and 2.
          enum:
          - 1
          - 2
    FilterNode:
      type: object
      description: 'One filter node. A node is an `and` group, an `or` group, or a comparison. Do not combine those forms in the same object.


        Comparison fields must be indexed on the index named by `index`.'
      properties:
        and:
          type: array
          minItems: 1
          description: Every child must match. The group must not be empty.
          items:
            $ref: '#/components/schemas/FilterNode'
        or:
          type: array
          minItems: 1
          description: At least one child must match. The group must not be empty.
          items:
            $ref: '#/components/schemas/FilterNode'
        field:
          type: string
          description: Document field to compare. `id` is stored as `_id`.
          example: status
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          description: 'Comparison value. The shape depends on `operator`.


            * `EQ`, `NEQ`, `GT`, `GTE`, `LT`, and `LTE` require one value.

            * `BETWEEN` requires an array of two values. The range is inclusive.

            * `IN` and `NOT_IN` require a non-empty array.

            * `EXISTS` requires a boolean. `true` matches documents where the field is present. `false` matches documents where the field is absent.

            * `CONTAINS` requires a non-blank string. The field must have `text: true` in the index.'
    SearchHit:
      type: object
      description: 'A matching document. Stored fields are returned with their API names. The identifier is `id`.


        The `name` is localized. Other stored fields are returned as they are stored. When `fields` limits the response, the response includes the requested fields and `id`.'
      properties:
        id:
          type: string
          description: Document identifier.
          example: 64f1c2a8e4b0a1d2c3e4f5a6
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name. A specific `Accept-Language` value keeps one language. `*` keeps every stored language.
          example:
            en: Diesel engine
        _score:
          type: number
          description: Search relevance score. Included when `fields` is omitted, or when `fields` lists `_score`.
          example: 4.2
      additionalProperties: true
    ErrorMessageFault:
      type: object
      description: Authorization error returned by the API gateway.
      properties:
        fault:
          type: object
          properties:
            faultstring:
              type: string
              description: Authorization failure.
            detail:
              type: object
              properties:
                errorcode:
                  type: string
                  description: Gateway error code.
    SavedSearchCall:
      type: object
      description: Runs one saved search. Use this shape when `searchQueryId` is present. The saved search supplies the index, the filters, and the query shape. `query` replaces the text of every search term. A saved search that contains only filters keeps those filters.
      properties:
        query:
          type: string
          minLength: 1
          description: Text applied to every search term in the saved search. The value must not be blank.
          example: diesel engine
        searchQueryId:
          type: string
          description: Id of the saved search for this schema type.
          example: red-cars
      required:
      - query
      - searchQueryId
    FilterOperator:
      type: string
      description: 'Comparison applied to `field` and `value`.


        `CONTAINS` performs a case- and diacritic-insensitive substring match. The service wraps the value in `*` and escapes `\`, `*`, and `?` within it. Spaces remain part of the value.'
      enum:
      - EQ
      - NEQ
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
      - IN
      - NOT_IN
      - EXISTS
      - CONTAINS
    QueryNode:
      type: object
      description: One query node. A node is an `and` group, an `or` group, or one query. Do not combine those forms in the same object.
      properties:
        and:
          type: array
          description: Every child must match.
          items:
            $ref: '#/components/schemas/QueryNode'
        or:
          type: array
          description: Any child must match.
          items:
            $ref: '#/components/schemas/QueryNode'
        type:
          $ref: '#/components/schemas/SearchType'
        query:
          type: string
          description: Text or pattern to match.
          example: diesel engine
        field:
          type: string
          description: Document field to match. `id` is stored as `_id`.
          example: name.en
        boost:
          type: number
          default: 1
          description: Score multiplier for matches on this field. The default is 1.
          example: 2
          exclusiveMinimum: 0
        fuzzy:
          $ref: '#/components/schemas/Fuzzy'
  examples:
    wildcardSearchRequest:
      summary: Wildcard search
      value:
        index: custom-entities
        queries:
        - type: WILDCARD
          query: '*iese*'
          field: name.en
    boostedFieldsRequest:
      summary: Text search with field boosts
      value:
        index: custom-entities
        queries:
        - type: TEXT
          query: diesel
          field: name.en
          boost: 5
        - type: TEXT
          query: diesel
          field: brand
          boost: 1
    andQueriesRequest:
      summary: Both queries must match
      value:
        index: custom-entities
        queries:
          and:
          - type: WILDCARD
            query: '*red*'
            field: name.en
          - type: WILDCARD
            query: '*Hybrid*'
            field: brand
    inFilterRequest:
      summary: Match any listed value
      value:
        index: custom-entities
        queries:
        - type: TEXT
          query: engine
          field: name.en
        filters:
          field: status
          operator: IN
          value:
          - ACTIVE
          - DRAFT
    fuzzySearchRequest:
      summary: Text search that allows one edit
      value:
        index: custom-entities
        queries:
        - type: TEXT
          query: diesel
          field: name.en
          fuzzy:
            enabled: true
            maxEdits: 1
    nestedFilterRequest:
      summary: And group that contains an or group
      value:
        index: custom-entities
        queries:
        - type: TEXT
          query: diesel
          field: name.en
        filters:
          and:
          - field: horsepower
            operator: GTE
            value: 150
          - or:
            - field: status
              operator: EQ
              value: ACTIVE
            - field: status
              operator: EQ
              value: DRAFT
    fuzzyTwoEditsRequest:
      summary: Text search that allows two edits
      value:
        index: custom-entities
        queries:
        - type: TEXT
          query: diesel engine
          field: name.en
          boost: 3
          fuzzy:
            enabled: true
            maxEdits: 2
        filters:
          field: status
          operator: NEQ
          value: ARCHIVED
    existsFilterRequest:
      summary: Field must be present
      value:
        index: custom-entities
        filters:
          field: brand
          operator: EXISTS
