openapi: 3.2.0
info:
  title: Emporix Customer Group Relations API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Customer Group Relations across 2 of this provider''s published API definitions: emporix-shipping-openapi.yml, emporix-shipping-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- oAuth2: []
tags:
- name: Customer Group Relations
  description: Manage shipping customer groups
paths:
  /shipping/{tenant}/{site}/cgrelations:
    parameters:
    - $ref: '#/components/parameters/tenant'
    - $ref: '#/components/parameters/site'
    post:
      tags:
      - Customer Group Relations
      summary: Creating a customer-group relation
      operationId: POST-shipping-create-customer-group-relation
      description: Creates a new customer-group relation for the specified site.
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/site'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CGRelation'
            examples:
              cgrelation:
                $ref: '#/components/examples/CGRelation'
      responses:
        '201':
          description: Resource successfully created.
          content:
            application/json:
              examples:
                Group creation response:
                  $ref: '#/components/examples/GroupCreationResponse'
              schema:
                $ref: '#/components/schemas/ResourceCreatedResponse'
        '400':
          $ref: '#/components/responses/yaasAware_400'
        '401':
          $ref: '#/components/responses/unauthorized_401'
        '403':
          $ref: '#/components/responses/yaasAware_403'
        '404':
          $ref: '#/components/responses/notFound_404'
        '409':
          $ref: '#/components/responses/resourceConflict_409'
        '500':
          $ref: '#/components/responses/internalError_500'
      security:
      - oAuth2:
        - shipping.shipping_manage
    get:
      tags:
      - Customer Group Relations
      summary: Retrieving customer-group relations
      operationId: GET-shipping-list-customer-group-relations
      description: Retrieves a list of customer-group relations for the specified site.
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/site'
      responses:
        '200':
          description: Resource successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CGRelationList'
              examples:
                cgrelations:
                  $ref: '#/components/examples/CGRelationList'
        '401':
          $ref: '#/components/responses/unauthorized_401'
        '500':
          $ref: '#/components/responses/internalError_500'
      security:
      - oAuth2: []
    servers:
    - url: https://api.emporix.io
  /shipping/{tenant}/{site}/cgrelations/{customerId}:
    parameters:
    - $ref: '#/components/parameters/tenant'
    - $ref: '#/components/parameters/site'
    - $ref: '#/components/parameters/customerId'
    get:
      tags:
      - Customer Group Relations
      summary: Retrieving a customer's customer-group relations
      operationId: GET-shipping-retrieve-customer-group-relations
      description: Retrieves customer-group relations for the specified customer.
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/site'
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Resource successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CGRelation'
              examples:
                Cgrelation:
                  $ref: '#/components/examples/CGRelation'
        '401':
          $ref: '#/components/responses/unauthorized_401'
        '500':
          $ref: '#/components/responses/internalError_500'
      security:
      - oAuth2: []
    put:
      tags:
      - Customer Group Relations
      summary: Updating a customer's customer-group relations
      operationId: PUT-shipping-update-customer-group-relations
      description: Updates the customer-group relation for the specified customer.
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/site'
      - $ref: '#/components/parameters/customerId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CGRelation'
            examples:
              CGRelation:
                $ref: '#/components/examples/CGRelation'
      responses:
        '200':
          description: Resource successfully updated.
        '401':
          $ref: '#/components/responses/unauthorized_401'
        '403':
          $ref: '#/components/responses/yaasAware_403'
        '409':
          $ref: '#/components/responses/resourceConflict_409'
        '500':
          $ref: '#/components/responses/internalError_500'
      security:
      - oAuth2:
        - shipping.shipping_manage
    delete:
      tags:
      - Customer Group Relations
      summary: Deleting a customer's customer-group relation
      operationId: DELETE-shipping-remove-customer-group-relation
      description: Deletes the customer-group relation for the specified customer.
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/site'
      - $ref: '#/components/parameters/customerId'
      responses:
        '204':
          description: Resource successfully deleted.
        '401':
          $ref: '#/components/responses/unauthorized_401'
        '403':
          $ref: '#/components/responses/yaasAware_403'
        '500':
          $ref: '#/components/responses/internalError_500'
      security:
      - oAuth2:
        - shipping.shipping_manage
    servers:
    - url: https://api.emporix.io
components:
  parameters:
    customerId:
      description: Customer unique identifier generated when the customer's account is created through the Customer Service.
      name: customerId
      in: path
      required: true
      schema:
        type: string
    site:
      description: 'Site unique identifier. A site is a specific shop.


        If the tenant owns only one shop, the value should be set to `main`.

        '
      name: site
      in: path
      required: true
      schema:
        type: string
    tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.


        **Note**: The tenant should always be written in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
  examples:
    CGRelationList:
      value:
      - customerId: C001
        groupId: group1
      - customerId: C002
        groupId: group2
    GroupCreationResponse:
      value:
        id: group1
    CGRelation:
      value:
        customerId: C001
        groupId: group1
  schemas:
    errorMessage:
      title: error
      description: Schema for API specified errors.
      type: object
      properties:
        status:
          minimum: 100
          maximum: 599
          description: original HTTP error code, should be consistent with the response HTTP code
          type: integer
        type:
          pattern: '[a-z]+[a-z_]*[a-z]+'
          description: classification of the error type, lower case with underscore eg validation_failure
          type: string
        message:
          description: descriptive error message for debugging
          type: string
        moreInfo:
          type: string
          description: link to documentation to investigate further and finding support
        errorCode:
          type: string
          description: The error code which specify the problem
        details:
          description: list of problems causing this error
          type: array
          items:
            title: errorDetail
            description: schema for specific error cause
            anyOf:
            - type: string
            - type: object
              properties:
                field:
                  description: a bean notation expression specifying the element in request data causing the error, eg shipTo[0].country, this can be empty if violation was not field specific
                  type: string
                type:
                  pattern: '[a-z]+[a-z_]*[a-z]+'
                  description: classification of the error detail type, lower case with underscore eg missing_value, this value must be always interpreted in context of the general error type.
                  type: string
                message:
                  description: descriptive error detail message for debugging
                  type: string
                moreInfo:
                  type: string
                  description: link to documentation to investigate further and finding support for error detail
      required:
      - status
      - type
    CGRelation:
      title: Customer-group relation
      description: Customer-group relation allows to assign user for specific group.
      type: object
      properties:
        customerId:
          description: Customer unique identifier.
          type: string
        groupId:
          description: Group's unique identifier.
          type: string
    ResourceCreatedResponse:
      title: Resource created
      description: Link to created resource with unique resource identifier.
      type: object
      properties:
        id:
          type: string
          description: Created resource’s unique identifier.
    CGRelationList:
      title: Collection of customer-group relation
      type: array
      items:
        $ref: '#/components/schemas/CGRelation'
  responses:
    yaasAware_403:
      description: 'Given authorization scopes are not sufficient and do not match required scopes.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Forbidden:
              value:
                status: 403
                message: User not authorized.
                type: Forbidden
                details:
                - Missing required scopes
    unauthorized_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              fault:
                type: object
                properties:
                  faultstring:
                    type: string
                  detail:
                    type: object
                    properties:
                      errorcode:
                        type: string
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
    internalError_500:
      description: 'Some server side error occurred.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Internal Server Error:
              value:
                status: 500
                message: Something went wrong while processing the request. Please contact the administrator.
                errorCode: ENTITY-500001
                moreInfo: ''
                type: internal_service_error
    resourceConflict_409:
      description: 'Creation failed because there was a conflict with another resource. Details of the error are included in the response payload.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Conflict:
              value:
                status: 409
                message: The requested resource could not be updated due to server-side validation.
                moreInfo: ''
                type: conflict_resource
    yaasAware_400:
      description: Request syntactically incorrect. Details of the error are included in the response payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Bad request:
              value:
                status: 400
                message: There are validation problems, see details section for more information
                moreInfo: ''
                type: validation_violation
                details:
                - field: tenant
                  message: size must be between 2 and 16
                  type: invalid_header
    notFound_404:
      description: 'The requested resource does not exist.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
          examples:
            Not Found:
              value:
                status: 404
                message: The requested URI does not map to a single element resource.
                errorCode: ENTITY-GET-404001
                moreInfo: ''
                type: element_resource_non_existing
  securitySchemes:
    oAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.emporix.io/oauth/token
          scopes:
            shipping.shipping_manage: Needed to manage shipping settings.
            shipping.shipping_read: Needed to read shipping settings.
x-refined-from:
- emporix-shipping-openapi.yml
- emporix-shipping-openapi.yml
