openapi: 3.2.0
info:
  title: Emporix Category Resources API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Category Resources across 2 of this provider''s published API definitions: emporix-category-tree-openapi.yml, emporix-category-tree-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2:
  - category.category_manage
  - category.category_read_unpublished
  - category.category_publish
  - category.category_unpublish
tags:
- name: Category Resources
  description: Manage Categories
paths:
  /category/{tenant}/categories:
    get:
      tags:
      - Category Resources
      summary: Retrieving a list of categories
      description: 'Retrieves a list of categories for a given tenant.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: GET-category-tree-list-categories
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: showRoots
        in: query
        description: 'If set to `true`, only root categories (categories without parents) are retrieved.

          Possible values:

          * `true`

          * `false`

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: pageNumber
        in: query
        description: 'Page number to be retrieved. The number of the first page is 1.

          **Note**: If the `pageNumber` parameter is passed, size of the pages must be specified in the `pageSize` parameter.

          '
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: 'Number of export files to be retrieved per page.

          '
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 60
      - name: sort
        in: query
        description: 'List of properties used to sort the results, separated by commas. This list is validated against available fields. Sorting by deprecated field is forbidden.

          Possible values:

          * `{fieldName}:ASC`

          * `{fieldName}:DESC`

          * `{fieldName}:ASC,{fieldName2}:DESC`

          * `{internationalizedFieldName.en}:ASC` - contains localized field name and extension. Valid only if Accepted-language header contains this extension and it is supported by configuration of the tenant. If all language are accepted (Accept-language=''*'') then extension must exist in tenant configuration. No other sorting are allowed for this specific internationalized field.

          * `{internationalizedFieldName}:ASC` - contains only localized field name. Extension will be deducted based on Accept-language header. If all language are accepted (Accept-language=''*'') then extension is taken from tenant configuration and is equal to default language. In other case the language with highest priority is taken. No other sorting are allowed for this specific localized field.

          '
        schema:
          type: string
          example: '{fieldName}:ASC,{fieldName2}:DESC'
      - name: code
        in: query
        description: 'Search by the code value. The equal case insensitive operator is used for this parameter therefore the provided value must exactly match the stored value.

          '
        schema:
          type: string
          example: 3A001
      - name: localizedName
        in: query
        description: 'Search by the localizedName of the categories, it is conformed against all of the specified accepted-languages.

          '
        schema:
          type: string
          example: Example category name
      - name: localizedDescription
        in: query
        description: 'Search by the localizeDescription of the categories, it is conformed against all of the specified accepted-languages.

          '
        schema:
          type: string
          example: Example category description
      - name: localizedSlug
        in: query
        description: 'Search by the localizedSlug of the categories, it is conformed against all of the specified accepted-languages.

          '
        schema:
          type: string
          example: Example category slug
      - name: ecn
        in: query
        description: 'Search by the ECN value. The equal operator is used for this parameter therefore the provided value must exactly match the stored value.

          '
        schema:
          type: string
          example: 3A001
      - name: validityFrom
        in: query
        description: 'Search by categories with ''validity.from'' date field which is after specified value. It must follow the pattern: ''yyyy-MM-dd''.

          '
        schema:
          type: string
          example: '2022-11-01'
      - name: validityTo
        in: query
        description: 'Search by categories with ''validity.to'' date field which is before than specified value. It must follow the pattern: ''yyyy-MM-dd''.

          '
        schema:
          type: string
          example: '1997-11-01'
      - name: metadataModifiedAt
        in: query
        description: 'Search by categories with ''metadata.modifiedAt'' date field which is after specified value. It must follow the pattern: ''yyyy-MM-dd''.

          '
        schema:
          type: string
          example: '2022-01-28'
      - name: q
        in: query
        description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'List of properties used to project and sort the results, separated by commas.

          Possible values:

          * `*` - each internationalized field is returned as a map containing all available (specified in tenant configuration) translations. This is also the default behaviour if the header is not set.

          * `en`, `en,de` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown. First language is the one with highest priority.

          * `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      - name: X-Total-Count
        in: header
        description: 'The header value indicates if the total count of entities should be returned.

          Possible values:

          * `true`

          * `false`

          Default value: `false`

          '
        schema:
          type: boolean
          example: true
          default: false
      responses:
        '200':
          description: The request was successful. The categories are returned.
          headers:
            X-Total-Count:
              description: Total amount of categories.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryList'
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 400
                    status: Bad Request
                    message: Accept-Language validation failed.
                    details:
                    - 'Following languages are not supported: ''ru'''
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_read_unpublished'
        '404':
          description: Category with the specified categoryId does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    resourceId: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
                    code: 404
                    status: Not Found
                    message: Error while getting category
                    details:
                    - Category with id '084bcaf6-66b8-4ddd-9489-65c5f6449e94' not found
      security: []
    post:
      tags:
      - Category Resources
      summary: Creating a new category
      description: 'Creates a new category.

        Creating category as a root may be achieved by adding the ''parentId'' field with a ''root'' value or by not providing the ''parentId'' in the payload.

        ***

        ### Additional scope info


        * `category.category_publish` - Only required if you want to publish the category when creating it.'
      operationId: POST-category-tree-create-category
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: publish
        in: query
        description: 'If set to `true` category may be published when updated, otherwise may be unpublished. It must match value of ''published'' field of the request body.

          Possible values:

          * `true`

          * `false`

          **Note**: To publish a category you need to have `category.category_publish` scope.

          **Note**: To unpublish a category you need to have `category.category_unpublish` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: Content-Language
        in: header
        description: 'The Content-Language request HTTP header defines language(s) that can be used in the payload. Request body may contain only translations that are matching the languages specified in the header. Possible values:

          * `*` - request body may contain translations for all languages specified in tenant configuration. This is also the default behaviour if the header is not set.

          * `en`, `en,de`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - request body may contain only translations for languages specified in the header (if they are available in tenant configuration).


          **Note**: For category requests, localized fields (such as `localizedName`, `localizedDescription`, `localizedSlug`) must always be provided as maps of language codes to values, regardless of the Content-Language header value.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              Regular category create:
                value:
                  parentId: 056bcaf6-66b8-4ddd-9489-65c5f6449e74
                  localizedName:
                    en: Floor Care
                    de: Bodenpflege
                  localizedDescription:
                    en: Floor Care
                    de: Bodenpflege
                  localizedSlug:
                    en: Floor-Care
                    de: Bodenpflege
                  ecn:
                  - AX6784
                  - '123078'
                  - SJUIOKM
                  validity:
                    from: '2022-01-05T12:44:51.871Z'
                    to: '2022-12-05T23:59:59.000Z'
                  position: 5
                  published: true
                  mixins: {}
              Root category create 1:
                value:
                  localizedName:
                    en: Floor Care
                    de: Bodenpflege
                  localizedDescription:
                    en: Floor Care
                    de: Bodenpflege
                  localizedSlug:
                    en: Floor-Care
                    de: Bodenpflege
                  ecn:
                  - AX6784
                  - '123078'
                  - SJUIOKM
                  validity:
                    from: '2022-01-05T12:44:51.871Z'
                    to: '2022-12-05T23:59:59.000Z'
                  position: 5
                  published: true
                  mixins: {}
              Root category create 2:
                value:
                  parentId: root
                  localizedName:
                    en: Floor Care
                    de: Bodenpflege
                  localizedDescription:
                    en: Floor Care
                    de: Bodenpflege
                  localizedSlug:
                    en: Floor-Care
                    de: Bodenpflege
                  ecn:
                  - AX6784
                  - '123078'
                  - SJUIOKM
                  validity:
                    from: '2022-01-05T12:44:51.871Z'
                    to: '2022-12-05T23:59:59.000Z'
                  position: 5
                  published: true
                  mixins: {}
              Classification category:
                value:
                  type: CLASSIFICATION
                  code: 3A001
                  parentId: root
                  localizedName:
                    en: Floor Care
                    de: Bodenpflege
                  localizedDescription:
                    en: Floor Care
                    de: Bodenpflege
                  localizedSlug:
                    en: Floor-Care
                    de: Bodenpflege
                  ecn:
                  - AX6784
                  - '123078'
                  - SJUIOKM
                  validity:
                    from: '2022-01-05T12:44:51.871Z'
                    to: '2022-12-05T23:59:59.000Z'
                  position: 5
                  published: true
                  ownClassificationMixins:
                  - name: Classification Mixin
                    schemaUrl: https://res.cloudinary.com/saas-ag/raw/upload/emporix-docs/toolsClassification_v1.json
                    required: false
                  mixins: {}
        required: true
      responses:
        '201':
          description: The category has been successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryIdResponse'
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 400
                    status: Bad Request
                    message: Constraint validation failed
                    details:
                    - Category slug contains unsupported languages
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_manage'
        '409':
          description: Duplicated ECN value - given ECN is already assigned to another category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 409
                    status: Conflict
                    message: Duplicated ECN value - given ECN is already assigned to another category.'
                    details: []
      security:
      - OAuth2:
        - category.category_manage
        - category.category_publish
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/categories/search:
    post:
      tags:
      - Category Resources
      summary: Searching for categories
      description: 'Searches for categories for a given tenant.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: POST-category-tree-search-categories
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: showRoots
        in: query
        description: 'If set to `true`, only root categories (categories without parents) are retrieved.

          Possible values:

          * `true`

          * `false`

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: pageNumber
        in: query
        description: 'Page number to be retrieved. The number of the first page is 1.

          **Note**: If the `pageNumber` parameter is passed, size of the pages must be specified in the `pageSize` parameter.

          '
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: 'Number of export files to be retrieved per page.

          '
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 60
      - name: sort
        in: query
        description: 'List of properties used to sort the results, separated by commas. This list is validated against available fields. Sorting by deprecated field is forbidden.

          Possible values:

          * `{fieldName}:ASC`

          * `{fieldName}:DESC`

          * `{fieldName}:ASC,{fieldName2}:DESC`

          * `{internationalizedFieldName.en}:ASC` - contains localized field name and extension. Valid only if Accepted-language header contains this extension and it is supported by configuration of the tenant. If all language are accepted (Accept-language=''*'') then extension must exist in tenant configuration. No other sorting are allowed for this specific internationalized field.

          * `{internationalizedFieldName}:ASC` - contains only localized field name. Extension will be deducted based on Accept-language header. If all language are accepted (Accept-language=''*'') then extension is taken from tenant configuration and is equal to default language. In other case the language with highest priority is taken. No other sorting are allowed for this specific localized field.

          '
        schema:
          type: string
          example: '{fieldName}:ASC,{fieldName2}:DESC'
      - name: Accept-Language
        in: header
        description: 'List of properties used to project and sort the results, separated by commas.

          Possible values:

          * `*` - each internationalized field is returned as a map containing all available (specified in tenant configuration) translations. This is also the default behaviour if the header is not set.

          * `en`, `en,de` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown. First language is the one with highest priority.

          * `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      - name: X-Total-Count
        in: header
        description: 'The header value indicates if the total count of entities should be returned.

          Possible values:

          * `true`

          * `false`

          Default value: `false`

          '
        schema:
          type: boolean
          example: true
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              search for products:
                value:
                  q: id:0310086a-d9d6-44bc-9199-ee4381bc9e4e
      responses:
        '200':
          description: The request was successful. The categories are returned.
          headers:
            X-Total-Count:
              description: Total amount of categories.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryList'
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 400
                    status: Bad Request
                    message: Accept-Language validation failed.
                    details:
                    - 'Following languages are not supported: ''ru'''
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_read_unpublished'
        '404':
          description: Category with the specified categoryId does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    resourceId: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
                    code: 404
                    status: Not Found
                    message: Error while getting category
                    details:
                    - Category with id '084bcaf6-66b8-4ddd-9489-65c5f6449e94' not found
      security: []
    servers:
    - url: https://api.emporix.io
  /category/{tenant}/categories/{categoryId}:
    get:
      tags:
      - Category Resources
      summary: Retrieving a category details
      description: 'Retrieves a specified category and its details using the category ID.


        **Note**: If you want to retrieve the category details using the `code`, you can do this by using the Retrieving a list of categories endpoint with the `code` query parameter.

        ***


        ### Additional scope info


        * `category.category_read_unpublished` - Only required if the response should contain unpublished categories.'
      operationId: GET-category-tree-retrieve-category
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: categoryId
        in: path
        description: 'Category unique identifier generated when the category is created.

          '
        required: true
        deprecated: false
        allowEmptyValue: false
        allowReserved: false
        schema:
          type: string
          example: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
        example: ''
      - name: showUnpublished
        in: query
        description: 'If set to `true`, not published categories are retrieved as well.

          Possible values:

          * `true`

          * `false`


          **Note**: To get unpublished categories you need to have `category.category_read_unpublished` scope.

          '
        schema:
          type: boolean
          example: true
          default: false
      - name: Accept-Language
        in: header
        description: 'List of properties used to project and sort the results, separated by commas.

          Possible values:

          * `*` - each internationalized field is returned as a map containing all available (specified in tenant configuration) translations. This is also the default behaviour if the header is not set.

          * `en`, `en,de` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown. First language is the one with highest priority.

          * `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5` - each internationalized field is returned as a map containing translation specified by a header value. If translation is not supported by tenant configuration then exception is thrown.

          '
        schema:
          type: string
          example: '`*`, `en`, `en,de,fr`, `en-EN`, `fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7`'
          default: '*'
      responses:
        '200':
          description: The request was successful. The category is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Request was syntactically incorrect. Details will be provided in the response payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 400
                    status: Bad Request
                    message: Accept-Language validation failed.
                    details:
                    - 'Following languages are not supported: ''ru'''
        '403':
          description: Permission denied due to insufficient rights. This may happen when request does not contain sufficient scopes for given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need a scope for this action.
                    details:
                    - 'Required scope(s): category.category_read_unpublished'
        '404':
          description: Category with the specified categoryId does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example:
                  value:
                    resourceId: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
                    code: 404
                    status: Not Found
                    message: Error while getting category
                    details:
                    - Category with id '084bcaf6-66b8-4ddd-9489-65c5f6449e94' not found
      security: []
    put:
      tags:
      - Category Resources
      summary: Upserting a category
      description: 'Fully updates a specified category by replacing existing information or creating a new one if there is no category with the given id.


        Version specified in the `metadata` field must be the same as in the database. The version can be omitted but then optimistic locking is not be enabled.

        Category-to-root promotion may be achieved by adding the `parentId` field with the `root` value or by excluding the `parentId` from the payload.

        ***

        ### Additional scope info


        * `category.category_publish` - Only required if you want to publish the category when updating it.

        * `category.category_unpublish` - Only required if you want to unpublish the category when updating it.'
      operationId: PUT-category-tree-update-category
      parameters:
      - name: tenant
        in: path
        description: 'Your Emporix tenant name.


          **Note**: The tenant should always be written in lowercase.

          '
        required: true
        schema:
          type: string
          example: saasdev2
      - name: categoryId
        in: path
        description: 'Category unique identifier either existing category id or custom id that will be used to create a new category.

          '
        required: true
        deprecated: false
        allowEmptyValue: false
        allowReserved: false
        schema:
          type: string
          example: 084bcaf6-66b8-4ddd-9489-65c5f6449e94
        example: ''
      - name: publish
        in: query
        description: 'If set to `true` category may be published when updated, otherwise may be unpublished. It must match value of ''published'' field of the request body.

          Possible values:

          * `true`

          * `false`

          **Note**: To publish a category you need to have `category.category_publish` scope.

          **Note**: To unpublish a category you need to have `category.category_unpublish` scope.

          '
