openapi: 3.2.0
info:
  title: Emporix Account and profile API
  version: ''
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
  description: 'Operations tagged Account and profile across 4 of this provider''s published API definitions: emporix-customer-management-openapi.yml, emporix-customer-service-openapi.yml, emporix-customer-management-openapi.yml, emporix-customer-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
tags:
- name: Account and profile
  description: Manage customer account details.
paths:
  /customer/{tenant}/me:
    parameters:
    - $ref: '#/components/parameters/tenant'
    patch:
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden'
      description: 'Updates a customer profile.


        **Note**: The request needs to be authorized with a customer access token.'
      operationId: PATCH-customer-update-customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatchDto'
            examples:
              Request example:
                value:
                  title: MR
                  firstName: John
                  lastName: Doe
                  contactEmail: example@customer.com
                  contactPhone: '123456789'
                  company: Emporix
                  preferredLanguage: en_US
                  preferredCurrency: EUR
                  preferredSite: main
                  b2b:
                    companyRegistrationId: 123-456-789
                  metadata:
                    version: 1
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerPatchDto'
        required: false
      security:
      - CustomerAccessToken: []
      summary: Updating a customer profile
      tags:
      - Account and profile
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Logged in customer:
                  value:
                    title: MR
                    firstName: John
                    lastName: Doe
                    contactPhone: '123456789'
                    company: Emporix
                    preferredLanguage: en_US
                    preferredCurrency: USD
                    preferredSite: default
                    metadata:
                      mixins: {}
                      version: 2
                    mixins: {}
                    customerNumber: '13869000'
                    id: '13869000'
                    accounts:
                    - id: example@customer.com
                    contactEmail: example@customer.com
                    businessModel: B2B
                    b2b:
                      companyRegistrationId: 123-456-789
                      legalEntities:
                      - id: D165356
                        name: Emporix
                        contactAssignmentId: D436432
                Anonymous customer:
                  value:
                    firstName: Anonymous
                    lastName: Anonymous
                    preferredSite: default
                    customerNumber: '00000000'
                    id: '00000000'
                    accounts: []
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden'
      description: 'Retrieves a customer profile.


        **Note**: The request needs to be authorized with a customer access token or an anonymous access token.'
      operationId: GET-customer-retrieve-customer-profile
      security:
      - CustomerAccessToken: []
      - AnonymousAccessToken: []
      summary: Retrieving a customer profile
      parameters:
      - $ref: '#/components/parameters/expand'
      tags:
      - Account and profile
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/customers:
    parameters:
    - $ref: '#/components/parameters/Api_Tenant'
    get:
      summary: Retrieving a list of customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerForSellerDto'
              examples:
                Response example:
                  $ref: '#/components/examples/CustomerResponseExample'
          headers:
            Count:
              schema:
                type: integer
              description: Number of retrieved customers.
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
      description: Retrieves a list of customer profiles.
      operationId: GET-customer-tenant-list-customers
      parameters:
      - $ref: '#/components/parameters/query_q'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/expand_2'
      security:
      - OAuth2:
        - customer.customer_read
        - customer.customer_read_own
      tags:
      - Account and profile
    post:
      summary: Creating a customer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
              examples:
                Response example:
                  value:
                    id: '34751075'
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
        '409':
          $ref: '#/components/responses/409_conflict'
      description: Creates a new customer.
      operationId: POST-customer-tenant-create-customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSignupBySellerDto'
            examples:
              Request example:
                value:
                  contactEmail: john.doe@emporix.com
                  title: MR
                  firstName: John
                  lastName: Doe
                  contactPhone: '123456789'
                  company: Emporix
                  preferredLanguage: en_US
                  preferredCurrency: EUR
                  preferredSite: main
                  b2b:
                    companyRegistrationId: 123-456-789
        required: false
        description: ''
      parameters:
      - $ref: '#/components/parameters/sendPasswordResetNotifications'
      security:
      - OAuth2:
        - customer.customer_manage
        - customer.customer_manage_own
      tags:
      - Account and profile
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/customers/search:
    post:
      summary: Searching for customers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: "A standard query parameter is used to search for specific values. \n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
            examples:
              search for products:
                value:
                  q: firstName:John
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerForSellerDto'
              examples:
                Response example:
                  $ref: '#/components/examples/CustomerResponseExample'
          headers:
            Count:
              schema:
                type: integer
              description: Number of retrieved customers.
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
      description: Searches for customer profiles.
      operationId: POST-customer-tenant-search
      parameters:
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/expand_2'
      - $ref: '#/components/parameters/tenant_2'
      security:
      - OAuth2:
        - customer.customer_read
        - customer.customer_read_own
      tags:
      - Account and profile
    servers:
    - url: https://api.emporix.io
  /customer/{tenant}/customers/{customerNumber}:
    parameters:
    - $ref: '#/components/parameters/customerNumber'
    - $ref: '#/components/parameters/tenant_2'
    put:
      summary: Upserting a customer profile
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLocation'
              examples:
                Response example:
                  value:
                    id: '34751075'
        '204':
          description: No Content - update has been successful
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
        '409':
          $ref: '#/components/responses/409_conflict'
      description: Updates a specified customer profile or creates a new one if it doesn't exist yet.
      operationId: PUT-customer-tenant-update-customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateBySellerDto'
            examples:
              Request example:
                value:
                  contactEmail: example@customer.com
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateDto'
        required: false
        description: ''
      parameters:
      - $ref: '#/components/parameters/sendPasswordResetNotifications'
      security:
      - OAuth2:
        - customer.customer_manage
        - customer.customer_manage_own
      tags:
      - Account and profile
    patch:
      summary: Updating a customer profile
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
        '404':
          $ref: '#/components/responses/404_customer'
      description: Updates a specified customer profile.
      operationId: PATCH-customer-tenant-update-customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatchBySellerDto'
            examples:
              Request example:
                value:
                  contactEmail: example@customer.com
                  active: true
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerPatchDto'
        required: false
        description: ''
      parameters: []
      security:
      - OAuth2:
        - customer.customer_manage
        - customer.customer_manage_own
      tags:
      - Account and profile
    get:
      summary: Retrieving a customer profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerForSellerDto'
              examples:
                Response example:
                  value:
                    title: MR
                    firstName: John
                    lastName: Doe
                    contactPhone: '123456789'
                    company: Emporix
                    preferredLanguage: en_US
                    preferredCurrency: EUR
                    preferredSite: main
                    metadata:
                      version: 6
                    customerNumber: '13869000'
                    id: '13869000'
                    contactEmail: example@customer.com
                    active: true
                    onHold: false
                    businessModel: B2B
                    b2b:
                      companyRegistrationId: 123-456-789
                      legalEntities:
                      - id: D165356
                        name: Emporix
                        contactAssignmentId: D436432
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
        '404':
          $ref: '#/components/responses/404_customer'
      description: Retrieves a specified customer profile.
      operationId: GET-customer-tenant-retrieve-customer
      parameters:
      - $ref: '#/components/parameters/expand_2'
      security:
      - OAuth2:
        - customer.customer_read
        - customer.customer_read_own
      tags:
      - Account and profile
    delete:
      summary: Deleting a customer profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: false
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/400_bad_request'
        '401':
          $ref: '#/components/responses/401_unauthorized'
        '403':
          $ref: '#/components/responses/403_forbidden_2'
        '404':
          $ref: '#/components/responses/404_customer'
      description: Deletes a specified customer profile and accounts associated with it.
      operationId: DELETE-customer-tenant-remove-customer
      parameters: []
      security:
      - OAuth2:
        - customer.customer_manage
        - customer.customer_manage_own
      tags:
      - Account and profile
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    ErrorMessage:
      title: ''
      description: Schema for API-specific errors.
      type: object
      properties:
        status:
          minimum: 100
          maximum: 599
          description: Original HTTP error code. It should be consistent with the HTTP response code.
          type: integer
        type:
          pattern: '[a-z]+[a-z_]*[a-z]+'
          description: 'Classification of the error type.

            **Note:** The error type should be written in lowercase and include underscores, for example `validation_failure`.'
          type: string
        message:
          description: Descriptive error message for debugging purposes.
          type: string
        moreInfo:
          type: string
          description: More information (such as a link to the documentation) for investigating further and getting support.
        details:
          description: List of problems causing the error.
          type: array
          items:
            title: errorDetail
            description: Specific error cause.
            type: object
            properties:
              field:
                description: 'Element in request data which is causing the error, for example `category.name`.

                  If the violation was not field-specific, this field will be empty.'
                type: string
              type:
                pattern: '[a-z]+[a-z_]*[a-z]+'
                description: 'Classification of the specific error cause. This value should always be interpreted within the context of the general error type.

                  **Note:** The error type should be written in lowercase and include underscores, for example `missing_value`.'
                type: string
              message:
                description: Descriptive error message for debugging purposes.
                type: string
              moreInfo:
                type: string
                description: More information (such as a link to the documentation) for investigating further and getting support.
    Customer:
      type: object
      description: Customer profile.
      properties:
        id:
          type: string
          description: Customer unique identifier generated when the customer profile is created.
        customerNumber:
          type: string
          description: Customer unique number generated when the customer profile is created.
        title:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        company:
          type: string
        preferredLanguage:
          type: string
          default: en_US
          description: Customer preferred language.
        preferredCurrency:
          type: string
          default: USD
          minLength: 3
          maxLength: 3
          description: Customer's preferred currency, compliant with the ISO 4217 standard.
        preferredSite:
          type: string
          default: main
          description: Customer preferred site.
        accounts:
          type: array
          description: List of accounts associated with the customer profile.
          items:
            $ref: '#/components/schemas/AccountId'
        addresses:
          type: array
          description: List of customer addresses.
          items:
            $ref: '#/components/schemas/Address'
        defaultAddress:
          $ref: '#/components/schemas/Address'
        businessModel:
          type: string
          enum:
          - B2B
          - B2C
          description: Property indicating business model of customer. When customer is assigned to any company then it is `B2B`. Otherwise it is `B2C`.
        b2b:
          $ref: '#/components/schemas/B2BGet'
        mixins:
          type: object
          description: Customer account additional properties.
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/DefaultDtoMetadata'
        lastLogin:
          type: string
          description: 'Customer last login date. '
          format: date-time
    CustomerPatchDto:
      allOf:
      - $ref: '#/components/schemas/CustomerUpdateDto'
      - type: object
        properties:
          contactEmail:
            type: string
            description: Contact email address. Cannot be unset once a value is present.
    DefaultDtoMetadata:
      title: DefaultDtoMetadata
      type: object
      allOf:
      - $ref: '#/components/schemas/BasicMetadataDto'
      - type: object
        properties:
          version:
            type: integer
    B2BCreate:
      type: object
      description: Additional properties for B2B customer. If the `companyRegistrationId` property is provided, an additional validation for customer details executes - `firstName`, `lastName` and `company` values have to be provided.
      properties:
        companyRegistrationId:
          type: string
          description: Registration number of the company.
    CustomerCommonDto:
      title: CustomerCommonDto
      type: object
      properties:
        title:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        contactPhone:
          type: string
        company:
          type: string
        preferredLanguage:
          type: string
          default: en_US
          description: Customer preferred language.
        preferredCurrency:
          type: string
          default: USD
          description: Customer's preferred currency, compliant with the ISO 4217 standard.
          minLength: 3
          maxLength: 3
        preferredSite:
          type: string
          default: main
          description: Customer preferred site.
        b2b:
          $ref: '#/components/schemas/B2BCreate'
        metadata:
          $ref: '#/components/schemas/DefaultDtoMetadata'
        mixins:
          type: object
          description: Customer account additional properties.
          additionalProperties: true
    AccountId:
      type: object
      properties:
        id:
          type: string
          description: Customer email address.
        providerId:
          type: string
          description: 'Customer account unique identifier generated by an external identity provider.


            **Note**: This field is only applicable if the user has been registered through social login.'
    B2BGet:
      type: object
      description: Additional properties for B2B customer. If the `companyRegistrationId` property is provided, an additional validation for customer details executes - `firstName`, `lastName` and `company` values have to be provided.
      properties:
        companyRegistrationId:
          type: string
          description: Registration number of the company.
        legalEntities:
          type: array
          items:
            properties:
              id:
                type: string
                description: ID of legal entity.
              name:
                type: string
                description: Name of legal entity.
              contactAssignmentId:
                type: string
                description: ID of contact assignment.
    CustomerUpdateDto:
      allOf:
      - $ref: '#/components/schemas/CustomerCommonDto'
      - type: object
        properties:
          contactEmail:
            type: string
    BasicMetadataDto:
      title: DefaultDtoMetadata
      type: object
      properties:
        mixins:
          type: object
          additionalProperties: true
      description: Links to mixin schemas.
    Address:
      type: object
      description: Customer address information.
      properties:
        id:
          type: string
          description: Customer address' unique identifier generated when the address is added to the customer account.
        contactName:
          type: string
        companyName:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        streetAppendix:
          type: string
        extraLine1:
          type: string
        extraLine2:
          type: string
        extraLine3:
          type: string
        extraLine4:
          type: string
        zipCode:
          type: string
        city:
          type: string
        country:
          type: string
          maxLength: 2
          minLength: 2
        state:
          type: string
        contactPhone:
          type: string
        isDefault:
          type: boolean
          default: false
          description: Flag indicating whether the address is the customer default address.
        tags:
          type: array
          description: ''
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/DefaultDtoMetadata'
        mixins:
          type: object
          description: Customer address' additional properties.
          additionalProperties: true
      required:
      - contactName
    CustomerForSellerDto:
      title: CustomerForSellerDto
      allOf:
      - $ref: '#/components/schemas/CustomerCommonDto_2'
      - type: object
        properties:
          customerNumber:
            type: string
            description: Customer unique number generated when the customer profile is created.
          id:
            type: string
            description: Customer unique identifier generated when the customer profile is created.
          defaultAddress:
            $ref: '#/components/schemas/Address_2'
          accounts:
            type: array
            description: List of accounts associated with the customer profile.
            items:
              $ref: '#/components/schemas/AccountId'
          addresses:
            type: array
            description: List of customer addresses.
            items:
              $ref: '#/components/schemas/Address_2'
          contactEmail:
            type: string
          active:
            type: boolean
            description: Flag indicating whether the customer profile is active.
          onHold:
            type: boolean
            description: Flag indicating whether the customer profile is suspended.
          email:
            type: string
            description: Customer email address.
          b2b:
            allOf:
            - $ref: '#/components/schemas/B2BGet_2'
          businessModel:
            type: string
            enum:
            - B2B
            - B2C
            description: Property indicating business model of customer. When customer is assigned to any company then it is `B2B`. Otherwise it is `B2C`.
          metadataCreatedAt:
            type: string
            description: Customer creation date.
    B2BCreate_2:
      type: object
      description: Additional properties for B2B customer.
      properties:
        companyRegistrationId:
          type: string
          description: Registration number of the company.
    CustomerCreateDto:
      type: object
      properties:
        title:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        contactPhone:
          type: string
        company:
          type: string
        preferredLanguage:
          type: string
          default: en_US
          description: Customer preferred language.
        preferredCurrency:
          type: string
          default: USD
          description: Customer preferred currency, compliant with the ISO 4217 standard.
          minLength: 3
          maxLength: 3
        preferredSite:
          type: string
          default: main
          description: Customer preferred site.
        type:
          type: string
          description: 'User type. Supported values are: `CUSTOMER` and `CONTACT`. If the field is empty then the user is considered as a customer.'
        photoUrl:
          type: string
          description: Url of a picture.
        b2b:
          allOf:
          - $ref: '#/components/schemas/B2BCreate_2'
        metadata:
          $ref: '#/components/schemas/BasicMetadataDto'
        mixins:
          type: object
          description: Customer account's additional properties. The property is not returned by default. In order to return the mixins property use `expand=mixin:*` query param.
          additionalProperties: true
        restriction:
          $ref: '#/components/schemas/Restriction'
    B2BGet_2:
      allOf:
      - $ref: '#/components/schemas/B2BCreate_2'
      properties:
        legalEntities:
          type: array
          items:
            properties:
              id:
                type: string
                description: ID of legal entity.
              name:
                type: string
                description: Name of legal entity.
              contactAssignmentId:
                type: string
                description: ID of contact assignment.
    Restriction:
      type:
      - string
      - 'null'
      description: "Access control identifier that determines who can view or manage the customer.\n\n**Purpose**: Restricts customer visibility based on scope permissions. Only users/applications \nwith matching restriction scopes can access customers with a specific restriction value.\n\n**Access Control**:\n- *Reading*: Users can only query and view customers with the `restriction` value that matches one of their authorized restrictions.\n\n**Validation**: The value must exist in the tenant's configured list of valid restrictions.\n\n**Site Synchronization**: If the `restriction` property is not set with tenant configuration property `enableSyncBetweenRestrictionsAndSiteCodes` set to `true`, the `restriction` field automatically syncs with `preferredSite` property.\n"
      example: DE
    CustomerSignupBySellerDto:
      allOf:
      - $ref: '#/components/schemas/CustomerCreateDto'
      - type: object
        properties:
          id:
            type: string
            description: Custom customer identifier. If not provided, it is automatically generated.
            minLength: 1
            maxLength: 66
            pattern: ^[a-zA-Z0-9_-]$
          contactEmail:
            type: string
          password:
            type: string
            description: Initial password for customer
    CustomerUpdateBySellerDto:
      allOf:
      - $ref: '#/components/schemas/CustomerCommonDto_2'
      - type: object
        properties:
          contactEmail:
            type: string
          active:
            type: boolean
          onHold:
            type: boolean
    CustomerCommonDto_2:
      type: object
      allOf:
      - $ref: '#/components/schemas/CustomerCreateDto'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/DefaultDtoMetadata'
    Address_2:
      type: object
      description: Customer address information.
      properties:
        id:
          type: string
          description: Customer address unique identifier generated when the address is added to the customer account.
        contactName:
          type: string
        companyName:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        streetAppendix:
          type: string
        extraLine1:
          type: string
        extraLine2:
          type: string
        extraLine3:
          type: string
        extraLine4:
          type: string
        zipCode:
          type: string
        city:
          type: string
        country:
          type: string
          maxLength: 2
          minLength: 2
