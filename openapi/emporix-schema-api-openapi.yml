openapi: 3.2.0
info:
  title: Emporix Schema API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Schema across 2 of this provider''s published API definitions: emporix-schema-openapi.yml, emporix-schema-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2: []
tags:
- name: Schema
paths:
  /schema/{tenant}/schemas:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      tags:
      - Schema
      summary: Creating a schema
      description: Creates a schema entity and generates json-schema representation which is then uploaded to cloudinary repository.
      operationId: POST-schema-create-schema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCreation'
            examples:
              Schema:
                value:
                  name:
                    en: Product Custom Attributes
                  types:
                  - PRODUCT
                  attributes:
                  - key: weight
                    name:
                      en: Weight of a product
                    description:
                      en: The exact weight of a product in grams.
                    type: TEXT
                    metadata:
                      readOnly: true
                      required: true
                  - key: size
                    name:
                      en: Size of a product
                    description:
                      en: The exact size of a product. Possible values are S, M, L.
                    type: ENUM
                    metadata:
                      readOnly: true
                      required: true
                    values:
                    - value: S
                    - value: M
                    - value: L
                  - key: advertisement
                    name:
                      en: Advertisement of a product
                    description:
                      en: A localized advertisement of a product.
                    type: TEXT
                    metadata:
                      localized: true
                      required: true
              Schema Array:
                value:
                  name:
                    en: Product Custom Attributes
                  types:
                  - PRODUCT
                  attributes:
                  - key: arrDecimal
                    name:
                      en: Array Decimal
                    type: ARRAY
                    arrayType:
                      type: DECIMAL
                    metadata: {}
                  - key: arrText
                    name:
                      en: Array Text
                    type: ARRAY
                    arrayType:
                      type: TEXT
                      localized: true
                    metadata: {}
                  - key: arrDateTime
                    name:
                      en: Array Date Time
                    type: ARRAY
                    arrayType:
                      type: DATE_TIME
                    metadata: {}
                  - key: arrEnum
                    name:
                      en: Array Enum
                    type: ARRAY
                    arrayType:
                      type: ENUM
                      values:
                      - value: S
                      - value: M
                      - value: L
                    metadata: {}
              Schema Object:
                value:
                  name:
                    en: Product Custom Attributes
                  types:
                  - PRODUCT
                  attributes:
                  - key: person
                    name:
                      en: Person
                    type: OBJECT
                    metadata: {}
                    attributes:
                    - key: name
                      name:
                        en: Name
                      type: TEXT
                      metadata: {}
                    - key: age
                      name:
                        en: Age
                      type: NUMBER
                      metadata: {}
                    - key: address
                      name:
                        en: Address
                      type: OBJECT
                      metadata: {}
                      attributes:
                      - key: street
                        name:
                          en: Street
                        metadata: {}
                        type: TEXT
                      - key: city
                        name:
                          en: City
                        type: TEXT
                        metadata: {}
                      - key: zipcode
                        name:
                          en: Zip Code
                        type: TEXT
                        metadata: {}
        description: ''
      responses:
        '201':
          description: The request was successful. The Schema has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              examples:
                Schema created:
                  value:
                    id: e241dc9e-a3f6-4573-bb01-a8ae21d2d4ae
        '400':
          $ref: '#/components/responses/Bad_request_400_cl'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          description: Permission denied due to insufficient rights. This may happen when the request does not contain sufficient scopes for the given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need to choose the required scope to complete this action.
                    details:
                    - message: 'Required scope(s): schema.schema_manage'
        '409':
          $ref: '#/components/responses/Conflict_409'
      security:
      - OAuth2:
        - schema.schema_manage
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
    get:
      summary: Retrieving all schemas
      description: Retrieves all schemas. You can filter the results with query parameters.
      tags:
      - Schema
      responses:
        '200':
          description: ''
          headers:
            X-Total-Count:
              description: Total amount of schemas for given criteria.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemasResponse'
              examples:
                Schemas:
                  $ref: '#/components/examples/SchemasResponse'
        '400':
          $ref: '#/components/responses/Bad_request_400'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
      operationId: GET-schema-retrieve-schemas
      parameters:
      - $ref: '#/components/parameters/trail_xTotalCount_header'
      - $ref: '#/components/parameters/trait_acceptLanguage_header'
      - $ref: '#/components/parameters/trait_paged_pageNumber'
      - $ref: '#/components/parameters/trait_paged_pageSize'
      - $ref: '#/components/parameters/trait_sort'
      - $ref: '#/components/parameters/trait_q_param'
      - $ref: '#/components/parameters/trait_fields'
      - name: type
        in: query
        description: 'Filters schemas by type. Possible types to specify, AVAILABILITY, CART, CART_ITEM, CATEGORY, COMPANY, COUPON, CUSTOMER, CUSTOMER_ADDRESS, LOCATION, ORDER, ORDER_ENTRY, PRODUCT, QUOTE, RETURN, PRICE_LIST, SITE, CUSTOM_ENTITY, VENDOR, VENDOR_LOCATION, MEDIA. When the newest version of the schema is of different type than the previous one and the previous one matches the type specified in this query param, then the previous version is returned.

          '
        schema:
          type: string
    servers:
    - url: https://api.emporix.io
  /schema/{tenant}/schemas/{id}:
    parameters:
    - $ref: '#/components/parameters/tenant'
    - $ref: '#/components/parameters/id'
    - $ref: '#/components/parameters/trait_schemaVersion'
    get:
      summary: Retrieving a schema
      description: Retrieves a single schema.
      tags:
      - Schema
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
              examples:
                Schema:
                  $ref: '#/components/examples/SchemaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/Not_Found_404'
      operationId: GET-schema-retrieve-schema
      parameters:
      - $ref: '#/components/parameters/trait_acceptLanguage_header'
    delete:
      summary: Deleting a schema
      description: Deletes a single schema. It deletes just a database entry. The cloudinary reference file remains untouched.
      tags:
      - Schema
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
      operationId: DELETE-schema-remove-schema
      security:
      - OAuth2:
        - schema.schema_manage
    put:
      summary: Updating a schema
      description: Updates a single schema. Each update releases a new version of json schema file.
      tags:
      - Schema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaUpdate'
            examples:
              Schema:
                value:
                  name:
                    en: Product Custom Attributes
                  types:
                  - PRODUCT
                  attributes:
                  - key: weight
                    name:
                      en: Weight of a product
                    description:
                      en: The exact weight of a product in grams.
                    type: TEXT
                    metadata:
                      readOnly: true
                      required: true
                  - key: size
                    name:
                      en: Size of a product
                    description:
                      en: The exact size of a product. Possible values are S, M, L.
                    type: ENUM
                    metadata:
                      readOnly: true
                      required: true
                    values:
                    - value: S
                    - value: M
                    - value: L
                  - key: advertisement
                    name:
                      en: Advertisement of a product
                    description:
                      en: A localized advertisement of a product.
                    type: TEXT
                    metadata:
                      localized: true
                      required: true
                  metadata:
                    version: 1
        description: ''
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Bad_request_400_cl'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/Not_Found_404'
        '409':
          $ref: '#/components/responses/Conflict_409'
      operationId: PUT-schema-update-schema
      security:
      - OAuth2:
        - schema.schema_manage
      parameters:
      - $ref: '#/components/parameters/trait_contentLanguage_header'
    servers:
    - url: https://api.emporix.io
  /schema/{tenant}/schemas/file:
    parameters:
    - $ref: '#/components/parameters/tenant'
    post:
      tags:
      - Schema
      summary: Providing a file
      description: Validates and parses provided json schema file. When the file is valid, it returns a json which can be used either to create a new schema via POST operation or to update an existing one via PUT operation when all the missing fields are provided. It doesn't create any file and it doesn't crease a database entity.
      operationId: POST-schema-parse-schema-file
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: object
                  format: json
                  description: Content of the file.
                id:
                  type: string
                  description: Id of the existing schema. Should be null when there is no existing schema.
              required:
              - file
        description: ''
      responses:
        '200':
          description: The request was successful. The file was validated and parsed correctly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaFileResponse'
              examples:
                Schemas:
                  $ref: '#/components/examples/SchemaFileResponse'
        '400':
          $ref: '#/components/responses/Bad_request_400_cl'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          description: Permission denied due to insufficient rights. This may happen when the request does not contain sufficient scopes for the given query values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden:
                  value:
                    code: 403
                    status: Forbidden
                    message: You need to choose the required scope to complete this action.
                    details:
                    - message: 'Required scope(s): schema.schema_manage'
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    ErrorResponse:
      required:
      - code
      - message
      - status
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        errorCode:
          type:
          - string
          - 'null'
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              type:
                type: string
              message:
                type: string
              moreInfo:
                type: string
    SchemasResponse:
      type: array
      items:
        $ref: '#/components/schemas/SchemaResponse'
    Localized:
      type: boolean
      description: Whether the attribute is localized or not. Only attributes of 'TEXT' type can be localized.
    SchemaResponse:
      allOf:
      - $ref: '#/components/schemas/AbstractSchemaResponse'
      - type: object
        properties:
          attributes:
            type: array
            description: List of attributes related to the schema.
            items:
              $ref: '#/components/schemas/SchemaAttribute'
    SchemaAttributeValue:
      type: object
      description: 'Value of the attribute. Valid for `ENUM` and `REFERENCE` types.


        For `ENUM` type, the value represents one of the allowed enum values.


        For `REFERENCE` type, the value represents the reference type (e.g., `PRODUCT`, `ORDER`, `ORDER_ENTRY`, `CART`, `CART_ITEM`, `PRICE`, `CUSTOMER`, `COMPANY`, `MEDIA`, `PRICE_LIST`, `CUSTOMER_SEGMENT`, `CATEGORY`, or any custom schema type).

        '
      properties:
        value:
          type: string
      required:
      - value
    SchemaAttribute:
      type: object
      description: Schema attribute.
      properties:
        key:
          type: string
          description: Unique key of the attribute.
        name:
          type: object
          description: Localized schema name in a form of a map of translations.
        description:
          type: object
          description: Localized schema description in a form of a map of translations.
        type:
          $ref: '#/components/schemas/SchemaAttributeType'
        precision:
          type: number
          description: 'Decimal precision for attributes of `DECIMAL` type. Defines the allowed decimal step for attribute values

            (for example `0.1`, `0.01`, `0.001`).

            Allowed values:

            * `-1` – no precision constraint

            * a positive decimal step of the form `0.1`, `0.01`, `0.001`, and so on (`10^-n` where `n >= 1`)

            This property can only be provided when `type` is `DECIMAL` (or, for arrays, when `arrayType.type` is `DECIMAL`).

            If omitted for a `DECIMAL` attribute, the default precision `0.01` is applied.

            '
          default: 0.01
          example: 0.01
        metadata:
          $ref: '#/components/schemas/SchemaAttributeMetadata'
        values:
          type: array
          description: List of available values for the attribute. Only valid for `ENUM` and `REFERENCE` type.
          items:
            $ref: '#/components/schemas/SchemaAttributeValue'
        attributes:
          type: array
          description: Object's properties. It can only be provided for attribute of `OBJECT` type.
          items:
            $ref: '#/components/schemas/SchemaAttribute'
        arrayType:
          type: object
          description: Contains information about the type used inside an array. It can only be provided for attribute of `ARRAY` type.
          properties:
            type:
              $ref: '#/components/schemas/SchemaAttributeType'
            values:
              type: array
              description: List of available values for the attribute. Only valid for `ENUM` and `REFERENCE` type.
              items:
                $ref: '#/components/schemas/SchemaAttributeValue'
            localized:
              $ref: '#/components/schemas/Localized'
          required:
          - type
      required:
      - key
      - name
      - type
      - metadata
    SchemaCreation:
      allOf:
      - $ref: '#/components/schemas/SchemaRequest'
      - type: object
        properties:
          id:
            type: string
            description: Identifier of the schema.
    IdResponse:
      type: object
      properties:
        id:
          type: string
          description: ID of the generated document.
      example:
        id: e343dc9e-a3f6-4573-bb01-a8ae21d2d4ae
      description: Id of the created schema.
    SchemaFileResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the schema.
        attributes:
          type: array
          description: List of attributes related to the schema.
          items:
            $ref: '#/components/schemas/SchemaFileAttributeResponse'
        metadata:
          allOf:
          - $ref: '#/components/schemas/SchemaMetadataUpdate'
    AbstractSchemaRequest:
      type: object
      properties:
        name:
          type: object
          description: Localized schema name in a form of a map of translations.
        types:
          type: array
          description: List of types which schema should be assigned to.
          items:
            $ref: '#/components/schemas/SchemaType'
      required:
      - name
      - types
    SchemaFileAttributeResponse:
      type: object
      description: Schema attribute.
      properties:
        key:
          type: string
          description: Unique key of the attribute.
        metadata:
          $ref: '#/components/schemas/SchemaAttributeMetadata'
        values:
          type: array
          description: List of available values for the attribute. Only valid for `ENUM` and `REFERENCE` types.
          items:
            $ref: '#/components/schemas/SchemaAttributeValue'
    SchemaMetadata:
      allOf:
      - $ref: '#/components/schemas/SchemaMetadataUpdate'
      - type: object
        description: Metadata of schema.
        properties:
          url:
            type: string
            description: Schema url of the attributes.
          createdAt:
            type: string
            description: 'Date and time when the object was created, compliant with the ISO 8601 standard. For example: `2022-03-31T09:52:15.423Z`'
          modifiedAt:
            type: string
            description: 'Date and time when the object was last modified, compliant with the ISO 8601 standard. For example: `2022-03-31T09:52:15.423Z`'
    SchemaAttributeMetadata:
      type: object
      description: Metadata of the schema attribute.
      properties:
        readOnly:
          type: boolean
          description: Whether the attribute is read-only or not.
        localized:
          $ref: '#/components/schemas/Localized'
        required:
          type: boolean
          description: Whether the attribute is required or not. Attributes of 'BOOLEAN' type cannot be required.
        nullable:
          type: boolean
          description: Whether the attribute could accept null or not.
    AbstractSchemaResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the schema.
        name:
          type: object
          description: Localized schema name in a form of a map of translations.
        types:
          type: array
          description: List of types to which schema should be assigned.
          items:
            $ref: '#/components/schemas/SchemaType'
        metadata:
          allOf:
          - $ref: '#/components/schemas/SchemaMetadata'
    SchemaType:
      type: string
      description: Type which the schema should be assigned to. Can be one of the predefined values or any custom schema type id.
      enum:
      - AVAILABILITY
      - CART
      - CART_ITEM
      - CATEGORY
      - COMPANY
      - COUPON
      - CUSTOMER
      - CUSTOMER_ADDRESS
      - LOCATION
      - ORDER
      - ORDER_ENTRY
      - PRODUCT
      - QUOTE
      - RETURN
      - PRICE_LIST
      - SITE
      - CUSTOM_ENTITY
      - VENDOR
      - VENDOR_LOCATION
      - MEDIA
    SchemaRequest:
      allOf:
      - $ref: '#/components/schemas/AbstractSchemaRequest'
      type: object
      properties:
        attributes:
          type: array
          description: List of attributes related to the schema.
          items:
            $ref: '#/components/schemas/SchemaAttribute'
      required:
      - attributes
    SchemaAttributeType:
      type: string
      description: 'Type of the attribute.


        **Note**: The `REFERENCE` type is only available for custom schema types.

        '
      enum:
      - TEXT
      - NUMBER
      - DECIMAL
      - BOOLEAN
      - DATE
      - TIME
      - DATE_TIME
      - ENUM
      - ARRAY
      - OBJECT
      - REFERENCE
    SchemaMetadataUpdate:
      type: object
      properties:
        version:
          type: number
          description: Version of the object. The value is required during update operation.
    SchemaUpdate:
      allOf:
      - $ref: '#/components/schemas/SchemaRequest'
      - type: object
        properties:
          metadata:
            $ref: '#/components/schemas/SchemaMetadataUpdate'
  parameters:
    trail_xTotalCount_header:
      name: X-Total-Count
      in: header
      required: false
      schema:
        type: boolean
        example: true
        default: false
      description: 'Flag indicating whether the total number of retrieved items should be returned.

        '
    trait_fields:
      name: fields
      in: query
      description: 'Fields to be included in the response.

        '
      schema:
        type: string
    trait_paged_pageNumber:
      name: pageNumber
      in: query
      description: 'Page number to be retrieved. The number of the first page is 1.

        '
      schema:
        default: 1
        minimum: 1
        type: integer
    trait_contentLanguage_header:
      in: header
      name: Content-Language
      description: The Content-Language request HTTP header defines language(s) of the payload.
      schema:
        type: string
        example: de
    tenant:
      name: tenant
      in: path
      required: true
      description: 'Your Emporix tenant name.


        **Note**: Always write the tenant name in lowercase.

        '
      schema:
        pattern: ^[a-z][a-z0-9]+$
        minLength: 3
        maxLength: 16
        type: string
    trait_q_param:
      name: q
      in: query
      description: "A standard query parameter is used to search for specific values.\n\n* Searching for items by string-based properties:\n  * By a field value: `q=siteCode:main`, where `siteCode` is the field name, and `main` is its desired value.\n  * By a value that is not equal to the specified value: `q=id:!=64d35aa7fa54121ca47db657`, where `id` is the field name, and `64d35aa7fa54121ca47db657` is the excluded schema ID.\n  * By a localized field value: `q=items.product.name.en:apple_lobo`, where `name` is the field name of product, `en` is the language code, and `apple_lobo` is the field value expressed in the specified language. **Note**: This query works only for localized fields, which are stored in a map format, where `key` is the language code and `value` is the translation to particular language.\n* Searching for items by a number-based property:\n  * With a specific value: `q=items.quantity.quantity:20`\n  * With a value greater than: `q=items.quantity.quantity:>20`\n  * With a value lower than: `q=items.quantity.quantity:<20`\n  * With a value greater than or equal to: `q=items.quantity.quantity:>=20`\n  * With a value lower than or equal to: `q=items.quantity.quantity:<=20`\n  * With a value within a range of values: `q=items.quantity.quantity:(>=10 AND <=20)`\\\n   where `items.quantity.quantity` is the name of the number-based field, and `20` is its querying value.\n* Searching for items by a date-based property: All number-based property queries are also valid for dates. In that case, the date should be placed within double quotes: `q=metadataCreatedAt:(>=\"2021-05-18T07:27:27.455Z\" AND <\"2021-05-20T07:27:27.455Z\")`\n* Searching for items by a boolean-based property: `q=description.multiLanguage:true`, where `description.multiLanguage` is the boolean field name, and `true` is its desired value.\n* Searching for items with a nonexistent or empty property: `q=description.en:null`, where `description.en` is the field that has its value set to `null`.\n* Searching for items with an existing property: `q=mixins.mixinName:exists`, where the specific mixin named `mixinName` exists in the database.\n* Searching for items by multiple specific values: `q=id:(5c3325baa9812100098ff48f,5c3325d1a9812100098ff494)`, where `id` is the field name, and strings within the bracket are the desired values.\n* Searching for items by multiple fields: `q=id:5c3325baa9812100098ff48f siteCode:main` where `id` and `siteCode` are field names. All objects that contain the specified values are returned. Multiple fields (separated by space) can be specified. Multiple values for each field can also be specified in the format presented earlier.\n* Searching for items with string-based properties conforming to a regex: `q=siteCode:~ain` or `q=code:(~U PL)` - in case of searching for strings with space, where `siteCode` is the name of the field, and `ain` or `U PL` is its querying regex.\n* Searching for items with a localized string-based property conforming to a regex: `items.product.name.en:~(Yoghurt im)` - where `name` is the product field name, `en` is the desired language, and `Joghurt im` is the search term.\n\nSee: [Standard Practices - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)\n"
      schema:
        type: string
        example: siteCode:{main}
    trait_acceptLanguage_header:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 'List of language codes acceptable for the response. You can specify factors that indicate which language should be retrieved if the one with a higher factor was not found in the localized fields. If a value is specified, then it must be present in the tenant configuration.

        * If the header is set to a particular language or a list of languages, all localized fields are retrieved as strings.

        * If the header is set to `*`, all localized fields are retrieved as maps of translations, where the keys are language codes and values are the fields in their respective languages.

        * If the header is empty, localized fields are retrieved in the default language defined in the Configuration Service.

        '
    trait_paged_pageSize:
      name: pageSize
      in: query
      description: 'Number of items to be retrieved per page.

        '
      schema:
        default: 60
        minimum: 1
        type: integer
    trait_schemaVersion:
      name: version
      in: query
      required: false
      schema:
        type: integer
      description: Version of the entity.
      example: 1
    trait_sort:
      name: sort
      in: query
      description: "List of properties used to sort the results, separated by colons. The order of properties indicates their priority in sorting.\n\nPossible values:\n* `{fieldName}`\n* `{fieldName}:asc`\n* `{fieldName}:desc`\n\n**Note:** If you want to sort the results by localized properties, the possible values are:\n  * `{fieldName}.{language}`\n  * `{fieldName}.{language}:asc`\n  * `{fieldName}.{language}:desc`\n\nIf the sorting direction is not specified, the fields are sorted in ascending order."
      schema:
        type: string
    id:
