    - $ref: '#/components/parameters/sort'
    - $ref: '#/components/parameters/fields'
    - $ref: '#/components/parameters/header_xTotalCount'
    get:
      summary: Listing agent requests
      operationId: GET-ai-list-requests
      responses:
        '200':
          $ref: '#/components/responses/200_resp_GET_agent_requests'
        '400':
          $ref: '#/components/responses/400_resp_common'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_resp_common'
      description: 'Retrieves agent requests based on the provided query.


        Supports offset pagination (`pageNumber`, `pageSize`) and cursor pagination (`next`, `prev`). Cursor pagination is active when `next` or `prev` is provided.


        In cursor mode:

        - `next` and `prev` cannot be used together and return `400`.

        - `pageNumber` is ignored.

        - the `X-Total-Count` request header is ignored and the `X-Total-Count` response header is not returned.


        If no sort is provided, results are returned in `_id:ASC` order. If a sort is provided, `_id:ASC` is appended as a tie-breaker when `_id` is not already part of the sort.'
      security:
      - OAuth2:
        - ai.agent_read
      tags:
      - Agent Logs
    servers:
    - url: https://api.emporix.io
  /ai-service/{tenant}/agentic/logs/requests/{requestId}:
    parameters:
    - $ref: '#/components/parameters/path_tenant'
    - schema:
        type: string
