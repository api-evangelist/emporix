                  lineTax:
                    name: STANDARD
                    rate: 19
                    grossValue: 595.0
                    netValue: 500
                  quantity: 3
              External product example:
                value:
                  itemType: EXTERNAL
                  product:
                    id: productId
                    name: Product Name
                    description: Product Description
                    sku: productSku
                    images:
                    - id: imageId
