          description: The request was successful. The cart item has been updated.
        '400':
          $ref: '#/components/responses/trait_400'
        '401':
          $ref: '#/components/responses/trait_401'
        '403':
          $ref: '#/components/responses/trait_403'
        '404':
          $ref: '#/components/responses/trait_notFound_404'
        '409':
          $ref: '#/components/responses/trait_conflict_409'
        '500':
          $ref: '#/components/responses/trait_500'
      description: Updates a specified cart item.
      operationId: PUT-cart-update-item-details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateCartItem'
            examples:
              Payload example:
                value:
                  itemYrn: '{productYrn}'
                  quantity: 5
                  price:
                    priceId: 5f59fe70fb29e20020be8f12
                    originalAmount: 9.49
                    effectiveAmount: 9.49
                    currency: EUR
                    measurementUnit:
                      quantity: 1
                      unitCode: H87
              Example with updated line price and line tax:
                summary: Update item with new external line price
                value:
                  itemType: EXTERNAL
                  price:
                    priceId: 5f59fe70fb29e20020be8f12
                    originalAmount: 9.49
                    effectiveAmount: 9.49
                    currency: EUR
                    measurementUnit:
                      quantity: 1
                      unitCode: H87
                  linePrice:
                    effectiveAmount: 1000.0
                    originalAmount: 1200.0
                    currency: EUR
                  lineTax:
                    name: STANDARD
                    rate: 19
                    grossValue: 1000.0
                    netValue: 840.0
                  quantity: 10
        required: false
      security:
      - OAuth2:
        - cart.cart_manage
      - CustomerAccessToken: []
      parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - schema:
          type: boolean
          default: false
        in: query
        name: partial
        description: '| Option  | Description |

          |---|---|

          | `true` | A partial product update will be performed. |

          | `false` | A full product replacement will be performed.|

          '
      summary: Updating a cart item
      tags:
      - Cart items
    delete:
      responses:
        '204':
          description: 'The request was successful. The item has been removed from cart.

            '
        '400':
          $ref: '#/components/responses/trait_400'
        '401':
          $ref: '#/components/responses/trait_401'
        '403':
          $ref: '#/components/responses/trait_403'
        '404':
          $ref: '#/components/responses/trait_notFound_404'
        '500':
          $ref: '#/components/responses/trait_500'
      description: Removes a specified product from cart and deletes the cart item.
      operationId: DELETE-cart-remove-item-from-cart
      security:
      - OAuth2:
        - cart.cart_manage
      - CustomerAccessToken: []
      parameters:
      - $ref: '#/components/parameters/trait_tenant'
      summary: Removing an item from cart
      tags:
      - Cart items
    servers:
    - url: https://api.emporix.io
components:
  schemas:
    externalFee:
      type: object
      required:
      - feeType
      properties:
        id:
          type: string
          description: Unique identifier of the fee.
        name:
          allOf:
          - $ref: '#/components/schemas/localizedValue'
          - type: object
            description: Fee name.
        yrn:
          type: string
          description: Unique identifier of the fee.
        feeType:
          type: string
          description: Type of the fee.
          enum:
          - PERCENT
          - ABSOLUTE
          - ABSOLUTE_MULTIPLY_ITEMQUANTITY
        feePercentage:
          type: number
          description: Value of fee as percentage. It must be provided when feeType equals `PERCENT`.
        feeAbsolute:
          type: object
          description: Value of fee as absolute. It must be provided when feeType equals `ABSOLUTE` or `ABSOLUTE_MULTIPLY_ITEMQUANTITY`.
          required:
          - currency
          - amount
          properties:
            currency:
              type: string
              description: Currency of fee absolute.
            amount:
              type: number
              description: Value of fee absolute.
        taxable:
          type: boolean
          description: Whether tax should be included to the fee or not.
        taxCode:
          type: string
          description: Tax code of the fee.
        taxValues:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the tax.
              rate:
                type: number
                description: Rate of the tax.
              taxable:
                type: number
                description: The taxable amount.
              value:
                type: object
                properties:
                  currency:
                    type: string
                    description: Currency of the tax.
                  amount:
                    type: number
                    description: Value of the tax.
    ErrorMessage:
      title: error
      description: Schema for API-specific errors.
      type: object
      properties:
        code:
          description: Original HTTP error code. It should be consistent with the HTTP response code.
          type: integer
        status:
          description: HTTP Status
          type: string
        message:
          description: Descriptive error message for debugging purposes.
          type: string
    cartItemRequest:
      type: object
      properties:
        id:
          type: string
          description: 'Cart item''s unique identifier. '
        keepAsSeparateLineItem:
          type: boolean
          description: Indicates that products are maintained as individual entries in the cart, rather than being consolidated. When identical products are added multiple times, each addition creates a new line item instead of increasing the quantity of an existing one.
        product:
          allOf:
          - $ref: '#/components/schemas/product'
          - type: object
            description: Product details. This field is required when itemType is EXTERNAL and product does not exist in Emporix system.
        itemYrn:
          type: string
          title: YRN
          minLength: 1
          description: A unique identifier of a global resource, which stores information about the resource, such as its type, ID or name of the tenant. This field should not be provided when itemType is EXTERNAL and request contains external product.
        externalFees:
          type: array
          items:
            $ref: '#/components/schemas/externalFee'
        externalDiscounts:
          type: array
          description: External discounts that should be applied to this cart item. Requires `cart.cart_manage_external_prices` scope
          items:
            $ref: '#/components/schemas/externalDiscount'
        itemType:
          allOf:
          - $ref: '#/components/schemas/itemType'
          - type: object
            description: Optional field which allows fetching external prices if set to EXTERNAL.
        taxCode:
          description: Tax code. Tax indicated in this field overrides the site's default tax value.
          type: string
        quantity:
          type: number
          minimum: 0
          format: double
          description: Quantity of the product added to cart.
        price:
          $ref: '#/components/schemas/priceRowItem'
        tax:
          allOf:
          - $ref: '#/components/schemas/taxValue'
          - type: object
            description: Tax information per unit. This field is only required when itemType is EXTERNAL and request contains external price. It's optional for the `INTERNAL` itemType.'
        linePrice:
          description: Externally calculated total line price (`unit price × quantity`). When provided, this overrides internal calculations.
          properties:
            effectiveAmount:
              type: number
              minimum: 0
            originalAmount:
              type: number
              minimum: 0
            currency:
              type: string
          required:
          - effectiveAmount
          - originalAmount
          - currency
        lineTax:
          allOf:
          - $ref: '#/components/schemas/taxValue'
          - type: object
            required:
            - netValue
            - grossValue
            - rate
          description: Externally calculated total tax for the item line. Only allowed when `itemType = EXTERNAL`.
        metadata:
          $ref: '#/components/schemas/metadataRequest'
        mixins:
          type: object
          description: ''
          additionalProperties: true
        weightDependent:
          type: boolean
          deprecated: true
          description: "Deprecated, use product `weightDependent` attribute that is stored in the database. \nIf set to `true`, the storefront displays a hint that the total price of the product may vary depending on the product’s actual weight.\n"
      required:
      - quantity
      - price
    cartItemsBatchUpdateRequest:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/cartItemRequest'
        - type: object
          required:
          - id
    couponDiscount:
      type: object
      properties:
        couponId:
          type: string
          description: ID of coupon.
        value:
          type: number
          description: Absolute value indicating how much given coupon lowered the price of given item.
    calculatedAppliedDiscount:
      title: calculatedAppliedDiscount
      type: object
      properties:
        id:
          type: string
          description: The ID of the applied discount.
        value:
          type: number
          format: double
          description: The calculated value of the discount.
        price:
          allOf:
          - $ref: '#/components/schemas/calculatedPrice'
          - type: object
            description: Applied discount's price. When discount is applied before tax the value equals `price.netValue` and `price.grossValue` for discount applied after tax.
        discountType:
          type: string
          enum:
          - PERCENT
          - ABSOLUTE
          - FREE_SHIPPING
          description: The discount type which shows how the discount was calculated. PERCENT refers to a percentage discount for example 10%. ABSOLUTE is a monetary amount.
        origin:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
          description: Indicates whether the discount is from internal coupon (INTERNAL) or external discount (EXTERNAL).
    metadataRequest:
      type: object
      description: ''
      properties:
        mixins:
          type: object
          description: Links to mixin schemas.
          additionalProperties: true
    cartItemResponse:
      description: Cart item details.
      allOf:
      - $ref: '#/components/schemas/baseCartItemResponse'
      - type: object
        properties:
          price:
            allOf:
            - $ref: '#/components/schemas/priceRow'
            - type: object
              description: '**This field is deprecated**. Please use `unitPrice` instead. The `unitPrice` field provides the same value with updated functionality.'
            deprecated: true
          linePrice:
            description: Externally calculated total line price (`unit price × quantity`). When provided, this overrides internal calculations.
            properties:
              effectiveAmount:
                type: number
                minimum: 0
              originalAmount:
                type: number
                minimum: 0
              currency:
                type: string
            required:
            - effectiveAmount
            - originalAmount
            - currency
          lineTax:
            allOf:
            - $ref: '#/components/schemas/taxValueWithQuantity'
            description: Externally calculated total tax for the item line. Only allowed when `itemType = EXTERNAL`.
            required:
            - netValue
            - grossValue
            - rate
            - quantity
          couponDiscounts:
            allOf:
            - $ref: '#/components/schemas/couponDiscounts'
            - type: object
              description: '**This field is deprecated**. Please use `calculatedPrice.totalDiscounts.appliedDiscounts` instead. The `calculatedPrice.totalDiscount.appliedDiscounts` field provides the same value with updated functionality.'
            deprecated: true
          itemPrice:
            allOf:
            - $ref: '#/components/schemas/price'
            - type: object
              description: '**This field is deprecated**. Please use `unitPrice` instead. The `unitPrice` field provides the same value with updated functionality.'
            deprecated: true
          itemTaxInfo:
            type: array
            deprecated: true
            description: '**This field is deprecated**. Please use `calculatedPrice.price` instead.'
            items:
              $ref: '#/components/schemas/taxValue'
          fees:
            allOf:
            - $ref: '#/components/schemas/feeAggregate'
            - type: object
              description: '**This field is deprecated**. Please use `calculatedPrice.fees` instead. The `calculatedPrice.fees` field provides the same value with updated functionality.'
            deprecated: true
          authorizedAmount:
            allOf:
            - $ref: '#/components/schemas/price'
            - type: object
              description: '**This field is deprecated**. Please use `calculatedPrice.upliftValue` instead. The `calculatedPrice.upliftValue` field how much should be payment authorization increased for given item.'
            deprecated: true
          totalDiscount:
            allOf:
            - $ref: '#/components/schemas/price'
            - type: object
              description: '**This field is deprecated**. Please use `calculatedPrice.totalDiscount` instead. The `calculatedPrice.totalDiscount` field provides the same value with updated functionality.'
            deprecated: true
          externalFees:
            type: array
            deprecated: true
            description: '**This field is deprecated**. Please use `calculatedPrice.fees` instead. A fee has an enum value that allows to distinguish external prices'
            items:
              $ref: '#/components/schemas/externalFee'
        required:
        - quantity
        - effectiveQuantity
    cartItemsResponse:
      type: array
      items:
        $ref: '#/components/schemas/cartItemResponse'
      description: Array of cart items with their details.
    localizedValue:
      description: Localized value which can have different structure which depends on provided `Content-Language` header.
      oneOf:
      - type: string
      - type: object
        additionalProperties:
          type: string
        example:
          en: Product
          pl: Produkt
    priceRow:
      type: object
      description: Price details.
      properties:
        priceId:
          type: string
          description: Price’s unique identifier generated when the price is created through the Price Service.
        priceListId:
          type: string
          description: Identifier of price list. The field is populated only in case when the returned prices belongs to any price list.
        yrn:
          $ref: '#/components/schemas/YRN'
        originalAmount:
          minimum: 0
          type: number
          format: double
          description: Product’s regular price per specified `measurementUnit`.
        effectiveAmount:
          minimum: 0
          type: number
          format: double
          description: Actual amount the customer will pay per specified `measurementUnit`.
        currency:
          type: string
          pattern: '[A-Z]{3}'
          minLength: 3
          maxLength: 3
          description: Three-letter currency code, compliant with the ISO 4217 standard.
        measurementUnit:
          $ref: '#/components/schemas/measurementUnit'
      required:
      - priceId
      - originalAmount
      - effectiveAmount
      - currency
    calculatedTotalDiscount:
      title: calculatedTotalDiscount
      type: object
      description: The total combined value of all applied discounts.
      properties:
        calculationType:
          type: string
          enum:
          - ApplyDiscountBeforeTax
          - ApplyDiscountAfterTax
          description: Indicates whether discounts were calculated using net or gross price values.
        value:
          type: number
          format: double
          description: The calculated amount of all discounts.
        price:
          allOf:
          - $ref: '#/components/schemas/calculatedPrice'
          - type: object
            description: Total discounts price. When discounts are applied before tax the value equals `price.netValue` and `price.grossValue` for discounts applied after tax.
        appliedDiscounts:
          type: array
          description: All applied discounts that are parts of the sum. Sum of all `discountedPrice.appliedDiscounts[].value` and `fees[].discountedPrice.appliedDiscounts[].value`.
          items:
            $ref: '#/components/schemas/calculatedAppliedDiscount'
    updateCartItem:
      type: object
      properties:
        externalFees:
          type: array
          items:
            $ref: '#/components/schemas/externalFee'
        externalDiscounts:
          type: array
          description: External discounts applied to this cart item.
          items:
            $ref: '#/components/schemas/externalDiscount'
        product:
          $ref: '#/components/schemas/updateProduct'
        itemYrn:
          $ref: '#/components/schemas/YRN'
        itemType:
          allOf:
          - $ref: '#/components/schemas/itemType'
          - type: object
            description: Optional field which allows fetching external prices if set to EXTERNAL.
        quantity:
          type: number
          minimum: 0
          format: double
          description: Quantity of the product added to cart.
        taxCode:
          description: Tax code. Tax indicated in this field overrides the site's default tax value.
          type: string
        tax:
          allOf:
          - $ref: '#/components/schemas/taxValue'
          - type: object
            description: Tax information per unit. This field is required only when the itemType is set as EXTERNAL and the request contains an external price.
        price:
          $ref: '#/components/schemas/priceRowItem'
        linePrice:
          description: Externally calculated total line price (`unit price × quantity`). When provided, this overrides internal calculations.
          properties:
            effectiveAmount:
              type: number
              minimum: 0
            originalAmount:
              type: number
              minimum: 0
            currency:
              type: string
          required:
          - effectiveAmount
          - originalAmount
          - currency
        lineTax:
          allOf:
          - $ref: '#/components/schemas/taxValue'
          description: Externally calculated total tax for the item line. Only allowed when `itemType = EXTERNAL`.
          required:
          - netValue
          - grossValue
          - rate
        metadata:
          $ref: '#/components/schemas/metadataRequest'
        mixins:
          type: object
          additionalProperties: true
    cartItemResponseProduct:
      allOf:
      - $ref: '#/components/schemas/product'
      - type: object
        properties:
          vendor:
            $ref: '#/components/schemas/vendor'
    cartItemsBatchRequest:
      type: array
      items:
        $ref: '#/components/schemas/cartItemRequest'
    updateProduct:
      type: object
      properties:
        code:
          type: string
          description: Product code.
        sku:
          type: string
          description: Product Stock Keeping Unit (SKU).
        description:
          type: string
          description: Product description.
        name:
          type: string
          description: Product name.
        localizedName:
          description: A product name represented as a map, with language as the key and the corresponding translated name as the value
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          description: List of product images.
          items:
            $ref: '#/components/schemas/productImage'
        metadata:
          $ref: '#/components/schemas/metadataRequest'
        mixins:
          type: object
          additionalProperties: true
    productImage:
      type: object
      properties:
        id:
          type: string
          description: Product image''s unique identifier, generated when the image is added through the Product Service.
        url:
          type: string
          description: Product image's URL with the file extension specified.
      required:
      - id
      - url
      description: Product image details.
    couponDiscounts:
      type: array
      description: Collection of couponId-value pairs indicating how much particular coupon lowered absolute price of given item. Coupons of FREE_SHIPPING discount type are not taken into account.
      items:
        $ref: '#/components/schemas/couponDiscount'
    calculatedPrice:
      type: object
      properties:
        netValue:
          type: number
          format: double
          description: Net value of the price, price without tax.
        grossValue:
          type: number
          format: double
          description: Gross value of the price, price with tax.
        taxValue:
          type: number
          format: double
          description: Tax value of the price, it's the actual amount of tax that has to be paid.
        taxCode:
          type: string
          description: Tax code applied to the price, a tax code is a country's set of tax rules.
        taxRate:
          type: number
          format: double
          description: Tax rate applied to the price, it's the percentage at which an individual or business is taxed.
      description: A price calculation model containing net and gross amounts along with their associated tax details.
    calculatedPriceWithDiscounts:
      allOf:
      - $ref: '#/components/schemas/calculatedPrice'
      - type: object
        properties:
          appliedDiscounts:
            type: array
            description: List of applied discounts for the calculated price.
            items:
              $ref: '#/components/schemas/calculatedAppliedDiscount'
        description: A price calculation model showing the final amount after applying discounts.
    externalDiscount:
      type: object
      description: External discount that can be applied to cart items.
      properties:
        id:
          type: string
          description: Unique identifier of the external discount.
        discountType:
          $ref: '#/components/schemas/externalDiscountType'
        value:
          type: number
          format: double
          minimum: 0.0
          maximum: 100.0
          description: Value of the discount (percentage e.g 15.00 -> 15% or absolute amount e.g 10.00 -> 10 EUR depending on the discountType).
        includeFees:
          type: boolean
          description: Flag indicating whether the discount should be also applied to fees.
        sequence:
          type: integer
          description: Sequence number determining the order in which discounts are applied. The lowest sequence number is applied first.
      required:
      - id
      - discountType
      - value
    measurementUnit:
      type: object
      description: Information about the unit by which the customer can order the product.
      properties:
        quantity:
          type: number
          minimum: 0
          description: 'Quantity of the measurement unit.


            For example, if the customer can order a product by one piece, the value should be set to `1`.'
          format: double
        unitCode:
          description: 'Code of the measurement unit by which the customer can order the product. The possible values for the `unitCode` field are explained in the table below:

            |     |     |

            | --- | --- |

            | **Value** | **Measurement unit** |

            | `H87` | Pieces |

            | `KGM` | Kilograms |

            | `GRM` | Grams |

            | `LTR` | Liters |

            | `MLT` | Milliliters |

            | `MTR` | Meters |

            | `RO` | Rolls |


            For example, if the customer can order a product by pieces, the value should be set to `H87`.'
          enum:
          - kg
          - g
          - mg
          - l
          - ml
          - lb
          - qt
          - qtr
          - gal
          - pt
          - oz
          - MTR
          - XRO
          - MLT
          - LTR
          - H87
          - KGM
          - GRM
          - HLT
          - DL
          - DAG
          - RO
          type: string
      required:
      - quantity
    batchResponse:
      type: array
      description: ''
      items:
        $ref: '#/components/schemas/singleBatchResponse'
    cartItemsBatchUpdateResponse:
      type: array
      description: Per-entry results for batch cart item updates.
      items:
        $ref: '#/components/schemas/updateCartItemsBatchEntryResponse'
    priceRowItem:
      type: object
      description: Price details.
      properties:
        priceId:
          type: string
          description: Price’s unique identifier generated when the price is created through the Price Service. This field should not be provided when itemType is EXTERNAL.
        yrn:
          $ref: '#/components/schemas/YRN'
        originalAmount:
          minimum: 0
          type: number
          format: double
          description: Product’s regular price per specified `measurementUnit`. Property can be made optional by setting `cartItemValidationSkipOriginalAmount` configuration to `true` in the configuration-service. In that case, the value is fetched from `priceId`.
        effectiveAmount:
          minimum: 0
          type: number
          format: double
          description: Actual amount the customer will pay per specified `measurementUnit`. Property can be made optional by setting `cartItemValidationSkipEffectiveAmount` configuration to `true` in the configuration-service. In that case, the value is fetched from `priceId`.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Three-letter currency code, compliant with the ISO 4217 standard. Property can be made optional by setting `cartItemValidationSkipCurrency` configuration to `true` in the configuration-service. In that case, the value is fetched from cart currency.
        measurementUnit:
          $ref: '#/components/schemas/measurementUnit'
      required:
      - priceId
      - originalAmount
      - effectiveAmount
      - currency
    YRN:
      type: string
      title: YRN
      description: A unique identifier of a global resource, which stores information about the resource, such as its type, ID or name of the tenant.
      minLength: 1
    calculatedFee:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the fee.
        origin:
          enum:
          - INTERNAL
          - EXTERNAL
          type: string
          description: INTERNAL defined in commerce engine, EXTERNAL specified when an item is added to the cart
        type:
          type: string
          enum:
          - PERCENT
          - ABSOLUTE
          - ABSOLUTE_MULTIPLY_ITEMQUANTITY
          description: Type of the fee.
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized names of the fee.
        price:
          allOf:
          - $ref: '#/components/schemas/calculatedPrice'
          - type: object
            description: The calculated fee price.
        discountedPrice:
          allOf:
          - $ref: '#/components/schemas/calculatedPriceWithDiscounts'
          - type: object
            description: The discounted fee value.
    fee:
      title: fee
      type: object
      properties:
        yrn:
          $ref: '#/components/schemas/YRN'
        name:
          $ref: '#/components/schemas/localizedValue'
        taxCode:
          type: string
        amount:
          type: number
          format: double
          minimum: 0
          description: ''
        totalTax:
          type: number
          format: double
          minimum: 0
        total:
          $ref: '#/components/schemas/total'
        taxValues:
          type: array
          items:
            $ref: '#/components/schemas/taxValue'
      required:
      - amount
      - totalTax
      - total
    itemType:
      type: string
      enum:
      - EXTERNAL
      - INTERNAL
    itemCalculatedPrice:
      type: object
      properties:
        price:
          allOf:
          - $ref: '#/components/schemas/calculatedPrice'
          - type: object
            description: The price is calculated by multiplying the unit price (taken from priceMatch) by the quantity.
          - properties:
              calculated:
                type: string
                description: Indicates how the line item price was determined. - `INTERNAL` — Calculated by Emporix using unit price × quantity. - `EXTERNAL` — Provided externally with `lineTax`.
                enum:
                - INTERNAL
                - EXTERNAL
        upliftValue:
          allOf:
          - $ref: '#/components/schemas/calculatedPrice'
          - type: object
            description: Maximum additional amount authorized for payment to cover potential price adjustments during packaging of weight-based products. For example, if the item’s `price.netValue=12`, the `upliftValue.netValue=1,2`, with 10% uplift configured. If the uplift value is not configured for an item, it's not returned in the response.
            properties:
              netValue:
                type: number
                format: double
                description: Net value of the uplift amount, value without tax.
              grossValue:
                type: number
                format: double
                description: Gross value of the uplift amount, value with tax.
              taxValue:
                type: number
                format: double
