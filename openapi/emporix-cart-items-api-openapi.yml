openapi: 3.2.0
info:
  title: Emporix Cart items API
  version: ''
  contact:
    email: documentation@emporix.com
  description: 'Operations tagged Cart items across 2 of this provider''s published API definitions: emporix-cart-openapi.yml, emporix-cart-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.emporix.io
security:
- OAuth2: []
tags:
- name: Cart items
  description: Manage Cart items
paths:
  /cart/{tenant}/carts/{cartId}/itemsBatch:
    post:
      responses:
        '200':
          description: The request was successful. Items have been added to the cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchResponse'
              examples:
                Response example:
                  value:
                  - index: 0
                    status: 201
                    id: '1'
                    headers:
                      location: /carts/612cc4783cff1d66f699b6a1/items/1
                    yrn: urn:yaas:saasag:caasproduct:product:saastest2;5c3351aea9812100098ffc60
                  - index: 1
                    status: 201
                    id: '2'
                    headers:
                      location: /carts/612cc4783cff1d66f699b6a1/items/2
                    yrn: urn:yaas:saasag:caasproduct:product:saastest2;5c3351aea9812100098ffc61
        '400':
          $ref: '#/components/responses/trait_400'
        '403':
          $ref: '#/components/responses/trait_403'
        '404':
          $ref: '#/components/responses/trait_notFound_404'
        '500':
          $ref: '#/components/responses/trait_500'
      description: Adds multiple products to the specified cart and creates cart items. The maximum batch size is 200.
      operationId: POST-cart-add-multiple-items-to-cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cartItemsBatchRequest'
            examples:
              Payload example:
                value:
                - product:
                    id: 5f5a3ce35bac380024b93cff
                    yrn: '{productYrn}'
                    name: Cherry Tomatoes
                    description: Guaranteed to be the sweetest tomato you have ever tasted! This super sweet bite sized tomato is juicy and bursting with flavor. They are great for snacking and in salads. Kids love them too!
                    images:
                    - id: dbf2f8a4-1ff6-40a9-982f-1485ddb602e0
                      url: https://res.cloudinary.com/saas-ag/image/upload/v1599749351cart/{tenant}/products/dbf2f8a4-1ff6-40a9-982f-1485ddb602e0.jpg
                  quantity: 100
                  price:
                    priceId: 5f5a3ce5fb29e20020be99c8
                    yrn: '{priceYrn}'
                    originalAmount: 4.99
                    effectiveAmount: 4.99
                    currency: EUR
                    measurementUnit:
                      quantity: 100
                      unitCode: GRM
                - product:
                    id: 5f5a3b435bac380024b93c88
                    yrn: '{productYrn}'
                    name: Black Tea
                    description: A pack of high-quality black tea to drink with your guests.
                    images:
                    - id: 4b4addad-9272-4435-83a0-4b5f1621208d
                      url: https://res.cloudinary.com/saas-ag/image/upload/v1599749351cart/{tenant}/products/4b4addad-9272-4435-83a0-4b5f1621208d.jpg
                  quantity: 1
                  price:
                    priceId: 5f5a3b45fb29e20020be9976
                    yrn: '{priceYrn}'
                    originalAmount: 2.29
                    effectiveAmount: 2.29
                    currency: EUR
                    measurementUnit:
                      quantity: 1
                      unitCode: H87
        required: false
      security:
      - OAuth2:
        - cart.cart_manage
      - CustomerAccessToken: []
      parameters:
      - $ref: '#/components/parameters/trait_tenant'
      summary: Adding multiple products to cart
      tags:
      - Cart items
    put:
      responses:
        '207':
          description: The request was successful. Items have been updated in the cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cartItemsBatchUpdateResponse'
              examples:
                Multi-Status response example:
                  value:
                  - index: 0
                    id: '1'
                    code: 204
                    status: No Content
                  - index: 1
                    id: '2'
                    code: 400
                    status: Bad Request
                    message: Invalid quantity
                    details:
                    - Quantity must be greater than zero
        '400':
          $ref: '#/components/responses/trait_400'
        '403':
          $ref: '#/components/responses/trait_403'
        '500':
          $ref: '#/components/responses/trait_500'
      description: Updates multiple cart items in the specified cart. The maximum batch size is 50.
      operationId: PUT-cart-update-multiple-items-in-cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cartItemsBatchUpdateRequest'
            examples:
              Payload example:
                value:
                - id: '1'
                  product:
                    id: 5f5a3ce35bac380024b93cff
                    yrn: '{productYrn}'
                    name: Cherry Tomatoes
                    description: Guaranteed to be the sweetest tomato you have ever tasted! This super sweet bite sized tomato is juicy and bursting with flavor. They are great for snacking and in salads. Kids love them too!
                    images:
                    - id: dbf2f8a4-1ff6-40a9-982f-1485ddb602e0
                      url: https://res.cloudinary.com/saas-ag/image/upload/v1599749351cart/{tenant}/products/dbf2f8a4-1ff6-40a9-982f-1485ddb602e0.jpg
                  quantity: 100
                  price:
                    priceId: 5f5a3ce5fb29e20020be99c8
                    yrn: '{priceYrn}'
                    originalAmount: 4.99
                    effectiveAmount: 4.99
                    currency: EUR
                    measurementUnit:
                      quantity: 100
                      unitCode: GRM
                - id: '2'
                  product:
                    id: 5f5a3b435bac380024b93c88
                    yrn: '{productYrn}'
                    name: Black Tea
                    description: A pack of high-quality black tea to drink with your guests.
                    images:
                    - id: 4b4addad-9272-4435-83a0-4b5f1621208d
                      url: https://res.cloudinary.com/saas-ag/image/upload/v1599749351cart/{tenant}/products/4b4addad-9272-4435-83a0-4b5f1621208d.jpg
                  quantity: 1
                  price:
                    priceId: 5f5a3b45fb29e20020be9976
                    yrn: '{priceYrn}'
                    originalAmount: 2.29
                    effectiveAmount: 2.29
                    currency: EUR
                    measurementUnit:
                      quantity: 1
                      unitCode: H87
        required: false
      security:
      - OAuth2:
        - cart.cart_manage
      - CustomerAccessToken: []
      summary: Updating multiple products in cart
      tags:
      - Cart items
      parameters:
      - $ref: '#/components/parameters/cartId'
      - $ref: '#/components/parameters/trait_tenant'
    servers:
    - url: https://api.emporix.io
