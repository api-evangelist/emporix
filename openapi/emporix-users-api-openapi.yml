      - OAuth2:
        - iam.permission_read
    servers:
    - url: https://api.emporix.io
  /iam/{tenant}/users/{userId}/scopes:
    parameters:
    - $ref: '#/components/parameters/tenant'
    - $ref: '#/components/parameters/userId'
    get:
      tags:
      - Users
      summary: Retrieving scopes of a specific user
      description: Retrieves all scopes granted to a user specified by id. Those are calculated based on user group assignments. For each particular group all access controls are resolved to scopes based on defined role(s) and resource(s).
      operationId: GET-iam-retrieve-user-scopes
      parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
