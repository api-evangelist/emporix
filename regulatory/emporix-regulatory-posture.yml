source: https://www.emporix.com/privacy-policy
description: >-
  Horizontal regulatory signals HARVESTED from what Emporix publishes. Nothing here decides which
  regime applies. The evidence comes from the GDPR privacy policy at www.emporix.com/privacy-policy
  (controller Emporix AG, Zug, Switzerland; DPO reachable at privacy@emporix.com) and the SafeBase-hosted
  Emporix Trust Center at security.emporix.com, which publishes a subprocessor list and shows SOC 2 and
  HIPAA certification tiles. The developer portal Terms of Use (developer.emporix.io/policies/terms-of-use)
  showed no signal language. The privacy policy covers data portability and Art. 22 automated
  decision-making only as restated GDPR data-subject rights. Neither is a cloud-switching (exit
  assistance) commitment or an AI-transparency disclosure, so neither is recorded as one. The Trust
  Center's Incident Response section is hidden and holds only SafeBase's default placeholder text, so
  no incident-notification commitment is recorded. No accessibility, SBOM, support-lifetime, GPC,
  transparency-report or data-residency statement was found.
