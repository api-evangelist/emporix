- name: emporix-frontend
  domain: frontend
  endpoint_template: https://api.emporix.io/mcp/frontend/{TENANT}/{MCP_TOKEN}/mcp
  transport: streamable-http
  tool_count: 17
  tools:
  - name: get-customer-info
    category: Customer & Account
    description: View your account information, including personal details, contact information, and saved addresses.
  - name: update-customer-profile
    category: Customer & Account
    description: Update your account information such as name, email, phone number, company details, preferred language, currency, and site preferences.
  - name: get-companies-addresses
    category: Customer & Account
    description: View all company addresses associated with your account. This is useful for B2B customers who need to manage multiple company addresses.
  - name: upsert-customer-address
    category: Customer & Account
    description: Add a new shipping or billing address to your account, or update an existing address.
  - name: get-products
    category: Product & Cart
    description: Browse and search for products in the catalog. You can filter, sort, and navigate through pages of products.
  - name: get-cart
    category: Product & Cart
    description: View the contents of your shopping cart, including all items, quantities, and prices.
  - name: modify-cart-items
    category: Product & Cart
    description: Add items to your cart, change quantities, or remove items. You can modify multiple items at once.
  - name: checkout
    category: Checkout & Payment
    description: Complete your purchase by placing an order. You need to provide your shipping address, billing address, and selected payment method.
  - name: get-payment-methods
    category: Checkout & Payment
    description: View the available payment options for your site, such as credit cards, bank transfers, or other payment methods.
  - name: get-customer-orders
    category: Order & Return
    description: View your order history. You can see past orders, filter by invoice number or order ID, and browse through multiple pages.
  - name: get-returns
    category: Order & Return
    description: View your return history. You can see all return requests, their status, and browse through multiple pages.
  - name: create-return
    category: Order & Return
    description: Request to return items from an order. You can specify which items from which orders you want to return and provide a reason.
  - name: get-quote
    category: Quote
    description: Request the details of a specific quote and its related information.
  - name: get-quotes
    category: Quote
    description: View your quote history. You can see all quotes, filter them by status (open, accepted, declined, etc.), and browse through multiple pages.
  - name: get-quote-reasons
    category: Quote
    description: View the list of available reasons you can select when declining a quote.
  - name: create-quote
    category: Quote
    description: Request a price quote for the items in your cart. You need to specify shipping and billing addresses.
  - name: update-quote
    category: Quote
    description: Respond to a quote by accepting it, declining it, or requesting changes. When declining, you can provide a reason and comment.
  notes: Runs in a customer context; requires a customer token injected by Emporix Agents on customer-initiated requests. Usable only from Emporix Agentic AI (e.g. the Frontend Agent).
