name: Emporix MCP Server
type: MCPServer
generated: '2026-10-18'
method: searched
source:
- https://developer.emporix.io/agentic-commerce-intelligence/mcp-in-emporix/mcp.md
- https://developer.emporix.io/agentic-commerce-intelligence/mcp-in-emporix/mcp/retrieving-mcp-token.md
- https://developer.emporix.io/agentic-commerce-intelligence/mcp-in-emporix/mcp/connect-cursor.md
- https://developer.emporix.io/agentic-commerce-intelligence/agentic-engineering/docs-for-ai.md
- https://github.com/emporix-shared/ai-skills/blob/main/mcp.json
status: official
official: true
description: Emporix offers a fully managed, cloud-hosted MCP Server (Streamable HTTP) with dedicated predefined servers per business domain (product, order, customer, extensibility, frontend, importtool),
  plus tenant-managed dynamic MCP servers backed by Cloud Functions (preview, billed separately). Tools returned are filtered to those the MCP token has scopes for and can be narrowed with ?tools=. Separately,
  Emporix publishes a GitBook documentation MCP server for its docs.
deployment:
  mode: remote
  endpoint: https://api.emporix.io/mcp/{domain}/{TENANT}/{MCP_TOKEN}/mcp
  transport: streamable-http
  auth: api-key
  verified: probed
  auth_detail: MCP_TOKEN is base64(clientId:secret) of a custom API key created in the Emporix Developer Portal with the MCP scope plus the scopes for the tools wanted; it is embedded in the URL path.
  probe:
    url: https://api.emporix.io/mcp/product/TENANT/MCP_TOKEN/mcp
    method: POST initialize
    http_status: 401
    body_excerpt: '{"error":"unauthorized","message":"Provided tenant/credentails are invalid or mcp scope is missing."}'
    date: '2026-10-18'
  tool_filter: ?tools=<tool-name> query parameter limits exposed tools
dynamic_servers:
  endpoint_template: https://api.emporix.io/mcp/dynamic/{TENANT}/{MCP_SERVER_ID}/{MCP_TOKEN}/mcp
  status: preview
  note: Tool catalog is tenant-managed Cloud Functions; not enumerable publicly. Requires Emporix Hosting; pay-as-you-go.
tools_evidence:
  l3: table
  evidence_url: https://developer.emporix.io/agentic-commerce-intelligence/mcp-in-emporix/mcp.md
  note: Tool names and required scopes are copied from the provider-documented tables; the live tools/list on api.emporix.io is gated (401 without tenant credentials) and was not called.
